<body>

<script>
"use strict";

/* ========== Web Audio ========== */
let audioCtx = null, audioInitialized = false;
let bgmEnabled = true, seEnabled = true;
let bgmVolume = 0.35, seVolume = 0.5;
let bgmSchedulerId = null, bgmCurrentStep = 0;
const BGM_BPM = 128, BGM_STEP_DUR = 60 / BGM_BPM / 4;
function initAudio() {
  if (audioInitialized) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC(); audioInitialized = true; startBGM();

}
let bgmGain = null, seGain = null;
function ensureGains() {
  if (!audioCtx) return;
  if (!bgmGain) {
    bgmGain = audioCtx.createGain();
    bgmGain.gain.value = bgmEnabled ? bgmVolume : 0;
    bgmGain.connect(audioCtx.destination);
  }
  if (!seGain) {
    seGain = audioCtx.createGain();
    seGain.gain.value = seEnabled ? seVolume : 0;
    seGain.connect(audioCtx.destination);
  }
}
function playTone(o) {
  if (!audioCtx || !seEnabled) return;
  ensureGains();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = o.type || "square";
  osc.frequency.setValueAtTime(o.freq || 440, t);
  if (o.freqEnd) osc.frequency.exponentialRampToValueAtTime(o.freqEnd, t + (o.dur || 0.1));
  const vol = o.vol !== undefined ? o.vol : 0.3;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.001, t + (o.dur || 0.1));
  osc.connect(g);
  if (o.filter) {
    const f = audioCtx.createBiquadFilter();
    f.type = o.filter; f.frequency.value = o.filterFreq || 1000;
    g.connect(f); f.connect(seGain);
  } else g.connect(seGain);
  osc.start(t); osc.stop(t + (o.dur || 0.1) + 0.02);
}
function playNoise(o) {
  if (!audioCtx || !seEnabled) return;
  ensureGains();
  const t = audioCtx.currentTime, dur = o.dur || 0.1;
  const bufSize = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) d[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(o.vol || 0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  const f = audioCtx.createBiquadFilter();
  f.type = o.filter || "lowpass"; f.frequency.value = o.filterFreq || 2000;
  src.connect(f); f.connect(g); g.connect(seGain);
  src.start(t); src.stop(t + dur + 0.02);
}
const sfx = {
  shoot: () => playTone({ type: "square", freq: 1200, freqEnd: 600, dur: 0.04, vol: 0.12 }),
  shootHeavy: () => playTone({ type: "square", freq: 400, freqEnd: 120, dur: 0.12, vol: 0.2 }),
  enemyHit: () => playTone({ type: "square", freq: 800, freqEnd: 400, dur: 0.03, vol: 0.08 }),
  enemyDie: () => { playNoise({ dur: 0.12, vol: 0.15, filterFreq: 3000 }); playTone({ type: "square", freq: 300, freqEnd: 80, dur: 0.12, vol: 0.12 }); },
  levelUp: () => { if (!audioCtx || !seEnabled) return; [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone({type:"square",freq:f,dur:0.15,vol:0.18}),i*80)); },
  bossAppear: () => { if (!audioCtx || !seEnabled) return; for(let i=0;i<6;i++) setTimeout(()=>playTone({type:"sawtooth",freq:80,freqEnd:60,dur:0.3,vol:0.15,filter:"lowpass",filterFreq:200}),i*150); },
  bossDie: () => { playNoise({dur:0.6,vol:0.35,filterFreq:1500}); playTone({type:"sawtooth",freq:200,freqEnd:40,dur:0.6,vol:0.3}); },
  playerHit: () => { playNoise({dur:0.2,vol:0.35,filterFreq:800}); playTone({type:"sawtooth",freq:200,freqEnd:60,dur:0.2,vol:0.25}); },
  combo: () => { playTone({type:"sine",freq:1500,dur:0.06,vol:0.15}); setTimeout(()=>playTone({type:"sine",freq:2000,dur:0.08,vol:0.12}),40); },
  quizCorrect: () => { if(!audioCtx||!seEnabled)return; playTone({type:"sine",freq:880,dur:0.12,vol:0.25}); setTimeout(()=>playTone({type:"sine",freq:1320,dur:0.18,vol:0.25}),100); },
  quizWrong: () => playTone({type:"square",freq:200,freqEnd:100,dur:0.35,vol:0.2}),
  clear: () => { if(!audioCtx||!seEnabled)return; [523,659,784,1047,1319,1047,1319,1568].forEach((f,i)=>setTimeout(()=>playTone({type:"square",freq:f,dur:0.2,vol:0.2}),i*120)); },
  gameOver: () => { if(!audioCtx||!seEnabled)return; [400,350,300,250,200,150].forEach((f,i)=>setTimeout(()=>playTone({type:"sawtooth",freq:f,dur:0.25,vol:0.18}),i*150)); },
  tap: () => playTone({ type: "square", freq: 800, dur: 0.03, vol: 0.1 }),
  coin: () => { playTone({type:"sine",freq:1320,dur:0.06,vol:0.18}); setTimeout(()=>playTone({type:"sine",freq:1760,dur:0.1,vol:0.15}),50); },
  dash: () => playNoise({ dur: 0.15, vol: 0.15, filterFreq: 4000, filter: "highpass" }),
  special: () => { if(!audioCtx||!seEnabled)return; playTone({type:"sawtooth",freq:200,freqEnd:1200,dur:0.4,vol:0.25}); playNoise({dur:0.5,vol:0.25,filterFreq:3000}); },
  powerup: () => { if(!audioCtx||!seEnabled)return; playTone({type:"square",freq:400,freqEnd:1600,dur:0.25,vol:0.2}); }
};
function noteFreq(n) { return 440 * Math.pow(2, (n - 69) / 12); }
const NOTE = { A1:33,B1:35,C2:36,D2:38,E2:40,F2:41,G2:43,A2:45,B2:47,C3:48,D3:50,E3:52,F3:53,G3:55,A3:57,B3:59,C4:60,D4:62,E4:64,F4:65,G4:67,A4:69,B4:71,C5:72,D5:74,E5:76,F5:77,G5:79,A5:81,B5:83 };
const BGM_PATTERNS = {
  bass: ["A1",null,"A1",null,"A2",null,"A1",null,"A1",null,"A1",null,"A2",null,"A1",null,"F2",null,"F2",null,"F2",null,"F2",null,"C3",null,"F2",null,"F2",null,"A2",null,"C2",null,"C2",null,"C3",null,"C2",null,"G2",null,"C2",null,"C3",null,"C2",null,"G2",null,"G2",null,"G3",null,"G2",null,"D3",null,"G2",null,"G3",null,"B2",null],
  lead: ["A4",null,"C5",null,"B4",null,"A4",null,"E5",null,"D5",null,"C5",null,"B4",null,"A4",null,"F4",null,"A4",null,"C5",null,"B4",null,"A4",null,"G4",null,"F4",null,"G4",null,"E4",null,"G4",null,"C5",null,"B4",null,"G4",null,"E4",null,"D4",null,"D4",null,"G4",null,"B4",null,"D5",null,"B4",null,"G4",null,"D4",null,"G4",null],
  arp: ["A3","E4","A4","C5","A4","E4","A3","E4","A3","E4","A4","E5","C5","A4","E4","A3","F3","C4","F4","A4","F4","C4","F3","C4","F3","C4","F4","C5","A4","F4","C4","F3","C3","G3","C4","E4","C4","G3","C3","G3","C3","G3","C4","G4","E4","C4","G3","C3","G3","D4","G4","B4","G4","D4","G3","D4","G3","D4","G4","B4","D4","B3","G3","D3"]
};
const BGM_DRUMS = ["K",null,"H",null,"S",null,"H","K","K",null,"H",null,"S",null,"H","H","K",null,"H",null,"S",null,"H","K","K",null,"H",null,"S",null,"H","H","K",null,"H",null,"S",null,"H","K","K",null,"H",null,"S",null,"H","H","K",null,"H",null,"S",null,"H","K","K",null,"H","H","S",null,"K","S"];
function playBGMNote(type, freq, dur, vol) {
  if (!audioCtx || !bgmGain) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.setValueAtTime(vol, t + dur - 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(g); g.connect(bgmGain);
  osc.start(t); osc.stop(t + dur + 0.02);
}
function playBGMDrum(type, vol) {
  if (!audioCtx || !bgmGain) return;
  const t = audioCtx.currentTime;
  if (type === "K") {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(g); g.connect(bgmGain);
    osc.start(t); osc.stop(t + 0.18);
  } else {
    const dur = type === "S" ? 0.1 : 0.05;
    const bs = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bs; i++) d[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const f = audioCtx.createBiquadFilter();
    f.type = "highpass"; f.frequency.value = type === "S" ? 800 : 6000;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(bgmGain);
    src.start(t); src.stop(t + dur + 0.02);
  }

let bgmNextStepTime = 0;
function scheduleStep(step) {
  if (!audioCtx || !bgmGain) return;
  const s = step % 64;
  if (BGM_PATTERNS.bass[s]) playBGMNote("triangle", noteFreq(NOTE[BGM_PATTERNS.bass[s]]), BGM_STEP_DUR * 1.8, 0.18);
  if (BGM_PATTERNS.lead[s]) playBGMNote("square", noteFreq(NOTE[BGM_PATTERNS.lead[s]]), BGM_STEP_DUR * 1.5, 0.10);
  if (BGM_PATTERNS.arp[s]) playBGMNote("sawtooth", noteFreq(NOTE[BGM_PATTERNS.arp[s]]), BGM_STEP_DUR * 0.8, 0.05);
  const dm = BGM_DRUMS[s];
  if (dm === "K") playBGMDrum("K", 0.3);
  else if (dm === "S") playBGMDrum("S", 0.18);
  else if (dm === "H") playBGMDrum("H", 0.08);
}
function bgmScheduler() {
  if (!audioCtx || !bgmGain) return;
  const now = audioCtx.currentTime;
  while (bgmNextStepTime < now + 0.1) {
    scheduleStep(bgmCurrentStep);
    bgmNextStepTime += BGM_STEP_DUR;
    bgmCurrentStep++;
    if (bgmCurrentStep >= 128) bgmCurrentStep = 0;
  }
}
function startSynthBGM() {
  if (!audioCtx) return;
  ensureGains();
  if (bgmSchedulerId) clearInterval(bgmSchedulerId);
  bgmNextStepTime = audioCtx.currentTime + 0.05;
  bgmCurrentStep = 0;
  bgmSchedulerId = setInterval(bgmScheduler, 25);
}
/* MP3 BGM (index.html と同じフォルダの Attack.mp3 を再生) */
const BGM_FILE = "Attack.mp3";
let bgmAudio = null, bgmMp3Failed = false;
function applyMp3Volume() { if (bgmAudio) bgmAudio.volume = bgmEnabled ? Math.max(0, Math.min(1, bgmVolume)) : 0; }
function bgmStatus(msg, ok) {
  try {
    let d = document.getElementById("bgmStatus");
    if (!d) {
      d = document.createElement("div"); d.id = "bgmStatus";
      d.style.cssText = "position:fixed;left:8px;bottom:8px;z-index:99999;max-width:90vw;padding:6px 10px;border-radius:6px;font:12px/1.4 sans-serif;color:#fff;pointer-events:none;";
      document.body.appendChild(d);
    }
    d.style.background = ok ? "rgba(0,120,60,.9)" : "rgba(180,40,40,.92)";
    d.textContent = msg; d.style.display = "block";
    clearTimeout(d._t); d._t = setTimeout(() => { d.style.display = "none"; }, ok ? 3000 : 12000);
  } catch (e) {}
}
function startBGM() {
  if (!audioCtx) return;
  ensureGains();
  if (bgmMp3Failed) { startSynthBGM(); return; }
  if (!bgmAudio) {
    bgmAudio = new Audio(BGM_FILE);
    bgmAudio.loop = true;
    bgmAudio.preload = "auto";
    bgmAudio.addEventListener("playing", () => bgmStatus("BGM: Attack.mp3 再生中", true));
    bgmAudio.addEventListener("error", () => {
      const c = bgmAudio && bgmAudio.error ? bgmAudio.error.code : "?";
      bgmStatus("Attack.mp3 を読み込めません(code " + c + " / " + location.protocol + ")。index.html と同じ場所にあるか確認 → 内蔵BGMで再生中", false);
      bgmMp3Failed = true; bgmAudio = null; startSynthBGM();
    });
  }
  applyMp3Volume();
  const p = bgmAudio.play();
  if (p && p.catch) p.catch((err) => {
    bgmStatus("再生がブロックされました(" + (err && err.name) + ")。もう一度タップしてください", false);
    const retry = () => { if (bgmAudio) bgmAudio.play().catch(()=>{}); window.removeEventListener("pointerdown", retry, true); window.removeEventListener("keydown", retry, true); };
    window.addEventListener("pointerdown", retry, true);
    window.addEventListener("keydown", retry, true);
  });
}
function setBGMEnabled(v) { bgmEnabled = v; if (bgmGain) bgmGain.gain.value = bgmEnabled ? bgmVolume : 0; applyMp3Volume(); }
function setSEEnabled(v) { seEnabled = v; if (seGain) seGain.gain.value = seEnabled ? seVolume : 0; }
function setBGMVolume(v) { bgmVolume = Math.max(0, Math.min(1, v)); if (bgmGain && bgmEnabled) bgmGain.gain.value = bgmVolume; applyMp3Volume(); }
function setSEVolume(v) { seVolume = Math.max(0, Math.min(1, v)); if (seGain && seEnabled) seGain.gain.value = seVolume; }

/* ========== 基本 ========== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
document.getElementById("loading").remove();
const W = canvas.width, H = canvas.height, TAU = Math.PI * 2;
const SAVE_KEY = "neonBulletSave_v1";
function createDefaultSave() {
  return {
    highScore: 0, coins: 0, totalCoinsEarned: 0,
    ownedWeapons: ["normal","spiral","rapid","knife","mochi","boomerang","orbit","lightning","freeze","shotgun","missile","flame","spike","swarm","piano"],
    ownedSpecials: ["fireworks"],
    weaponRecords: {}, totalClears: 0, totalPlays: 0,
    lastLoginDate: null, loginStreak: 0, dailyBonusClaimedDate: null,
    ownedCosmetics: ["theme_default","color_cyan"],
    equippedTheme: "theme_default", equippedColor: "color_cyan",
    upgrades: {}, dailyMissions: null, dailyMissionsDate: null,
    missionProgress: {}, challengeRecords: {},

}
let saveData = createDefaultSave();
function loadSave() {

      const p = JSON.parse(raw);

      if (!saveData.weaponRecords) saveData.weaponRecords = {};
      if (!saveData.ownedWeapons) saveData.ownedWeapons = createDefaultSave().ownedWeapons;
      if (!saveData.ownedSpecials) saveData.ownedSpecials = createDefaultSave().ownedSpecials;
      for (const k of createDefaultSave().ownedWeapons) if (!saveData.ownedWeapons.includes(k)) saveData.ownedWeapons.push(k);
      for (const k of createDefaultSave().ownedSpecials) if (!saveData.ownedSpecials.includes(k)) saveData.ownedSpecials.push(k);
      if (!saveData.ownedCosmetics) saveData.ownedCosmetics = createDefaultSave().ownedCosmetics;
      for (const k of createDefaultSave().ownedCosmetics) if (!saveData.ownedCosmetics.includes(k)) saveData.ownedCosmetics.push(k);
      if (!saveData.equippedTheme) saveData.equippedTheme = "theme_default";
      if (!saveData.equippedColor) saveData.equippedColor = "color_cyan";
      if (!saveData.upgrades) saveData.upgrades = {};

      if (!saveData.missionProgress) saveData.missionProgress = {};

      if (typeof saveData.studyHighScore !== "number") saveData.studyHighScore = 0;
      if (typeof saveData.studyClears !== "number") saveData.studyClears = 0;
      if (typeof saveData.bgmVolume !== "number") saveData.bgmVolume = 0.35;
      if (typeof saveData.seVolume !== "number") saveData.seVolume = 0.5;

}

function getWeaponRecord(key) {

    saveData.weaponRecords[key] = { cleared: false, clearCount: 0, highScore: 0, maxLevel: 1, maxCombo: 0, maxWave: 1 };

}
function ownsWeapon(k) { return saveData.ownedWeapons.includes(k); }
function ownsSpecial(k) { return saveData.ownedSpecials.includes(k); }
loadSave();
let highScore = saveData.highScore || 0;
bgmVolume = saveData.bgmVolume; seVolume = saveData.seVolume;
bgmEnabled = saveData.bgmEnabled; seEnabled = saveData.seEnabled;

/* ========== アップグレード ========== */
const UPGRADES = {

  speed:      { name: "移動速度 +5%",     description: "移動速度が5%上がる",      color: "#00ffcc", basePrice: 250, maxLevel: 8,  step: 0.05 },

const UPGRADE_ORDER = Object.keys(UPGRADES);
function getUpgradeLevel(k) { return (saveData.upgrades && saveData.upgrades[k]) || 0; }
function getUpgradePrice(k) { return Math.floor(UPGRADES[k].basePrice * Math.pow(1.6, getUpgradeLevel(k))); }
function isUpgradeMaxed(k) { return getUpgradeLevel(k) >= UPGRADES[k].maxLevel; }
function buyUpgrade(k) {
  if (isUpgradeMaxed(k)) return false;

  if (saveData.coins < p) return false;

  if (!saveData.upgrades) saveData.upgrades = {};

}
function getMaxHpBonus() { return getUpgradeLevel("maxhp") * UPGRADES.maxhp.step; }
function getSpeedMult() { return 1 + getUpgradeLevel("speed") * UPGRADES.speed.step; }
function getStartLevelBonus() { return getUpgradeLevel("startlevel") * UPGRADES.startlevel.step; }
function getCoinRateMult() { return 1 + getUpgradeLevel("coinrate") * UPGRADES.coinrate.step; }
function getGaugeMult() { return 1 + getUpgradeLevel("gauge") * UPGRADES.gauge.step; }
function getDefenseMult() { return 1 - getUpgradeLevel("defense") * UPGRADES.defense.step; }

function getDashCdMult() { return 1 - getUpgradeLevel("dashcd") * UPGRADES.dashcd.step; }

function todayStr() { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function yesterdayStr() { const d = new Date(); d.setDate(d.getDate()-1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
let dailyBonusAvailable = false, dailyBonusAmount = 0, dailyBonusStreakDisplay = 1, showDailyBonusPopup = false;
const DAILY_BONUS_TABLE = [50, 70, 90, 120, 150, 200, 300];
function checkDailyBonus() {
  const today = todayStr();
  if (saveData.dailyBonusClaimedDate === today) { dailyBonusAvailable = false; return; }
  if (saveData.lastLoginDate === yesterdayStr()) dailyBonusStreakDisplay = Math.min(7, (saveData.loginStreak || 0) + 1);
  else dailyBonusStreakDisplay = 1;
  dailyBonusAmount = DAILY_BONUS_TABLE[dailyBonusStreakDisplay - 1];
  dailyBonusAvailable = true; showDailyBonusPopup = true;
}
function claimDailyBonus() {
  if (!dailyBonusAvailable) return;
  const today = todayStr();
  saveData.coins = (saveData.coins || 0) + dailyBonusAmount;
  saveData.totalCoinsEarned = (saveData.totalCoinsEarned || 0) + dailyBonusAmount;
  saveData.loginStreak = dailyBonusStreakDisplay;
  saveData.lastLoginDate = today;
  saveData.dailyBonusClaimedDate = today;
  writeSave();
  dailyBonusAvailable = false; showDailyBonusPopup = false;
  sfx.coin(); shake(20); flash("#ffd700", 8); chroma(8);
  burst(W/2, H/2, 80, "#ffd700"); burst(W/2, H/2, 40, "#ffffff");
}

let dailyMissions = [], missionProgress = {};
let missionSession = { kills: 0, plays: 0, maxCombo: 0, maxWave: 0, maxLevel: 1, bossKills: 0, maxScore: 0, cleared: false };
function pickDailyMissions() {
  const pool = MISSION_POOL.slice(), picked = [];
  for (let i = 0; i < 3; i++) { const idx = Math.floor(Math.random()*pool.length); picked.push(pool.splice(idx,1)[0]); }
  return picked.map(m => ({ ...m, claimed: false }));
}
function checkDailyMissions() {
  const today = todayStr();
  if (saveData.dailyMissionsDate === today && saveData.dailyMissions) {
    dailyMissions = saveData.dailyMissions;
    missionProgress = saveData.missionProgress || {};
  } else {
    dailyMissions = pickDailyMissions();
    missionProgress = {};
    saveData.dailyMissions = dailyMissions;
    saveData.dailyMissionsDate = today;
    saveData.missionProgress = missionProgress;
    writeSave();
  }
}
function resetMissionSession() { missionSession = { kills:0, plays:0, maxCombo:0, maxWave:0, maxLevel:1, bossKills:0, maxScore:0, cleared:false }; }
function updateMissionProgressFromSession() {
  const s = missionSession;
  missionProgress.kills = Math.max(missionProgress.kills||0, s.kills);
  missionProgress.combo20 = missionProgress.combo20 || (s.maxCombo >= 20 ? 1 : 0);
  missionProgress.combo30 = missionProgress.combo30 || (s.maxCombo >= 30 ? 1 : 0);
  missionProgress.wave5 = missionProgress.wave5 || (s.maxWave >= 5 ? 1 : 0);
  missionProgress.boss1 = missionProgress.boss1 || (s.bossKills >= 1 ? 1 : 0);
  missionProgress.boss2 = missionProgress.boss2 || (s.bossKills >= 2 ? 1 : 0);
  missionProgress.level10 = missionProgress.level10 || (s.maxLevel >= 10 ? 1 : 0);
  missionProgress.level15 = missionProgress.level15 || (s.maxLevel >= 15 ? 1 : 0);
  missionProgress.clear = missionProgress.clear || (s.cleared ? 1 : 0);
  missionProgress.plays = Math.max(missionProgress.plays||0, s.plays);
  missionProgress.score5000 = missionProgress.score5000 || (s.maxScore >= 5000 ? 1 : 0);
  missionProgress.score10000 = missionProgress.score10000 || (s.maxScore >= 10000 ? 1 : 0);
  saveData.missionProgress = missionProgress;
  writeSave();
}
function isMissionComplete(m) {
  const p = missionProgress[m.stat] || 0;
  if (m.stat === "kills" || m.stat === "plays") return p >= m.target;
  return p >= 1;
}
function claimMissionReward(idx) {
  const m = dailyMissions[idx];
  if (!m || m.claimed) return false;
  if (!isMissionComplete(m)) return false;
  m.claimed = true;
  saveData.coins = (saveData.coins||0) + m.reward;
  saveData.totalCoinsEarned = (saveData.totalCoinsEarned||0) + m.reward;
  saveData.dailyMissions = dailyMissions;
  writeSave(); sfx.coin(); return true;
}

const STUDY_BURST_MAX = 100;
function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function pickWrongs(ans, cnt, range) {
  const set = new Set([ans]), w = [];
  let s = 0;
  while (w.length < cnt && s < 200) {
    s++;
    let x = ans + randInt(-range, range);
    if (x === 0 && ans !== 0) x += 1;
    if (x !== ans && !set.has(x)) { set.add(x); w.push(x); }
  }
  while (w.length < cnt) w.push(ans + (w.length + 1) * 7);
  return w;
}
function shuffle(a) {
  for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function generateQuizGrade1() {
  const t = Math.floor(Math.random()*3);
  if (t === 0) { const a = randInt(2,12), b = randInt(1,15), m = Math.random() < 0.5, ans = m ? (-a)-b : (-a)+b;
    return { text: `(-${a}) ${m?"-":"+"} ${b} = ?`, choices: shuffle([ans, ...pickWrongs(ans,3,5)]), answer: ans }; }
  else if (t === 1) { const a = randInt(2,6), x = randInt(-8,8), b = randInt(-15,15), c = a*x+b;
    const s = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
    return { text: `${a}x ${s} = ${c}\n x = ?`, choices: shuffle([x, ...pickWrongs(x,3,4)]), answer: x }; }
  else { const a = randInt(2,9), b = randInt(2,9), ans = a+b;
    return { text: `${a}x + ${b}x = ?\n xの係数は？`, choices: shuffle([ans, ...pickWrongs(ans,3,4)]), answer: ans }; }
}
function generateQuizGrade2() {
  const t = Math.floor(Math.random()*3);
  if (t === 0) { const x = randInt(1,9), y = randInt(1,9);
    return { text: `x + y = ${x+y}\nx - y = ${x-y}\n x = ?`, choices: shuffle([x, ...pickWrongs(x,3,3)]), answer: x }; }
  else if (t === 1) { const a = randInt(2,5), x = randInt(1,6), y = randInt(1,9), c = a*x+y;
    return { text: `${a}x + y = ${c}\n x = ${x} のとき y = ?`, choices: shuffle([y, ...pickWrongs(y,3,4)]), answer: y }; }
  else { const a = randInt(2,5), b = randInt(-8,8), x = randInt(-5,7), y = a*x+b;
    const s = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
    return { text: `y = ${a}x ${s}\n x = ${x} のとき y = ?`, choices: shuffle([y, ...pickWrongs(y,3,6)]), answer: y }; }
}
function generateQuizGrade3() {
  const t = Math.floor(Math.random()*3);
  if (t === 0) { const a = randInt(1,9), b = randInt(1,9), ans = a+b;
    return { text: `(x + ${a})(x + ${b})\n x の係数は？`, choices: shuffle([ans, ...pickWrongs(ans,3,4)]), answer: ans }; }
  else if (t === 1) { const a = randInt(1,9), b = randInt(1,9), ans = a*b;
    return { text: `x² + ${a+b}x + ${a*b}\n = (x + ${a})(x + ?)`, choices: shuffle([b, ...pickWrongs(ans,3,Math.max(5,Math.floor(ans/2)))]), answer: b }; }
  else { const a = randInt(1,8), b = randInt(1,8), ans = Math.max(a,b);
    return { text: `x² - ${a+b}x + ${a*b} = 0\n 大きい方の解は？`, choices: shuffle([ans, ...pickWrongs(ans,3,4)]), answer: ans }; }
}
function generateQuiz() {
  if (studyGrade === 1) return generateQuizGrade1();
  if (studyGrade === 2) return generateQuizGrade2();
  return generateQuizGrade3();
}

function drawBackground() {

  }

  if (pauseScreen) { touchX = p.x; touchY = p.y; menuStartY = p.y; menuDragged = false; return; }

  }
  if (shopScreen || missionScreen || challengeScreen || studySelectScreen) { touchX = p.x; touchY = p.y; menuStartY = p.y; menuDragged = false; return; }
  if (titleScreen) {
    { const dx = p.x-TITLE_SETTINGS_BTN_X, dy = p.y-TITLE_SETTINGS_BTN_Y; if (dx*dx+dy*dy <= TITLE_SETTINGS_BTN_R*TITLE_SETTINGS_BTN_R) { sfx.tap(); settingsScreen = true; titleScreen = false; return; } }

    { const bx = (W-TITLE_FUSION_W)/2; if (p_inRange(p.x, p.y, bx, TITLE_FUSION_Y, TITLE_FUSION_W, TITLE_FUSION_H)) { sfx.tap(); studyMode = false; fusionMode = true; quickMode = false; fusionSelected = []; applyChallenge(null); titleScreen = false; weaponMenu = true; specialMenu = false; menuScrollY = 0; return; } }
    { const bx = (W-TITLE_QUICK_W)/2; if (p_inRange(p.x, p.y, bx, TITLE_QUICK_Y, TITLE_QUICK_W, TITLE_QUICK_H)) { sfx.tap(); studyMode = false; quickMode = true; fusionMode = false; fusionSelected = []; applyChallenge(null); titleScreen = false; weaponMenu = true; specialMenu = false; menuScrollY = 0; return; } }
    if (p_inRange(p.x, p.y, (W-TITLE_GACHA_W)/2, TITLE_GACHA_Y, TITLE_GACHA_W, TITLE_GACHA_H)) { sfx.tap(); rollGacha(); return; }

function movePointer(e) {
  e.preventDefault();

  if (shopScreen || missionScreen || challengeScreen || studySelectScreen) {

    if (shopScreen) shopScrollY = Math.max(0, Math.min(shopMaxScroll(), shopScrollY - d));

  if (specialMenu) {

    if (Math.abs(p.y-menuStartY) > 6) menuDragged = true;
    specialMenuScrollY = Math.max(0, Math.min(specialMenuMaxScroll(), specialMenuScrollY - d));
    touchX = p.x; touchY = p.y; return;
  }
  if (weaponMenu) {
    const d = p.y - touchY;
    if (Math.abs(p.y-menuStartY) > 6) menuDragged = true;
    menuScrollY = Math.max(0, Math.min(menuMaxScroll(), menuScrollY - d));
    touchX = p.x; touchY = p.y; return;

function selectWeaponAt(x, y) {
  if (settingsScreen) {
    const tx = W/2+60, tw = 60, th = 30, y1 = 200, y2 = 290;
    if (p_inRange(x, y, tx, y1, tw, th)) { setBGMEnabled(!bgmEnabled); saveData.bgmEnabled = bgmEnabled; writeSave(); sfx.tap(); return; }
    if (p_inRange(x, y, tx, y2, tw, th)) { setSEEnabled(!seEnabled); saveData.seEnabled = seEnabled; writeSave(); sfx.tap(); return; }

    if (p_inRange(x, y, sx, 235, sw, 30)) { setBGMVolume(Math.max(0, Math.min(1, (x-sx)/sw))); saveData.bgmVolume = bgmVolume; writeSave(); return; }
    if (p_inRange(x, y, sx, 325, sw, 30)) { setSEVolume(Math.max(0, Math.min(1, (x-sx)/sw))); saveData.seVolume = seVolume; writeSave(); return; }
    const bw = 200, bh = 50, bx = (W-bw)/2, by = H-100;
    if (p_inRange(x, y, bx, by, bw, bh)) { sfx.tap(); settingsScreen = false; titleScreen = true; return; }
    return;
  }
  if (pauseScreen) {
    if (pauseBackToTitleConfirm) {
      const bw = 140, bh = 50, by = H/2+30, yx = W/2-bw-8, nx = W/2+8;
      if (p_inRange(x, y, yx, by, bw, bh)) { sfx.tap(); pauseBackToTitleConfirm = false; pauseScreen = false; abortGameToTitle(); return; }
      if (p_inRange(x, y, nx, by, bw, bh)) { sfx.tap(); pauseBackToTitleConfirm = false; return; }
      return;
    }
    const bw = 240, bh = 60, bx = (W-bw)/2, ry = H/2-80, qy = H/2+10;
    if (p_inRange(x, y, bx, ry, bw, bh)) { sfx.tap(); pauseScreen = false; return; }
    if (p_inRange(x, y, bx, qy, bw, bh)) { sfx.tap(); pauseBackToTitleConfirm = true; return; }
    return;
  }
  if (shopScreen) {
    if (p_inRange(x, y, SHOP_TAB_WEAPON_X, SHOP_TAB_Y, SHOP_TAB_W, SHOP_TAB_H)) { if (shopTab !== "weapon") { sfx.tap(); shopTab = "weapon"; shopScrollY = 0; } return; }
    if (p_inRange(x, y, SHOP_TAB_SPECIAL_X, SHOP_TAB_Y, SHOP_TAB_W, SHOP_TAB_H)) { if (shopTab !== "special") { sfx.tap(); shopTab = "special"; shopScrollY = 0; } return; }
    if (p_inRange(x, y, SHOP_TAB_UPGRADE_X, SHOP_TAB_Y, SHOP_TAB_W, SHOP_TAB_H)) { if (shopTab !== "upgrade") { sfx.tap(); shopTab = "upgrade"; shopScrollY = 0; } return; }
    if (p_inRange(x, y, SHOP_TAB_COSMETIC_X, SHOP_TAB_Y, SHOP_TAB_W, SHOP_TAB_H)) { if (shopTab !== "cosmetic") { sfx.tap(); shopTab = "cosmetic"; shopScrollY = 0; } return; }
    const bby = H-45, bbw = 200, bbx = (W-bbw)/2;
    if (p_inRange(x, y, bbx, bby-22, bbw, 44)) { sfx.tap(); shopScreen = false; titleScreen = true; return; }
    const ly = SHOP_TAB_Y + SHOP_TAB_H + 20;
    if (x < MENU_MARGIN || x > MENU_MARGIN+MENU_WIDTH || y < ly || y > H-70) return;
    const localY = y - ly + shopScrollY;
    const idx = Math.floor(localY / (MENU_ITEM_HEIGHT+MENU_GAP));
    const list = shopTab === "weapon" ? getShopWeapons() : shopTab === "special" ? getShopSpecials() : shopTab === "upgrade" ? UPGRADE_ORDER : getShopCosmetics();
    if (idx < 0 || idx >= list.length) return;
    if (localY % (MENU_ITEM_HEIGHT+MENU_GAP) > MENU_ITEM_HEIGHT) return;
    const k = list[idx];
    if (shopTab === "weapon") {
      if (ownsWeapon(k)) return;
      if (buyWeapon(k)) { sfx.coin(); showShopMessage(`「${weapons[k].name}」を購入しました！`, "#88ff88"); shake(15); flash("#88ff88", 6); }
      else { showShopMessage(`コインが足りません（必要: ${getWeaponPrice(k)} / 所持: ${saveData.coins}）`, "#ff6666"); shake(10); flash("#ff6666", 4); }
    } else if (shopTab === "special") {
      if (ownsSpecial(k)) return;
      if (buySpecial(k)) { sfx.coin(); showShopMessage(`「${specials[k].name}」を購入しました！`, "#88ff88"); shake(15); flash("#88ff88", 6); }
      else { showShopMessage(`コインが足りません（必要: ${getSpecialPrice(k)} / 所持: ${saveData.coins}）`, "#ff6666"); shake(10); flash("#ff6666", 4); }
    } else if (shopTab === "upgrade") {
      if (isUpgradeMaxed(k)) { showShopMessage("この強化は最大レベルです", "#ffcc00"); return; }
      if (buyUpgrade(k)) { sfx.coin(); showShopMessage(`「${UPGRADES[k].name}」をLv${getUpgradeLevel(k)}に強化！`, "#88ff88"); shake(15); flash(UPGRADES[k].color, 6); }
      else { showShopMessage(`コインが足りません（必要: ${getUpgradePrice(k)} / 所持: ${saveData.coins}）`, "#ff6666"); shake(10); flash("#ff6666", 4); }
    } else {
      if (ownsCosmetic(k)) {
        sfx.tap(); equipCosmetic(k);
        showShopMessage(`「${cosmetics[k].name}」を装備しました！`, "#88ff88");
        shake(8); flash(cosmetics[k].color, 5);
        if (cosmetics[k].kind === "theme") createStars();
        return;
      }
      if (buyCosmetic(k)) { sfx.coin(); showShopMessage(`「${cosmetics[k].name}」を購入しました！`, "#88ff88"); shake(15); flash("#88ff88", 6); }
      else { showShopMessage(`コインが足りません（必要: ${getCosmeticPrice(k)} / 所持: ${saveData.coins}）`, "#ff6666"); shake(10); flash("#ff6666", 4); }
    }
    return;
  }
  if (missionScreen) {
    const bby = H-45, bbw = 200, bbx = (W-bbw)/2;
    if (p_inRange(x, y, bbx, bby-22, bbw, 44)) { sfx.tap(); missionScreen = false; titleScreen = true; return; }
    const ly = 120;
    for (let i = 0; i < dailyMissions.length; i++) {
      const m = dailyMissions[i];
      const y2 = ly + i*150;
      if (p_inRange(x, y, MENU_MARGIN, y2+100, MENU_WIDTH, 36)) {
        if (!m.claimed && isMissionComplete(m)) {
          if (claimMissionReward(i)) { shake(20); flash("#ffd700", 8); chroma(10); burst(W/2, H/2, 60, "#ffd700"); burst(W/2, H/2, 30, "#ffffff"); }
        }
        return;
      }
    }
    return;
  }
  if (challengeScreen) {
    const bby = H-45, bbw = 200, bbx = (W-bbw)/2;
    if (p_inRange(x, y, bbx, bby-22, bbw, 44)) { sfx.tap(); challengeScreen = false; titleScreen = true; return; }
    const ly = 90;
    for (let i = 0; i < CHALLENGE_ORDER.length; i++) {
      const y2 = ly + i*60;
      if (y2 > H-100) break;
      if (p_inRange(x, y, MENU_MARGIN, y2, MENU_WIDTH, 54)) {

        const k = CHALLENGE_ORDER[i];
        applyChallenge(k);
        challengeScreen = false; titleScreen = false;
        weaponMenu = true; specialMenu = false;
        fusionMode = false; quickMode = false;
        menuScrollY = 0;
        shake(15); flash(CHALLENGES[k].color, 6);
        return;
      }
    }
    if (p_inRange(x, y, MENU_MARGIN, H-100, MENU_WIDTH, 36)) {
      sfx.tap(); applyChallenge(null);
      challengeScreen = false; titleScreen = false;
      weaponMenu = true; specialMenu = false;
      fusionMode = false; quickMode = false;
      menuScrollY = 0;
      shake(15); flash("#00ffcc", 6);
      return;
    }
    return;
  }
  if (studySelectScreen) {
    const bby = H-45, bbw = 200, bbx = (W-bbw)/2;
    if (p_inRange(x, y, bbx, bby-22, bbw, 44)) { sfx.tap(); studySelectScreen = false; titleScreen = true; return; }
    const y1 = 200, y2 = 270, y3 = 340, bw = 280, bh = 55, bx = (W-bw)/2;
    if (p_inRange(x, y, bx, y1, bw, bh)) { startStudyMode(1); return; }
    if (p_inRange(x, y, bx, y2, bw, bh)) { startStudyMode(2); return; }
    if (p_inRange(x, y, bx, y3, bw, bh)) { startStudyMode(3); return; }
    return;
  }
  if (specialMenu) {
    const LIST_TOP = MENU_TOP+15, LIST_BOTTOM = H-70;
    if (x < MENU_MARGIN || x > MENU_MARGIN+MENU_WIDTH || y < LIST_TOP || y > LIST_BOTTOM) return;
    const localY = y - LIST_TOP + specialMenuScrollY;
    const idx = Math.floor(localY / (MENU_ITEM_HEIGHT+MENU_GAP));
    const list = getAvailableSpecials();
    if (idx < 0 || idx >= list.length) return;
    if (localY % (MENU_ITEM_HEIGHT+MENU_GAP) <= MENU_ITEM_HEIGHT) selectSpecial(list[idx]);
    return;
  }
  if (weaponMenu) {
    const LIST_TOP = MENU_TOP+15, LIST_BOTTOM = H-70;
    if (fusionMode) {
      if (fusionSelected.length >= 2) {
        const by = H-45, bw = 220, bx = (W-bw)/2;

      if (x < MENU_MARGIN || x > MENU_MARGIN+MENU_WIDTH || y < LIST_TOP || y > LIST_BOTTOM) return;
      const localY = y - LIST_TOP + menuScrollY;
      const idx = Math.floor(localY / (MENU_ITEM_HEIGHT+MENU_GAP));

      if (idx < 0 || idx >= avail.length) return;

      else fusionSelected.push(k);
      return;
    }
    if (x < MENU_MARGIN || x > MENU_MARGIN+MENU_WIDTH || y < LIST_TOP || y > LIST_BOTTOM) return;

    if (idx < 0 || idx >= avail.length) return;
    if (localY % (MENU_ITEM_HEIGHT+MENU_GAP) <= MENU_ITEM_HEIGHT) selectWeapon(avail[idx]);
  }
}

window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
  initAudio();
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  if (titleScreen && showDailyBonusPopup) { claimDailyBonus(); return; }
  if (settingsScreen) { if (k === "escape") { settingsScreen = false; titleScreen = true; return; } return; }
  if (pauseScreen) {
    if (k === "escape") { if (pauseBackToTitleConfirm) pauseBackToTitleConfirm = false; else pauseScreen = false; return; }
    if (k === "enter" && pauseBackToTitleConfirm) { pauseBackToTitleConfirm = false; pauseScreen = false; abortGameToTitle(); return; }
    return;
  }

/* ========== スケーリング ========== */
function enemyHpScale() {
  const lv = level;
  let s = 1 + (lv-1)*0.22;
  if (lv > 20) s += (lv-20)*0.10;
  if (lv > 40) s += (lv-40)*0.15;
  if (lv > 60) s += (lv-60)*0.22;
  return s;
}
function enemySpeedScale() {
  const lv = level;
  let s = 1 + (lv-1)*0.025;
  if (lv > 15) s += (lv-15)*0.012;
  if (lv > 35) s += (lv-35)*0.018;
  if (challengeFastEnemy) s *= 1.5;
  const dp = (time%7200)/7200;
  const nf = 0.5 + Math.sin(dp*TAU - Math.PI/2)*0.5;
  s *= (1 + nf*0.3);
  return s;
}
function enemyShootScale() {
  const lv = level;
  let s = 1 + (lv-1)*0.020;
  if (lv > 20) s += (lv-20)*0.010;
  if (challengeDoubleBullet) s *= 1.8;
  return s;
}
function enemyBulletSpeedScale() {
  const lv = level;
  let s = 1 + (lv-1)*0.008;
  if (lv > 25) s += (lv-25)*0.006;
  return s;
}

let comboMilestones = {};
function addCombo() {

      if (edge === 0) { x = Math.random()*W; y = 0; }
      else if (edge === 1) { x = W; y = Math.random()*H; }

function killEnemy(idx) {
  const e = enemies[idx];
  if (!e) return;
  if (e.type === "boss" && !e.phase2 && bossKillCount < BOSS_KILL_TARGET && !studyMode && !quickMode) {
    e.phase2 = true;
    e.maxHp = e.maxHp*1.5;
    e.hp = e.maxHp;
    e.speed *= 1.4;
    e.r *= 1.2;
    e.bossPhase = 0;
    showBigDamage(e.x, e.y, "PHASE 2!", "#ff0044");
    sfx.bossAppear();
    shake(80); flash("#ff0044", 20); chroma(25); hitStopAdd(20);
    burst(e.x, e.y, 100, "#ff0044"); burst(e.x, e.y, 50, "#ffffff");
    return;
  }
  const big = e.type === "heavy" || e.type === "boss" || e.type === "tank";
  if (big) sfx.enemyDie();
  burst(e.x, e.y, big?120:40, e.type === "heavy" ? "#ffaa00" : e.type === "boss" ? "#ff0044" : e.type === "tank" ? "#8866ff" : "#ff0088");
  burst(e.x, e.y, big?60:20, "#ffffff");
  burst(e.x, e.y, big?40:15, "#ffff00");
  if (Math.random() < 0.5) burst(e.x, e.y, big?50:15, "#ff00ff");
  shake(big?40:(e.type === "child"?4:10));
  if (big) hitStopAdd(10); else if (Math.random() < 0.5) hitStopAdd(2);
  if (big || Math.random() < 0.15) flash(e.type === "boss" ? "#ff0044" : "#ff00ff", big?8:3);
  if (e.type === "boss") {
    sfx.bossDie();
    shake(120); flash("#ffffff", 25); chroma(30); hitStopAdd(20); zoomPulse = 2;
    for (let k = 0; k < 8; k++) setTimeout(() => {
      const bx = e.x + (Math.random()-.5)*300, by = e.y + (Math.random()-.5)*300;
      burst(bx, by, 60, "#ff0044"); burst(bx, by, 30, "#ffffff");
      shake(35); flash("#ff0044", 5);
    }, k*90);
    bossKillCount++;
    missionSession.bossKills = bossKillCount;
    const target = studyMode ? 1 : (quickMode ? 1 : BOSS_KILL_TARGET);
    if (bossKillCount >= target && !gameClear) {
      gameClear = true; gameOver = true;
      missionSession.cleared = true;
      recordGameResult(true);
      sfx.clear();
      shake(180); flash("#ffcc00", 50); chroma(50); hitStopAdd(50); zoomPulse = 2.5;
      for (let k = 0; k < 25; k++) setTimeout(() => {
        const bx = Math.random()*W, by = Math.random()*H;
        burst(bx, by, 70, "#ffcc00"); burst(bx, by, 35, "#ffffff"); burst(bx, by, 20, "#ff00ff");
        flash("#ffffff", 6); shake(35);
      }, k*110);
    }
  }
  addCombo();
  score += Math.round(e.score * comboMultiplier());
  if (score > missionSession.maxScore) missionSession.maxScore = score;
  gainExperience(1);
  missionSession.kills++;
  specialGauge = Math.min(SPECIAL_MAX, specialGauge + (big?2:0.5)*getGaugeMult());
  maybeDropPowerup(e.x, e.y, e.type);
  if (e.type === "boss") {
    bossActive = false;
    shockwaves.push({ x:e.x, y:e.y, radius:10, maxRadius:800, life:60, color:"255,0,68" });
    for (let i = 0; i < 3; i++) powerups.push({ x: e.x+(i-1)*40, y: e.y, vy: 1.2, r: 14, kind: i === 0 ? "heal" : i === 1 ? "bomb" : "exp", life: 600, bob: Math.random()*TAU });
  }
  enemies.splice(idx, 1);
  if (e.type === "splitter") {
    for (let i = 0; i < 2; i++) {
      const hp = 2*enemyHpScale();
      enemies.push({ x: e.x+(i?15:-15), y: e.y, r: 8, hp, maxHp: hp, speed: e.speed*1.4, type: "child", score: 2, shootRate: 0, wave: Math.random()*TAU, wavePower: 2 });
    }
  }
}

/* ========== 周回系 ========== */
function updateOrbit() {
  const p = pw("orbit");
  orbitAngle += .055;
  const c = Math.max(1, level)+p*2;
  const r = 52+Math.min(25, level*1.5)+p*8;
  const d = 1+level*.25+p*.5;
  for (let i = enemies.length-1; i >= 0; i--) {
    const e = enemies[i];
    if (!e) continue;
    e.orbitCooldown = Math.max(0, (e.orbitCooldown || 0) - 1);
    for (let s = 0; s < c; s++) {
      const a = orbitAngle + s*TAU/c;
      const x = player.x+Math.cos(a)*r, y = player.y+Math.sin(a)*r;
      if (Math.hypot(e.x-x, e.y-y) < e.r+9) {
        if (e.orbitCooldown <= 0) { e.hp -= d; e.orbitCooldown = 18; burst(x, y, 10, "#c8a2ff"); burst(x, y, 5, "#ffffff"); }
        break;
      }
    }
    if (e.hp <= 0) killEnemy(i);
  }
}
function updateLightning() {
  const p = pw("lightning");
  if (time % Math.max(15, 60-level*3-p*5) !== 0) return;
  const av = enemies.slice(), hit = [];
  const pts = [{ x: player.x, y: player.y }];
  let from = player;
  for (let c = 0; c < 2+Math.floor(level/2)+p; c++) {
    let near = null, dist = Infinity;
    for (const e of av) { const d = Math.hypot(e.x-from.x, e.y-from.y); const rng = c === 0 ? 250 : 150; if (d < rng && d < dist) { near = e; dist = d; } }
    if (!near) break;
    hit.push(near);
    pts.push({ x: near.x, y: near.y });
    av.splice(av.indexOf(near), 1);
    from = near;
  }
  if (!hit.length) return;
  const dmg = 2+level*.4+p*.8;
  for (let i = enemies.length-1; i >= 0; i--) {
    if (hit.includes(enemies[i])) {
      enemies[i].hp -= dmg;
      showDamage(enemies[i].x, enemies[i].y, dmg, "#66e0ff");
      if (enemies[i].hp <= 0) killEnemy(i);
    }
  }
  lightningBolts.push({ points: pts, life: 14 });
  shake(5); chroma(3);
}
function deployTurret() {
  const p = pw("turret"), max = 1+Math.floor(level/3)+p;
  while (turrets.length >= max) turrets.shift();
  turrets.push({ x: player.x+(Math.random()-.5)*70, y: player.y+(Math.random()-.5)*70, life: 400+level*15+p*80, cool: 0, damage: 1+level*.3+p*.5 });
}
function updateTurrets() {
  for (let i = turrets.length-1; i >= 0; i--) {
    const t = turrets[i];
    t.life--; t.cool--;
    if (t.isDrone) { const p = pw("drone"); const a = (time*0.03)+i*(TAU/turrets.length); const r = 60+p*10; t.x = player.x+Math.cos(a)*r; t.y = player.y+Math.sin(a)*r; t.angle = a+Math.PI/2; }
    if (t.life <= 0) { turrets.splice(i,1); continue; }
    if (t.cool > 0) continue;
    let tg = null, dist = Infinity;
    for (const e of enemies) { const d = Math.hypot(e.x-t.x, e.y-t.y); if (d < 220 && d < dist) { tg = e; dist = d; } }
    if (tg) {
      const a = Math.atan2(tg.y-t.y, tg.x-t.x);
      bullets.push({ x: t.x, y: t.y, vx: Math.cos(a)*10, vy: Math.sin(a)*10, size:5, damage: t.damage, hue: t.isDrone ? 190 : 25, type:"turret", life:300 });
      t.cool = t.isDrone ? 18 : 25;
    }
  }
}
function updateBlackHole(b) {
  if (b.travel > 0) { b.travel--; return; }
  b.field--; b.pulse++;
  for (const e of enemies) {
    if (e.type === "boss") continue;
    const dx = b.x-e.x, dy = b.y-e.y, d = Math.hypot(dx, dy) || 1;
    if (d < b.pullRadius) {
      const f = (1 - d/b.pullRadius)*8+2;
      e.x += dx/d*f;
      const py = dy/d*f;
      e.y += (py < 0 ? py*0.15 : py);
    }
    if (Math.hypot(e.x-b.x, e.y-b.y) < b.coreRadius+e.r) {
      e.hp -= b.damage;
      if (Math.random() < 0.1) showDamage(e.x, e.y, b.damage, "#9b59ff");
    }
  }
}
function updateMines() {
  for (let i = mines.length-1; i >= 0; i--) {
    const m = mines[i];
    m.life--; m.armTimer--; m.pulse += 0.15;
    if (m.life <= 0) { mines.splice(i,1); continue; }
    if (m.type === "cactus") {
      m.shootCD = (m.shootCD || 0) - 1;
      if (m.shootCD <= 0) {
        for (let k = 0; k < 6; k++) {
          const a = k/6*TAU + Math.random();
          bullets.push({ x: m.x, y: m.y, vx: Math.cos(a)*7, vy: Math.sin(a)*7, size:4, damage: m.damage*0.3, hue: 120, type:"turret", life:150 });
        }
        m.shootCD = 45;
      }
      continue;
    }
    if (m.armTimer > 0) continue;
    let ex = false;
    for (const e of enemies) if (Math.hypot(e.x-m.x, e.y-m.y) < m.r+e.r+8) { ex = true; break; }
    if (ex) {
      const r = m.blastRadius;
      shockwaves.push({ x:m.x, y:m.y, radius:8, maxRadius:r, life:20, color:"255,80,80" });
      shockwaves.push({ x:m.x, y:m.y, radius:8, maxRadius:r*0.7, life:15, color:"255,255,0" });
      burst(m.x, m.y, 100, "#ff5555"); burst(m.x, m.y, 50, "#ffff00"); burst(m.x, m.y, 30, "#ffffff");
      shake(40); flash("#ff5555", 10); chroma(12); hitStopAdd(6);
      for (let j = enemies.length-1; j >= 0; j--) {
        const en = enemies[j];
        if (!en) continue;
        if (Math.hypot(en.x-m.x, en.y-m.y) < r+en.r) {
          en.hp -= m.damage;
          showDamage(en.x, en.y, m.damage, "#ff5555");
          if (en.hp <= 0) killEnemy(j);
        }
      }
      mines.splice(i,1);
      break;
    }
  }
}

  if (level > 4 && Math.random() < (level-4)*0.006*wm) spawnEnemy();
  if (level > 8 && Math.random() < (level-8)*0.008*wm) { spawnEnemy(); spawnEnemy(); }
  let me = Math.min(60, 8+Math.floor(level*1.2*wm));
  if (challengeEnemyRush) me *= 2;
  if (enemies.length < me && Math.random() < 0.15) spawnEnemy();
  shoot();
  updateTurrets();
  updateMines();
  updateBullets();
  updateEnemies();
  updateEnemyBullets();
  updatePowerups();
  updateEffects();
  if (score > highScore) highScore = score;
}

  const now = Date.now();
  if (saveData.coins < 300) {
    gp = { fail: true, text: "コインが足りません", sub: "必要 300 / 所持 " + saveData.coins, until: now + 2200 };
    shake(10); return;
  }
  const all = [];
  for (const k of WEAPON_ORDER) if (!ownsWeapon(k)) all.push({ kind: "weapon", key: k });
  for (const k of SPECIAL_ORDER) if (!ownsSpecial(k) && k !== "knowledgeburst") all.push({ kind: "special", key: k });

  const pick = all[Math.floor(Math.random() * all.length)];
  let data;

  else if (pick.kind === "special") { saveData.ownedSpecials.push(pick.key); data = specials; }
  else { saveData.ownedCosmetics.push(pick.key); data = cosmetics; }

  const d = data[pick.key];
  gp = { kind: pick.kind, name: d.name, desc: d.description, color: d.color, until: now + 4000 };
  sfx.coin(); sfx.clear();
};

    }
    ctx.restore();
  }
};
/* 周回衛星 + チェーンソー(もともと見えなかった) */

      ctx.fillStyle="#555";ctx.beginPath();ctx.arc(0,0,11,0,TAU);ctx.fill();ctx.fillStyle="#ff3300";

function canSendGift(){
  if (giftSelectedType === "coin") return saveData.coins >= giftSelectedCoin && giftSelectedCoin > 0;
  if (giftSelectedType === "weapon") {
    if (!giftSelectedWeapon) return false;
    return saveData.ownedWeapons.filter(k => k === giftSelectedWeapon).length > 1;
  }
  return false;
}

function sendGift(){
  if (!canSendGift()) return;
  const gift = {
    from: saveData.userName,
    to: giftTargetUser.trim(),
    type: giftSelectedType,
    value: giftSelectedType === "coin" ? giftSelectedCoin : giftSelectedWeapon,
    message: giftMessage.trim(),
    date: Date.now()
  };
  if (giftSelectedType === "coin") {
    saveData.coins -= giftSelectedCoin;
  } else {
    const idx = saveData.ownedWeapons.indexOf(giftSelectedWeapon);
    if (idx >= 0) saveData.ownedWeapons.splice(idx, 1);
    if (selectedWeapon === giftSelectedWeapon) selectedWeapon = "normal";
    if (activeWeapons.includes(giftSelectedWeapon)) {
      activeWeapons = activeWeapons.filter(k => k !== giftSelectedWeapon);
      if (activeWeapons.length === 0) activeWeapons = ["normal"];
    }
  }

    const raw = localStorage.getItem(SHARED_KEY);

  try {
    const SHARED_KEY = "neonBulletGiftInbox_v1";
    const raw = localStorage.getItem(SHARED_KEY);
    if (!raw) return;
    let box = JSON.parse(raw);
    const mine = box.filter(g => g.to === saveData.userName);
    if (mine.length === 0) return;
    for (const g of mine) {
      if (g.type === "coin") saveData.coins = (saveData.coins || 0) + g.value;
      else if (g.type === "weapon") { if (!saveData.ownedWeapons.includes(g.value)) saveData.ownedWeapons.push(g.value); }
      saveData.giftInbox.push(g);
    }
    box = box.filter(g => g.to !== saveData.userName);
    localStorage.setItem(SHARED_KEY, JSON.stringify(box));
    writeSave();
    showGiftReceivePopup(mine.length);

    }
    lines.push(line);
    for (let i = 0; i < Math.min(lines.length, 5); i++) {
      ctx.textAlign = "left";
      ctx.fillText(lines[i], bx+10, by+28+i*22);
      ctx.textAlign = "center";
    }
    ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.font = "13px Arial";
    ctx.fillText(`送信先: ${giftTargetUser}`, W/2, 360);
    ctx.fillText(`内容: ${giftSelectedType === "coin" ? "🪙 " + giftSelectedCoin : "⚔️ " + weapons[giftSelectedWeapon].name}`, W/2, 385);
    const canGo = giftMessage.trim().length > 0;
    const bw2 = 140, bh2 = 50, by2 = 430;
    const yx = W/2 - bw2 - 8, nx = W/2 + 8;
    ctx.shadowBlur = canGo ? 20 : 0; ctx.shadowColor = "#ffd700"; ctx.strokeStyle = canGo ? "#ffd700" : "#555"; ctx.lineWidth = 3;
    ctx.strokeRect(yx, by2, bw2, bh2);
    ctx.fillStyle = canGo ? "rgba(255,215,0,.15)" : "rgba(80,80,80,.3)";
    ctx.fillRect(yx, by2, bw2, bh2);
    ctx.fillStyle = canGo ? "#ffd700" : "#888"; ctx.font = "bold 18px Arial";
    ctx.fillText("送信 ▶", yx+bw2/2, by2+32);
    ctx.shadowBlur = 20; ctx.shadowColor = "#888"; ctx.strokeStyle = "#888"; ctx.lineWidth = 3;
    ctx.strokeRect(nx, by2, bw2, bh2);
    ctx.fillStyle = "rgba(136,136,136,.15)"; ctx.fillRect(nx, by2, bw2, bh2);
    ctx.fillStyle = "#888"; ctx.font = "bold 18px Arial";
    ctx.fillText("◀ 戻る", nx+bw2/2, by2+32);
  }
  else if (giftScreen === "sent") {
    ctx.shadowBlur = 30; ctx.shadowColor = "#ffd700";
    ctx.fillStyle = "#ffd700"; ctx.font = "bold 34px Arial";
    ctx.fillText("🎁 送信完了！", W/2, 240);
    ctx.shadowBlur = 10; ctx.fillStyle = "#fff"; ctx.font = "bold 16px Arial";
    ctx.fillText(`${giftTargetUser} さんに`, W/2, 290);
    ctx.fillStyle = "#ffd700"; ctx.font = "bold 20px Arial";
    const txt = giftSelectedType === "coin" ? `🪙 ${giftSelectedCoin} コイン` : `⚔️ ${weapons[giftSelectedWeapon].name}`;
    ctx.fillText(txt, W/2, 325);
    ctx.fillStyle = "#fff"; ctx.font = "14px Arial";
    ctx.fillText("をプレゼントしました！", W/2, 355);
    const bw = 200, bh = 50, bx = (W-bw)/2, by = 420;
    ctx.shadowBlur = 20; ctx.shadowColor = "#00ffcc"; ctx.strokeStyle = "#00ffcc"; ctx.lineWidth = 3;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = "rgba(0,255,204,.15)"; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = "#00ffcc"; ctx.font = "bold 18px Arial";
    ctx.fillText("タイトルへ戻る", W/2, by+32);
  }
  ctx.restore();
  ctx.textAlign = "left";
}

function drawInbox(){
  if (!inboxScreen) return;
  ctx.save();
  ctx.fillStyle = "rgba(0,0,10,.95)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.shadowBlur = 25; ctx.shadowColor = "#88ff88";
  ctx.fillStyle = "#88ff88"; ctx.font = "bold 24px Arial";
  ctx.fillText("🎁 受信BOX", W/2, 40);
  ctx.fillStyle = "#fff"; ctx.font = "12px Arial"; ctx.shadowBlur = 0;
  ctx.fillText(`あなた宛てのギフト: ${saveData.giftInbox.length} 件`, W/2, 62);
  const LT = 90, IH = 90, GAP = 10;
  for (let i = 0; i < saveData.giftInbox.length; i++) {
    const g = saveData.giftInbox[i];
    const y = LT + i*(IH+GAP) - inboxScroll;
    if (y+IH < LT || y > H-100) continue;
    ctx.shadowBlur = 15; ctx.shadowColor = "#ffd700"; ctx.strokeStyle = "#ffd700"; ctx.lineWidth = 2;
    ctx.strokeRect(24, y, W-48, IH);
    ctx.fillStyle = "rgba(255,215,0,.06)"; ctx.fillRect(24, y, W-48, IH);
    ctx.textAlign = "left";
    ctx.fillStyle = "#ffd700"; ctx.font = "bold 14px Arial";
    ctx.fillText(`From: ${g.from}`, 40, y+24);
    ctx.fillStyle = "#fff"; ctx.font = "bold 15px Arial";
    const txt = g.type === "coin" ? `🪙 ${g.value} コイン` : `⚔️ ${weapons[g.value] ? weapons[g.value].name : g.value}`;
    ctx.fillText(txt, 40, y+48);
    ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.font = "12px Arial";
    ctx.fillText(g.message, 40, y+70);
    ctx.textAlign = "center";
  }
  const bby = H-45, bbw = 200, bbx = (W-bbw)/2;
  ctx.shadowBlur = 20; ctx.shadowColor = "#00ffcc"; ctx.strokeStyle = "#00ffcc"; ctx.lineWidth = 3;
  ctx.strokeRect(bbx, bby-22, bbw, 44);
  ctx.fillStyle = "rgba(0,255,204,.15)"; ctx.fillRect(bbx, bby-22, bbw, 44);
  ctx.fillStyle = "#00ffcc"; ctx.font = "bold 18px Arial";
  ctx.fillText("◀ 戻る", W/2, bby+7);
  ctx.restore();
  ctx.textAlign = "left";
}

/* ========== タイトルへ組み込み ========== */
const _origDrawTitle = window.drawTitle;
window.drawTitle = function(){
  if (needsNameInput() && !nameInputActive) openNameInput();
  if (nameInputActive) { drawNameInput(); return; }
  _origDrawTitle();
  drawGiftButton();
  drawGiftReceivePopup();
};

/* ★ 丸ボタン描画（右上・設定ボタンの下） */
function drawGiftButton(){
  if (showDailyBonusPopup) return;
  ctx.save();
  ctx.textAlign = "center";
  const cx = TITLE_GIFT_BTN_X, cy = TITLE_GIFT_BTN_Y, r = TITLE_GIFT_BTN_R;
  const hue = (Date.now()*0.2)%360;
  ctx.shadowBlur = 25; ctx.shadowColor = `hsl(${hue},100%,60%)`;
  ctx.fillStyle = "rgba(0,20,30,.7)";
  ctx.strokeStyle = `hsl(${hue},100%,60%)`;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.font = "bold 22px Arial";
  ctx.fillStyle = `hsl(${hue},100%,70%)`;
  ctx.fillText("🎁", cx, cy + 1);
  ctx.restore();
  ctx.textAlign = "left";
}

/* 描画フック */
const _origDraw = window.draw;
window.draw = function(){
  if (giftScreen !== "none") { drawBackground(); drawGiftScreen(); return; }
  if (inboxScreen) { drawBackground(); drawInbox(); return; }
  _origDraw();
};

/* ========== 入力フック ========== */
const _origStart = startPointer;
function giftStart(e){
  if (e.target === nameEl) return;
  if (nameInputActive) {
    e.stopImmediatePropagation(); e.preventDefault();
    const p = getPointerPosition(e);
    const cbw = 220, cbh = 54, cbx = (W-cbw)/2, cby = 400;
    if (p.x >= cbx && p.x <= cbx+cbw && p.y >= cby && p.y <= cby+cbh) {
      initAudio(); sfx.tap(); confirmNameInput();
    }
    return;
  }
  if (giftScreen === "none" && !inboxScreen && titleScreen && !showDailyBonusPopup && !abortPopup && !settingsScreen) {
    const p = getPointerPosition(e);
    const dx = p.x - TITLE_GIFT_BTN_X;
    const dy = p.y - TITLE_GIFT_BTN_Y;
    if (dx*dx + dy*dy <= TITLE_GIFT_BTN_R*TITLE_GIFT_BTN_R) {
      e.stopImmediatePropagation(); e.preventDefault();
      initAudio(); openGiftMenu();
      return;
    }
  }
  if (giftScreen !== "none" || inboxScreen) {
    e.stopImmediatePropagation(); e.preventDefault();
    initAudio();
    const p = getPointerPosition(e);
    if (inboxScreen) {
      const bby = H-45, bbw = 200, bbx = (W-bbw)/2;
      if (p.x >= bbx && p.x <= bbx+bbw && p.y >= bby-22 && p.y <= bby+22) { sfx.tap(); inboxScreen = false; }
      return;
    }
    if (giftScreen === "menu") {
      const bw = 300, bh = 60, bx = (W-bw)/2;
      const items = [
        { y: 180, action: () => { giftSelectedType = "coin"; giftScreen = "coin"; sfx.tap(); } },
        { y: 260, action: () => { giftSelectedType = "weapon"; giftScreen = "weapon"; sfx.tap(); } },
        { y: 340, action: () => { receiveGifts(); inboxScreen = true; inboxScroll = 0; sfx.tap(); } },
        { y: 440, action: closeGift }
      ];
      for (const it of items) {
        if (p.x >= bx && p.x <= bx+bw && p.y >= it.y && p.y <= it.y+bh) { it.action(); return; }
      }
      return;
    }
    if (giftScreen === "coin") {
      const bw = 140, bh = 50, gap = 12;
      for (let i = 0; i < GIFT_COIN_PRESETS.length; i++) {
        const c = i % 2, r = Math.floor(i/2);
        const x = (W - (bw*2+gap))/2 + c*(bw+gap);
        const y = 200 + r*(bh+gap);
        if (p.x >= x && p.x <= x+bw && p.y >= y && p.y <= y+bh) {
          const v = GIFT_COIN_PRESETS[i];
          if (saveData.coins >= v) { giftSelectedCoin = v; sfx.tap(); }
          return;
        }
      }
      const sx = 60, sw = W-120, sy = 400;
      if (p.x >= sx && p.x <= sx+sw && p.y >= sy-20 && p.y <= sy+20) {
        giftSelectedCoin = Math.max(1, Math.round((p.x - sx)/sw*1000));
        return;
      }
      const bw2 = 140, bh2 = 50, by2 = 470;
      const yx = W/2 - bw2 - 8, nx = W/2 + 8;
      const canGo = saveData.coins >= giftSelectedCoin && giftSelectedCoin > 0;
      if (p.x >= yx && p.x <= yx+bw2 && p.y >= by2 && p.y <= by2+bh2) { if (canGo) { giftScreen = "target"; sfx.tap(); } return; }
      if (p.x >= nx && p.x <= nx+bw2 && p.y >= by2 && p.y <= by2+bh2) { giftScreen = "menu"; sfx.tap(); return; }
      return;
    }
    if (giftScreen === "weapon") {
      const list = saveData.ownedWeapons.slice();
      const unique = [...new Set(list)];
      const LT = 170, IH = 56, GAP = 8;
      for (let i = 0; i < unique.length; i++) {
        const k = unique[i];
        const cnt = list.filter(x => x === k).length;
        const y = LT + i*(IH+GAP) - giftWeaponScroll;
        if (p.x >= 24 && p.x <= W-24 && p.y >= y && p.y <= y+IH) {
          if (cnt > 1) { giftSelectedWeapon = k; sfx.tap(); }
          return;
        }
      }
      const bw2 = 140, bh2 = 50, by2 = H-70;
      const yx = W/2 - bw2 - 8, nx = W/2 + 8;
      const canGo = giftSelectedWeapon && saveData.ownedWeapons.filter(k => k === giftSelectedWeapon).length > 1;
      if (p.x >= yx && p.x <= yx+bw2 && p.y >= by2 && p.y <= by2+bh2) { if (canGo) { giftScreen = "target"; sfx.tap(); } return; }
      if (p.x >= nx && p.x <= nx+bw2 && p.y >= by2 && p.y <= by2+bh2) { giftScreen = "menu"; sfx.tap(); return; }
      return;
    }
    if (giftScreen === "target") {
      const bw2 = 140, bh2 = 50, by2 = 320;
      const yx = W/2 - bw2 - 8, nx = W/2 + 8;
      const canGo = giftTargetUser.trim().length > 0;
      if (p.x >= yx && p.x <= yx+bw2 && p.y >= by2 && p.y <= by2+bh2) { if (canGo) { giftScreen = "message"; sfx.tap(); } return; }
      if (p.x >= nx && p.x <= nx+bw2 && p.y >= by2 && p.y <= by2+bh2) { giftScreen = "menu"; sfx.tap(); return; }
      return;
    }
    if (giftScreen === "message") {
      const bw2 = 140, bh2 = 50, by2 = 430;
      const yx = W/2 - bw2 - 8, nx = W/2 + 8;
      const canGo = giftMessage.trim().length > 0;
      if (p.x >= yx && p.x <= yx+bw2 && p.y >= by2 && p.y <= by2+bh2) { if (canGo) sendGift(); return; }
      if (p.x >= nx && p.x <= nx+bw2 && p.y >= by2 && p.y <= by2+bh2) { giftScreen = "target"; sfx.tap(); return; }
      return;
    }
    if (giftScreen === "sent") {
      const bw = 200, bh = 50, bx = (W-bw)/2, by = 420;
      if (p.x >= bx && p.x <= bx+bw && p.y >= by && p.y <= by+bh) { giftScreen = "none"; sfx.tap(); }
      return;
    }
  }
  _origStart(e);
}
canvas.addEventListener("touchstart", giftStart, { passive:false, capture:true });
canvas.addEventListener("mousedown", giftStart, { capture:true });
canvas.removeEventListener("touchstart", startPointer);
canvas.removeEventListener("mousedown", startPointer);

/* 名前入力のキーボード処理を元ハンドラより先に処理 */
window.addEventListener("keydown", (e) => {
  if (nameInputActive) {
    e.stopImmediatePropagation();
    return;
  }
  if (giftScreen === "target" || giftScreen === "message") {
    e.stopImmediatePropagation();
    if (e.key === "Enter") {
      if (giftScreen === "target" && giftTargetUser.trim().length > 0) { giftScreen = "message"; sfx.tap(); }
      else if (giftScreen === "message" && giftMessage.trim().length > 0) sendGift();
    } else if (e.key === "Escape") {
      giftScreen = giftScreen === "target" ? "menu" : "target";
    } else if (e.key === "Backspace") {
      if (giftScreen === "target") giftTargetUser = giftTargetUser.slice(0, -1);
      else giftMessage = giftMessage.slice(0, -1);
    } else if (e.key.length === 1 && giftScreen === "target" && giftTargetUser.length < 12) {
      giftTargetUser += e.key;
    } else if (e.key.length === 1 && giftScreen === "message" && giftMessage.length < 80) {
      giftMessage += e.key;
    }
    return;
  }
}, true);

/* 起動時に受信 */
setTimeout(receiveGifts, 600);

})();
</script>
