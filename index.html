
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>NEON BULLET SURVIVAL</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #05050a; overflow: hidden;
  display: flex; justify-content: center; align-items: center;
  height: 100vh; font-family: Arial, sans-serif; touch-action: none;
}
canvas {
  width: min(100vw, 66.6vh); height: min(150vw, 100vh);
  max-width: 480px; max-height: 720px;
  background: #020205; border: 3px solid #00ffcc;
  box-shadow:
    0 0 15px #00ffcc,
    0 0 35px rgba(0, 255, 204, .4),
    0 0 60px rgba(255, 0, 255, .3);
  touch-action: none;
  animation: pulseBorder 3s infinite;
}
@keyframes pulseBorder {
  0%, 100% { border-color: #00ffcc; }
  50% { border-color: #ff00ff; }
}
#loading { position: fixed; color: #00ffcc; font-size: 20px; }
</style>
</head>
<body>
<div id="loading">LOADING...</div>
<canvas id="game" width="480" height="720"></canvas>
<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
document.getElementById("loading").remove();

const W = canvas.width;
const H = canvas.height;
const TAU = Math.PI * 2;

let highScore = 0;
try { highScore = Number(localStorage.getItem("neonHighScore")) || 0; } catch { highScore = 0; }

/* ボス撃破カウント */
let bossKillCount = 0;
const BOSS_KILL_TARGET = 2;
let gameClear = false;

/* 合成モード（常時解放） */
let fusionMode = false;
let fusionSelected = [];
let activeWeapons = [];

/* クイックモード */
let quickMode = false;

/* 武器ごとのクールダウン */
let weaponCools = {};

const player = {
  x: W/2, y: H-120,
  r: 8, hitR: 8, drawR: 12,
  hp: 50, maxHp: 50, cool: 0, invincible: 0,
  dashTimer: 0, dashCooldown: 0, dashVx: 0, dashVy: 0
};

let score = 0, level = 1, exp = 0, nextExp = 6, time = 0, difficulty = 1;
let titleScreen = true, weaponMenu = true, gameOver = false;
let selectedWeapon = null, rainbowHue = 0;
let combo = 0, comboTimer = 0, maxCombo = 0;
let wave = 1, waveTimer = 0, bossActive = false;

let screenShake = 0;
let shakeX = 0, shakeY = 0;
let hitStop = 0;
let flashScreen = 0;
let flashColor = "#ffffff";
let chromaOffset = 0;
let bgTint = 0;
let dangerTint = 0;
let beatPulse = 0;
let zoomPulse = 1;

let fxMode = "chaos";
const FX = {
  shakeMultiplier: 1, particleMultiplier: 1, flashMultiplier: 1,
  chromaMultiplier: 1, bgMultiplier: 1, constantShake: 0.5, hitStopMultiplier: 1
};
function applyFxMode() {
  if (fxMode === "safe") {
    FX.shakeMultiplier = 0.15; FX.particleMultiplier = 0.15; FX.flashMultiplier = 0.1;
    FX.chromaMultiplier = 0; FX.bgMultiplier = 0.3; FX.constantShake = 0; FX.hitStopMultiplier = 0.3;
  } else if (fxMode === "normal") {
    FX.shakeMultiplier = 0.5; FX.particleMultiplier = 0.4; FX.flashMultiplier = 0.5;
    FX.chromaMultiplier = 0.3; FX.bgMultiplier = 0.7; FX.constantShake = 0.15; FX.hitStopMultiplier = 0.6;
  } else {
    FX.shakeMultiplier = 1; FX.particleMultiplier = 0.7; FX.flashMultiplier = 1;
    FX.chromaMultiplier = 1; FX.bgMultiplier = 1; FX.constantShake = 0.4; FX.hitStopMultiplier = 1;
  }
}
applyFxMode();

let damageNumbers = [];
let powerups = [];
let powerUpFlash = null;
let afterImages = [];
const WAVE_DURATION = 900;

let rapidTimer = 0, rapidCooldown = 0;
const RAPID_ACTIVE_TIME = 120, RAPID_COOLDOWN_TIME = 180;
let knifeAngle = -Math.PI/2, knifeTouchMode = null;
let mathProblem = null, mathCooldown = 0, mathFlash = null;
let orbitAngle = 0, lightningBolts = [], turrets = [];
let mines = [];
let swordAngle = -Math.PI/2;
let vampireHeal = 0;

let weaponPower = {};

let bullets = [], enemies = [], enemyBullets = [];
let particles = [], shockwaves = [], stars = [];
let shootingStars = [];
let nebulae = [];
let auroraBands = [];

const weapons = {
  normal:    { name:"NORMAL GUN",      description:"レベルで弾数アップ",       color:"#00ffcc" },
  spiral:    { name:"EXPLOSIVE SHELL", description:"着弾爆発＋誘導",           color:"#cc66ff" },
  rapid:     { name:"RAPID FIRE",      description:"高速連射とクールタイム",   color:"#ffcc00" },
  knife:     { name:"KNIFE",           description:"方向を狙って投げる",       color:"#ff5566" },
  mochi:     { name:"MOCHI CANNON",    description:"吹き飛ばし＋ダメージ",     color:"#ffe0a3" },
  math:      { name:"MATH BOMB",       description:"正解で周囲爆破",           color:"#66ccff" },
  auto:      { name:"AUTO AIM",        description:"射程UP・貫通弾",           color:"#99ff66" },
  spray:     { name:"SPRAY SHOT",      description:"弾数増・収束UP",           color:"#ff8844" },
  boomerang: { name:"BOOMERANG",       description:"往復する貫通攻撃",         color:"#7cff6b" },
  orbit:     { name:"ORBIT SATELLITE", description:"周回攻撃",                 color:"#c8a2ff" },
  lightning: { name:"CHAIN LIGHTNING", description:"連鎖攻撃",                 color:"#66e0ff" },
  blackhole: { name:"BLACK HOLE",      description:"吸引＋圧縮",               color:"#9b59ff" },
  turret:    { name:"SENTRY TURRET",   description:"自動タレット",             color:"#ff9955" },
  freeze:    { name:"FREEZE RAY",      description:"凍結中は被ダメ2倍",        color:"#a3e8ff" },
  shotgun:   { name:"SHOTGUN",         description:"近距離超高火力",           color:"#ff6644" },
  laser:     { name:"LASER BEAM",      description:"貫通する極太ビーム",       color:"#ff00ff" },
  missile:   { name:"MISSILE",         description:"追尾ホーミング",           color:"#ffaa22" },
  mine:      { name:"MINE LAYER",      description:"設置型の地雷",             color:"#dd3333" },
  flame:     { name:"FLAME THROWER",   description:"近距離の炎放射",           color:"#ff8822" },
  railgun:   { name:"RAILGUN",         description:"画面貫通の超高速弾",       color:"#00eeff" },
  cluster:   { name:"CLUSTER BOMB",    description:"炸裂して子弾を撒く",       color:"#ccff33" },
  vampire:   { name:"VAMPIRE",         description:"与ダメでHP回復",           color:"#cc0066" },
  gravity:   { name:"GRAVITY WELL",    description:"敵を引き寄せ圧縮",         color:"#8844ff" },
  sword:     { name:"NEON SWORD",      description:"近接の斬撃・高威力",       color:"#ffffff" },
  iceshard:  { name:"ICE SHARD",       description:"拡散する氷の破片",         color:"#ccefff" },
  poison:    { name:"POISON",          description:"毒で継続ダメージ",         color:"#88ff44" },
  holybeam:  { name:"HOLY BEAM",       description:"上空から光の柱",           color:"#ffeeaa" },
  bow:       { name:"BOW",             description:"溜め撃ち・貫通",           color:"#c8a06a" },
  chakram:   { name:"CHAKRAM",         description:"外周を回る円刃",           color:"#ffddaa" },
  bubble:    { name:"BUBBLE",          description:"敵を浮かせる泡",           color:"#aaddff" },
  thunder:   { name:"THUNDER",         description:"落雷を落とす",             color:"#ffee44" },
  drone:     { name:"DRONE",           description:"追従する小型ドローン",     color:"#aaeeff" },
  spike:     { name:"SPIKE",           description:"地面から棘を出現",         color:"#aabbbb" },
  nova:      { name:"NOVA",            description:"全方位の爆発波",           color:"#ffffff" }
};
const WEAPON_ORDER = Object.keys(weapons);

function isPowerThreshold(lv) { return lv > 0 && lv % 3 === 0; }

/* =========================
   背景（軽量化）
========================= */
function createStars() {
  stars = [];
  for (let i = 0; i < 350; i++) {   /* 1000 → 350 に削減 */
    const depth = Math.random();
    stars.push({
      x: Math.random()*W, y: Math.random()*H,
      speed: 0.2 + depth*3.5,
      size: 0.3 + depth*1.5,
      length: 1 + depth*7,
      alpha: 0.1 + depth*0.7,
      twinkle: Math.random() * TAU,
      twinkleSpeed: 0.03 + Math.random()*0.08,
      hue: Math.random() < 0.6 ? Math.random()*360 : 0
    });
  }
  nebulae = [];
  for (let i = 0; i < 4; i++) {   /* 8 → 4 に削減 */
    nebulae.push({
      x: Math.random()*W, y: Math.random()*H,
      r: 100 + Math.random()*180,
      hue: Math.random()*360,
      alpha: 0.08 + Math.random()*0.1,
      speed: 0.02 + Math.random()*0.04
    });
  }
  shootingStars = [];
  auroraBands = [];
  for (let i = 0; i < 2; i++) {   /* 4 → 2 に削減 */
    auroraBands.push({
      phase: Math.random()*TAU,
      speed: 0.005 + Math.random()*0.008,
      yBase: H * (0.15 + i * 0.35),
      hue: Math.random()*360,
      amp: 60 + Math.random()*60
    });
  }
}
function updateStars() {
  for (const s of stars) {
    s.y += s.speed;
    s.twinkle += s.twinkleSpeed;
    if (s.y > H+10) { s.y = -10; s.x = Math.random()*W; }
  }
  for (const n of nebulae) {
    n.y += n.speed;
    if (n.y - n.r > H) { n.y = -n.r; n.x = Math.random()*W; }
  }
  if (Math.random() < 0.012 * FX.bgMultiplier) {   /* 頻度ダウン */
    shootingStars.push({
      x: Math.random()*W, y: -20,
      vx: -8 - Math.random()*6, vy: 5 + Math.random()*4,
      life: 100, length: 80 + Math.random()*100,
      hue: Math.random()*360
    });
  }
  for (let i = shootingStars.length-1; i >= 0; i--) {
    const ss = shootingStars[i];
    ss.x += ss.vx; ss.y += ss.vy; ss.life--;
    if (ss.life <= 0 || ss.x < -100 || ss.y > H+100) shootingStars.splice(i,1);
  }
}
function drawBackground() {
  ctx.fillStyle = "#02020a";
  ctx.fillRect(0, 0, W, H);
  const hueShift = bgTint + time * 0.3;
  const dangerA = dangerTint;
  for (const n of nebulae) {
    const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    grad.addColorStop(0, `hsla(${(n.hue + hueShift) % 360}, 90%, 55%, ${n.alpha * FX.bgMultiplier * 1.4})`);
    grad.addColorStop(1, `hsla(${(n.hue + hueShift) % 360}, 90%, 55%, 0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(n.x - n.r, n.y - n.r, n.r*2, n.r*2);
  }
  if (FX.bgMultiplier > 0.2) {
    for (const band of auroraBands) {
      band.phase += band.speed;
      const hue = (band.hue + hueShift + time * 0.5) % 360;
      const grad = ctx.createLinearGradient(0, band.yBase - 100, 0, band.yBase + 100);
      grad.addColorStop(0, `hsla(${hue}, 90%, 60%, 0)`);
      grad.addColorStop(0.5, `hsla(${hue}, 90%, 60%, ${0.14 * FX.bgMultiplier})`);
      grad.addColorStop(1, `hsla(${hue}, 90%, 60%, 0)`);
      ctx.fillStyle = grad;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, band.yBase);
      for (let x = 0; x <= W; x += 40) {   /* 20 → 40 に削減 */
        const y = band.yBase + Math.sin(band.phase + x * 0.015) * band.amp;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, band.yBase + 150);
      ctx.lineTo(0, band.yBase + 150);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.rotate(-Math.PI / 5 + Math.sin(time*0.005)*0.05);
  const milkyGrad = ctx.createLinearGradient(0, -140, 0, 140);
  const mh = (hueShift + time * 0.8) % 360;
  milkyGrad.addColorStop(0, `hsla(${mh}, 80%, 70%, 0)`);
  milkyGrad.addColorStop(0.3, `hsla(${(mh+60)%360}, 90%, 70%, ${.13 * FX.bgMultiplier})`);
  milkyGrad.addColorStop(0.5, `hsla(${(mh+120)%360}, 90%, 80%, ${.22 * FX.bgMultiplier})`);
  milkyGrad.addColorStop(0.7, `hsla(${(mh+180)%360}, 90%, 70%, ${.13 * FX.bgMultiplier})`);
  milkyGrad.addColorStop(1, `hsla(${(mh+240)%360}, 80%, 70%, 0)`);
  ctx.fillStyle = milkyGrad;
  ctx.fillRect(-W, -140, W*2, 280);
  ctx.restore();
  for (const s of stars) {
    const twinkle = 0.6 + Math.sin(s.twinkle) * 0.5;
    const alpha = s.alpha * twinkle;
    const hue = s.hue ? `hsla(${(s.hue + hueShift) % 360}, 90%, 75%, ${alpha})` : `rgba(220, 235, 255, ${alpha})`;
    ctx.strokeStyle = hue;
    ctx.lineWidth = s.size;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x, s.y - s.length);
    ctx.stroke();
  }
  for (const ss of shootingStars) {
    const alpha = Math.min(1, ss.life / 50);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = `hsla(${(ss.hue + hueShift) % 360}, 95%, 80%, 1)`;
    ctx.shadowBlur = 15;
    ctx.shadowColor = `hsla(${(ss.hue + hueShift) % 360}, 95%, 80%, 1)`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ss.x, ss.y);
    ctx.lineTo(ss.x - ss.vx * (ss.length/10), ss.y - ss.vy * (ss.length/10));
    ctx.stroke();
    ctx.restore();
  }
  if (dangerA > 0) {
    const pulse = 0.5 + Math.sin(time * 0.2) * 0.5;
    ctx.fillStyle = `rgba(255, 0, 40, ${dangerA * 0.35 * pulse * FX.bgMultiplier})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* 演出ヘルパー */
function shake(amount) { screenShake = Math.max(screenShake, amount * FX.shakeMultiplier); }
function hitStopAdd(frames) { hitStop = Math.max(hitStop, Math.floor(frames * FX.hitStopMultiplier)); }
function flash(color, frames) {
  if (FX.flashMultiplier <= 0.01) return;
  flashScreen = Math.max(flashScreen, Math.floor(frames * FX.flashMultiplier));
  flashColor = color || "#ffffff";
}
function chroma(amount) {
  if (FX.chromaMultiplier <= 0.01) return;
  chromaOffset = Math.max(chromaOffset, amount * FX.chromaMultiplier);
}
function burst(x, y, count, color) {
  const n = Math.floor(count * FX.particleMultiplier);
  for (let i = 0; i < n; i++) {
    const a = Math.random()*TAU, s = 1 + Math.random()*6;
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 25 + Math.random()*25, color,
      size: 2 + Math.random()*3
    });
  }
  /* 上限を3000→1500に削減 */
  if (particles.length > 1500) particles.splice(0, particles.length - 1500);
}

/* 入力 */
let touchX = null, touchY = null, menuStartY = 0, menuDragged = false;
const keys = {};

function getPointerPosition(e) {
  const rect = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * W / rect.width,
    y: (src.clientY - rect.top) * H / rect.height
  };
}

const MENU_MARGIN = 24, MENU_TOP = 96;
const MENU_ITEM_HEIGHT = 100, MENU_GAP = 14;
const MENU_WIDTH = W - MENU_MARGIN*2;
const MENU_VIEW_HEIGHT = H - MENU_TOP;
let menuScrollY = 0;

function menuContentHeight() { return WEAPON_ORDER.length*(MENU_ITEM_HEIGHT+MENU_GAP) - MENU_GAP; }
function menuMaxScroll() { return Math.max(0, menuContentHeight() - MENU_VIEW_HEIGHT); }

function p_inRange(px, py, x, y, w, h) {
  return px >= x && px <= x+w && py >= y && py <= y+h;
}

function selectWeapon(type) {
  selectedWeapon = type; weaponMenu = false;
  activeWeapons = [type];
  fusionMode = false;
  quickMode = false;
  player.x = W/2; player.y = H-120; player.cool = 0;
  knifeAngle = -Math.PI/2; knifeTouchMode = null;
  swordAngle = -Math.PI/2;
  rapidTimer = 0; rapidCooldown = 0;
  mathCooldown = 0; mathFlash = null;
  vampireHeal = 0;
  bullets = []; enemyBullets = []; turrets = []; lightningBolts = [];
  powerups = []; mines = []; afterImages = [];
  weaponPower = {};
  weaponCools = {};
  bossKillCount = 0;
  gameClear = false;
  if (type === "math") generateMathProblem(); else mathProblem = null;
  shake(25); flash(weapons[type].color, 10); chroma(10);
}

function startFusionGame() {
  if (fusionSelected.length < 2) return;
  activeWeapons = fusionSelected.slice();
  selectedWeapon = activeWeapons[0];
  weaponMenu = false;
  fusionMode = true;
  quickMode = false;
  player.x = W/2; player.y = H-120; player.cool = 0;
  knifeAngle = -Math.PI/2; knifeTouchMode = null;
  swordAngle = -Math.PI/2;
  rapidTimer = 0; rapidCooldown = 0;
  mathCooldown = 0; mathFlash = null;
  vampireHeal = 0;
  bullets = []; enemyBullets = []; turrets = []; lightningBolts = [];
  powerups = []; mines = []; afterImages = [];
  weaponPower = {};
  weaponCools = {};
  bossKillCount = 0;
  gameClear = false;
  if (activeWeapons.includes("math")) generateMathProblem(); else mathProblem = null;
  shake(50); flash("#ff00ff", 15); chroma(20);
}

function selectWeaponAt(x, y) {
  if (fusionMode) {
    if (fusionSelected.length >= 2) {
      const btnY = H - 50;
      const btnW = 200;
      const btnX = (W - btnW) / 2;
      if (p_inRange(x, y, btnX, btnY - 25, btnW, 40)) {
        startFusionGame();
        return;
      }
    }
    if (x < MENU_MARGIN || x > MENU_MARGIN+MENU_WIDTH || y < MENU_TOP || y > H) return;
    const localY = y - MENU_TOP + menuScrollY;
    const idx = Math.floor(localY / (MENU_ITEM_HEIGHT+MENU_GAP));
    if (idx < 0 || idx >= WEAPON_ORDER.length) return;
    if (localY % (MENU_ITEM_HEIGHT+MENU_GAP) > MENU_ITEM_HEIGHT) return;
    const key = WEAPON_ORDER[idx];
    const i = fusionSelected.indexOf(key);
    if (i >= 0) fusionSelected.splice(i, 1);
    else fusionSelected.push(key);
    return;
  }
  if (x < MENU_MARGIN || x > MENU_MARGIN+MENU_WIDTH || y < MENU_TOP || y > H) return;
  const localY = y - MENU_TOP + menuScrollY;
  const idx = Math.floor(localY / (MENU_ITEM_HEIGHT+MENU_GAP));
  if (idx < 0 || idx >= WEAPON_ORDER.length) return;
  if (localY % (MENU_ITEM_HEIGHT+MENU_GAP) <= MENU_ITEM_HEIGHT) selectWeapon(WEAPON_ORDER[idx]);
}

function tryDash() {
  if (player.dashCooldown > 0 || player.dashTimer > 0) return;
  let dx = 0, dy = 0;
  if (keys.arrowleft || keys.a) dx -= 1;
  if (keys.arrowright || keys.d) dx += 1;
  if (keys.arrowup || keys.w) dy -= 1;
  if (keys.arrowdown || keys.s) dy += 1;
  if (dx === 0 && dy === 0) dy = -1;
  const len = Math.hypot(dx, dy);
  player.dashVx = dx/len * 14;
  player.dashVy = dy/len * 14;
  player.dashTimer = 12;
  player.dashCooldown = 45;
  player.invincible = Math.max(player.invincible, 14);
  burst(player.x, player.y, 20, "#00ffcc");
  burst(player.x, player.y, 10, "#ffffff");
  shake(12);
  flash("#00ffcc", 4);
}

function startPointer(e) {
  e.preventDefault();
  const p = getPointerPosition(e);

  if (titleScreen) {
    /* 演出モード */
    const modes = ["chaos", "normal", "safe"];
    for (let i = 0; i < 3; i++) {
      const x = 60 + i * 130;
      const y = 245;
      const w = 110, h = 60;
      if (p_inRange(p.x, p.y, x, y, w, h)) {
        fxMode = modes[i];
        applyFxMode();
        return;
      }
    }

    /* 合成モードボタン（常時表示） */
    {
      const btnY = 330;
      const btnW = 360;
      const btnH = 55;
      const btnX = (W - btnW) / 2;
      if (p_inRange(p.x, p.y, btnX, btnY, btnW, btnH)) {
        fusionMode = true;
        quickMode = false;
        fusionSelected = [];
        titleScreen = false;
        weaponMenu = true;
        return;
      }
    }

    /* クイックモードボタン */
    {
      const qY = 395;
      const qW = 360;
      const qH = 40;
      const qX = (W - qW) / 2;
      if (p_inRange(p.x, p.y, qX, qY, qW, qH)) {
        quickMode = true;
        fusionMode = false;
        titleScreen = false;
        shake(15); flash("#ffcc00", 6);
        return;
      }
    }

    /* 通常プレイ */
    titleScreen = false;
    quickMode = false;
    fusionMode = false;
    shake(15);
    if (fxMode !== "safe") flash("#00ffcc", 6);
    return;
  }

  if (weaponMenu) { touchX = p.x; touchY = p.y; menuStartY = p.y; menuDragged = false; return; }
  if (gameOver) { resetGame(); return; }
  if (selectedWeapon === "math" && mathProblem && mathCooldown <= 0 && p.y >= 235 && p.y <= 285) {
    for (let i = 0; i < 3; i++) {
      const x = 45 + i*135;
      if (p.x >= x && p.x <= x+120) { answerMathProblem(i); return; }
    }
  }
  if (selectedWeapon === "knife" || selectedWeapon === "sword") {
    const d = Math.hypot(p.x-player.x, p.y-player.y);
    if (d < 70) {
      knifeTouchMode = "aim";
      const a = Math.atan2(p.y-player.y, p.x-player.x);
      knifeAngle = a; swordAngle = a;
    } else knifeTouchMode = "move";
  }
  touchX = p.x; touchY = p.y;
}
function movePointer(e) {
  e.preventDefault();
  if (touchX === null) return;
  const p = getPointerPosition(e);
  if (weaponMenu) {
    const delta = p.y - touchY;
    if (Math.abs(p.y - menuStartY) > 6) menuDragged = true;
    menuScrollY = Math.max(0, Math.min(menuMaxScroll(), menuScrollY - delta));
    touchX = p.x; touchY = p.y; return;
  }
  if (gameOver) return;
  if ((selectedWeapon === "knife" || selectedWeapon === "sword") && knifeTouchMode === "aim") {
    const a = Math.atan2(p.y-player.y, p.x-player.x);
    knifeAngle = a; swordAngle = a;
  } else {
    player.x += p.x - touchX;
    player.y += p.y - touchY;
  }
  touchX = p.x; touchY = p.y;
}
function endPointer() {
  if (weaponMenu && !menuDragged && touchX !== null) {
    selectWeaponAt(touchX, touchY);
  }
  touchX = null; touchY = null; knifeTouchMode = null; menuDragged = false;
}

window.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();
  keys[key] = true;
  if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(key)) e.preventDefault();

  if (titleScreen) {
    if (key === "1") { fxMode = "chaos"; applyFxMode(); return; }
    if (key === "2") { fxMode = "normal"; applyFxMode(); return; }
    if (key === "3") { fxMode = "safe"; applyFxMode(); return; }
    if (key === "f") {
      fusionMode = true;
      quickMode = false;
      fusionSelected = [];
      titleScreen = false;
      weaponMenu = true;
      return;
    }
    if (key === "q") {
      quickMode = true;
      fusionMode = false;
      titleScreen = false;
      shake(15); flash("#ffcc00", 6);
      return;
    }
    titleScreen = false;
    quickMode = false;
    fusionMode = false;
    shake(15);
    if (fxMode !== "safe") flash("#00ffcc", 6);
    return;
  }

  if (weaponMenu) {
    if (fusionMode) {
      if (key === "enter" && fusionSelected.length >= 2) {
        startFusionGame();
        return;
      }
      if (key === "escape") {
        fusionMode = false;
        fusionSelected = [];
        titleScreen = true;
        weaponMenu = false;
        return;
      }
    }
    let idx = -1;
    if (/^[1-9]$/.test(key)) idx = Number(key)-1;
    else if (key === "0") idx = 9;
    else if (/^[a-z]$/.test(key)) idx = 10 + key.charCodeAt(0) - 97;
    if (idx >= 0 && idx < WEAPON_ORDER.length) {
      const wkey = WEAPON_ORDER[idx];
      if (fusionMode) {
        const i = fusionSelected.indexOf(wkey);
        if (i >= 0) fusionSelected.splice(i, 1);
        else fusionSelected.push(wkey);
      } else {
        selectWeapon(wkey);
      }
    }
    return;
  }
  if (gameOver && key === "enter") { resetGame(); return; }
  if (key === " " && !gameOver) { tryDash(); return; }
  if (selectedWeapon === "math" && mathProblem && mathCooldown <= 0) {
    let idx = -1;
    if (/^[1-3]$/.test(key)) idx = Number(key)-1;
    if (idx >= 0) answerMathProblem(idx);
  }
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

function gainExperience(amount) {
  exp += amount;
  while (exp >= nextExp) {
    exp -= nextExp;
    level++;
    nextExp += 8;
    player.hp = Math.min(player.maxHp, player.hp + 8);
    burst(player.x, player.y, 30, "#00ffcc");
    burst(player.x, player.y, 15, "#ffffff");
    shockwaves.push({ x:player.x, y:player.y, radius:10, maxRadius:120, life:25, color:"0,255,204" });
    shake(15);
    flash("#00ffcc", 5);
    if (selectedWeapon && isPowerThreshold(level)) {
      triggerPowerUp();
    }
  }
}

function triggerPowerUp() {

  const cur = weaponPower[key] || 0;

  if (Math.random() < chance) {
    const kinds = ["heal","bomb","exp"];
    const kind = type === "boss" ? (Math.random() < .5 ? "heal" : "bomb") : kinds[Math.floor(Math.random()*kinds.length)];
    powerups.push({ x, y, vy: 1.2, r: 14, kind, life: 600, bob: Math.random()*TAU });

function collectPowerup(p) {
  if (p.kind === "heal") {
    player.hp = Math.min(player.maxHp, player.hp + 15);
    showDamage(p.x, p.y, "+15 HP", "#00ff66");
    burst(p.x, p.y, 30, "#00ff66");
    shake(8);
  } else if (p.kind === "bomb") {
    for (let i = enemies.length-1; i >= 0; i--) {
      const e = enemies[i];
      e.hp -= 10;
      if (e.hp <= 0) killEnemy(i); else showDamage(e.x, e.y, 10, "#ffcc00");
    }
    shockwaves.push({ x:player.x, y:player.y, radius:10, maxRadius:800, life:50, color:"255,200,0" });
    shake(60); flash("#ffcc00", 15); chroma(20); hitStopAdd(10);
    burst(p.x, p.y, 150, "#ffcc00");
    burst(p.x, p.y, 80, "#ffffff");
  } else if (p.kind === "exp") {
    gainExperience(3);
    showDamage(p.x, p.y, "+EXP", "#66ccff");
    burst(p.x, p.y, 30, "#66ccff");
  }
}

function killEnemy(idx) {
  const e = enemies[idx];
  if (!e) return;
  const big = e.type === "heavy" || e.type === "boss" || e.type === "tank";
  burst(e.x, e.y, big ? 120 : 40,
        e.type === "heavy" ? "#ffaa00" :
        e.type === "boss" ? "#ff0044" :
        e.type === "tank" ? "#8866ff" : "#ff0088");
  burst(e.x, e.y, big ? 60 : 20, "#ffffff");
  burst(e.x, e.y, big ? 40 : 15, "#ffff00");
  if (Math.random() < 0.5) burst(e.x, e.y, big ? 50 : 15, "#ff00ff");
  shake(big ? 40 : (e.type === "child" ? 4 : 10));
  if (big) hitStopAdd(10);
  else if (Math.random() < 0.5) hitStopAdd(2);
  if (big || Math.random() < 0.15) {
    flash(e.type === "boss" ? "#ff0044" : "#ff00ff", big ? 8 : 3);
  }
  if (e.type === "boss") {
    shake(120); flash("#ffffff", 25); chroma(30); hitStopAdd(20); zoomPulse = 2;
    for (let k = 0; k < 8; k++) {
      setTimeout(() => {
        const bx = e.x + (Math.random()-.5)*300;
        const by = e.y + (Math.random()-.5)*300;
        burst(bx, by, 60, "#ff0044");
        burst(bx, by, 30, "#ffffff");
        shake(35); flash("#ff0044", 5);
      }, k * 90);
    }
    bossKillCount++;
    if (bossKillCount >= BOSS_KILL_TARGET && !gameClear) {
      gameClear = true;
      gameOver = true;
      shake(180); flash("#ffcc00", 50); chroma(50); hitStopAdd(50); zoomPulse = 2.5;
      for (let k = 0; k < 25; k++) {
        setTimeout(() => {
          const bx = Math.random() * W;
          const by = Math.random() * H;
          burst(bx, by, 70, "#ffcc00");
          burst(bx, by, 35, "#ffffff");
          burst(bx, by, 20, "#ff00ff");
          flash("#ffffff", 6); shake(35);
        }, k * 110);
      }
    }
  }
  addCombo();
  score += Math.round(e.score * comboMultiplier());
  gainExperience(1);
  maybeDropPowerup(e.x, e.y, e.type);
  if (e.type === "boss") {
    bossActive = false;
    shockwaves.push({ x:e.x, y:e.y, radius:10, maxRadius:800, life:60, color:"255,0,68" });
    for (let i = 0; i < 3; i++) {
      powerups.push({
        x: e.x + (i-1)*40, y: e.y, vy: 1.2, r: 14,
        kind: i === 0 ? "heal" : i === 1 ? "bomb" : "exp",
        life: 600, bob: Math.random()*TAU
      });
    }
  }
  enemies.splice(idx, 1);
  if (e.type === "splitter") {
    for (let i = 0; i < 2; i++) {
      enemies.push({
        x: e.x + (i ? 15 : -15), y: e.y,
        r: 8, hp: 1, maxHp: 1, speed: e.speed*1.4,
        type: "child", score: 2, shootRate: 0,
        wave: Math.random()*TAU, wavePower: 2
      });
    }
  }
}

function generateMathProblem() {
  const a = Math.floor(Math.random()*15) - 7;
  const b = Math.floor(Math.random()*9) + 1;
  const minus = Math.random() < .5;
  const answer = minus ? a-b : a+b;
  const values = new Set([answer]);
  const choices = [answer];
  while (choices.length < 3) {
    const w = answer + (Math.floor(Math.random()*9)+1) * (Math.random() < .5 ? -1 : 1);
    if (!values.has(w)) { values.add(w); choices.push(w); }
  }
  for (let i = choices.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [choices[i], choices[j]] = [choices[j], choices[i]];
  }
  mathProblem = { text: `${a}${minus?"-":"+"}${b}`, answer, choices };
}
function answerMathProblem(idx) {
  if (!mathProblem || mathCooldown > 0) return;
  const correct = mathProblem.choices[idx] === mathProblem.answer;
  mathFlash = { correct, timer: 18 };
  mathCooldown = 25;
  if (correct) {
    const p = pw("math");
    const radius = 100 + level*6 + p*20;
    burst(player.x, player.y, 100, "#66ccff");
    burst(player.x, player.y, 50, "#ffffff");
    burst(player.x, player.y, 30, "#ff00ff");
    shockwaves.push({ x:player.x, y:player.y, radius:10, maxRadius:radius, life:30, color:"102,204,255" });
    shockwaves.push({ x:player.x, y:player.y, radius:10, maxRadius:radius*0.7, life:25, color:"255,0,255" });
    shake(50); flash("#66ccff", 12); chroma(20); hitStopAdd(10);
    for (let i = enemies.length-1; i >= 0; i--) {
      const e = enemies[i];
      if (Math.hypot(e.x-player.x, e.y-player.y) < radius + e.r) {
        e.hp -= 4 + level*.6 + p*1.5;
        showBigDamage(e.x, e.y, 4 + level*.6 + p*1.5, "#66ccff");
        if (e.hp <= 0) killEnemy(i);
      }
    }
  } else {
    shake(15);
  }
  generateMathProblem();
}

function updateOrbit() {
  const p = pw("orbit");
  orbitAngle += .055;
  const count = Math.max(1, level) + p*2;
  const radius = 52 + Math.min(25, level*1.5) + p*8;
  const damage = 1 + level*.25 + p*.5;
  for (let i = enemies.length-1; i >= 0; i--) {
    const e = enemies[i];
    if (!e) continue;
    e.orbitCooldown = Math.max(0, (e.orbitCooldown || 0) - 1);
    for (let s = 0; s < count; s++) {
      const a = orbitAngle + s*TAU/count;
      const x = player.x + Math.cos(a)*radius;
      const y = player.y + Math.sin(a)*radius;
      if (Math.hypot(e.x-x, e.y-y) < e.r + 9) {
        if (e.orbitCooldown <= 0) {
          e.hp -= damage; e.orbitCooldown = 18;
          burst(x, y, 10, "#c8a2ff");
          burst(x, y, 5, "#ffffff");
        }
        break;
      }
    }
    if (e.hp <= 0) killEnemy(i);
  }
}
function updateLightning() {
  const p = pw("lightning");
  if (time % Math.max(15, 60 - level*3 - p*5) !== 0) return;
  const avail = enemies.slice();
  const hit = [];
  const points = [{ x: player.x, y: player.y }];
  let from = player;
  for (let c = 0; c < 2 + Math.floor(level/2) + p; c++) {
    let nearest = null, dist = Infinity;
    for (const e of avail) {
      const d = Math.hypot(e.x-from.x, e.y-from.y);
      const rng = c === 0 ? 250 : 150;
      if (d < rng && d < dist) { nearest = e; dist = d; }
    }
    if (!nearest) break;
    hit.push(nearest);
    points.push({ x: nearest.x, y: nearest.y });
    avail.splice(avail.indexOf(nearest), 1);
    from = nearest;
  }
  if (!hit.length) return;
  const damage = 2 + level*.4 + p*.8;
  for (let i = enemies.length-1; i >= 0; i--) {
    if (hit.includes(enemies[i])) {
      enemies[i].hp -= damage;
      showDamage(enemies[i].x, enemies[i].y, damage, "#66e0ff");
      if (enemies[i].hp <= 0) killEnemy(i);
    }
  }
  lightningBolts.push({ points, life: 14 });
  shake(5); chroma(3);
}
function deployTurret() {

  turrets.push({
    x: player.x + (Math.random()-.5)*70, y: player.y + (Math.random()-.5)*70,

function updateTurrets() {
  for (let i = turrets.length-1; i >= 0; i--) {
    const t = turrets[i];
    t.life--; t.cool--;
    if (t.isDrone) {
      const p = pw("drone");
      const a = (time*0.03) + i * (TAU / turrets.length);
      const r = 60 + p*10;
      t.x = player.x + Math.cos(a) * r;
      t.y = player.y + Math.sin(a) * r;
      t.angle = a + Math.PI/2;
    }
    if (t.life <= 0) { turrets.splice(i,1); continue; }
    if (t.cool > 0) continue;
    let target = null, dist = Infinity;
    for (const e of enemies) {
      const d = Math.hypot(e.x-t.x, e.y-t.y);
      if (d < 220 && d < dist) { target = e; dist = d; }
    }
    if (target) {
      const a = Math.atan2(target.y-t.y, target.x-t.x);
      bullets.push({
        x: t.x, y: t.y,
        vx: Math.cos(a)*10, vy: Math.sin(a)*10,
        size:5, damage: t.damage, hue: t.isDrone ? 190 : 25,
        type:"turret", life:300
      });
      t.cool = t.isDrone ? 18 : 25;
    }
  }
}
function updateBlackHole(b) {
  if (b.travel > 0) { b.travel--; return; }
  b.field--; b.pulse++;
  for (const e of enemies) {
    if (e.type === "boss") continue;
    const dx = b.x - e.x;
    const dy = b.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < b.pullRadius) {
      const force = (1 - d / b.pullRadius) * 8 + 2;
      e.x += dx / d * force;
      e.y += dy / d * force;
    }
    if (Math.hypot(e.x - b.x, e.y - b.y) < b.coreRadius + e.r) {
      e.hp -= b.damage;
      if (Math.random() < 0.1) showDamage(e.x, e.y, b.damage, "#9b59ff");
    }
  }
}
function updateMines() {
  for (let i = mines.length-1; i >= 0; i--) {
    const m = mines[i];
    m.life--; m.armTimer--; m.pulse += 0.15;
    if (m.life <= 0) { mines.splice(i,1); continue; }
    if (m.armTimer > 0) continue;
    for (const e of enemies) {
      if (Math.hypot(e.x-m.x, e.y-m.y) < m.r + e.r + 8) {
        const radius = m.blastRadius;
        shockwaves.push({ x:m.x, y:m.y, radius:8, maxRadius:radius, life:20, color:"255,80,80" });
        shockwaves.push({ x:m.x, y:m.y, radius:8, maxRadius:radius*0.7, life:15, color:"255,255,0" });
        burst(m.x, m.y, 100, "#ff5555");
        burst(m.x, m.y, 50, "#ffff00");
        burst(m.x, m.y, 30, "#ffffff");
        shake(40); flash("#ff5555", 10); chroma(12); hitStopAdd(6);
        for (let j = enemies.length-1; j >= 0; j--) {
          const en = enemies[j];
          if (!en) continue;
          if (Math.hypot(en.x-m.x, en.y-m.y) < radius + en.r) {
            en.hp -= m.damage;
            showDamage(en.x, en.y, m.damage, "#ff5555");
            if (en.hp <= 0) killEnemy(j);
          }
        }
        mines.splice(i,1);
        break;
      }
    }
  }
}

function fireWeapon(wkey) {
  const p = pw(wkey);
  if (wkey === "math") return;
  if (wkey === "orbit" || wkey === "lightning") return;

  if (wkey === "turret" || wkey === "drone") {
    if (weaponCools[wkey] > 0) { weaponCools[wkey]--; return; }
    if (wkey === "turret") deployTurret();
    else fireDrone();
    weaponCools[wkey] = Math.max(15, 100 - level*4 - p*8);
    return;
  }
  if (wkey === "mine") {
    if (weaponCools[wkey] > 0) { weaponCools[wkey]--; return; }
    fireMine();
    weaponCools[wkey] = Math.max(15, 80 - level*3 - p*5);
    return;
  }
  if (wkey === "sword") {
    if (weaponCools[wkey] > 0) { weaponCools[wkey]--; return; }
    fireSword();
    weaponCools[wkey] = Math.max(6, 35 - Math.floor(level/2) - p*3);
    return;
  }
  if (wkey === "chakram") {
    if (weaponCools[wkey] > 0) { weaponCools[wkey]--; return; }
    fireChakram();
    weaponCools[wkey] = Math.max(15, 60 - level*2 - p*5);
    return;
  }
  if (wkey === "rapid") {
    if (rapidCooldown > 0) { rapidCooldown--; return; }
    if (rapidTimer < RAPID_ACTIVE_TIME + p*30) {
      fireRapid(); rapidTimer++;
      if (rapidTimer >= RAPID_ACTIVE_TIME + p*30) {
        rapidCooldown = Math.max(30, RAPID_COOLDOWN_TIME - p*15);
      }
      return;
    }
    rapidTimer = 0;
    return;
  }
  if (weaponCools[wkey] > 0) { weaponCools[wkey]--; return; }

  const cdr = p * 0.5;
  if (wkey === "normal") { fireNormal(); weaponCools[wkey] = Math.max(1, 10 - Math.floor(level/2) - cdr); }
  else if (wkey === "spiral") { fireSpiral(); weaponCools[wkey] = Math.max(2, 13 - Math.floor(level/2) - cdr); }
  else if (wkey === "knife") { fireKnife(); weaponCools[wkey] = Math.max(2, 12 - Math.floor(level/2) - cdr); }
  else if (wkey === "mochi") { weaponCools[wkey] = Math.max(8, 55 - level*2 - cdr); fireMochi(); }
  else if (wkey === "auto") { if (fireAuto()) weaponCools[wkey] = Math.max(2, 14 - Math.floor(level*1.5) - cdr); }
  else if (wkey === "spray") { fireSpray(); weaponCools[wkey] = Math.max(1, 8 - Math.floor(level/2) - cdr); }
  else if (wkey === "boomerang") { fireBoomerang(); weaponCools[wkey] = Math.max(10, 55 - level*2 - cdr); }
  else if (wkey === "blackhole") { fireBlackHole(); weaponCools[wkey] = Math.max(30, 100 - level*3 - cdr*2); }
  else if (wkey === "freeze") { fireFreeze(); weaponCools[wkey] = Math.max(3, 16 - Math.floor(level/2) - cdr); }
  else if (wkey === "shotgun") { fireShotgun(); weaponCools[wkey] = Math.max(3, 22 - Math.floor(level/2) - cdr); }
  else if (wkey === "laser") { fireLaser(); weaponCools[wkey] = Math.max(2, 12 - Math.floor(level/3) - cdr); }
  else if (wkey === "missile") { fireMissile(); weaponCools[wkey] = Math.max(3, 20 - Math.floor(level/2) - cdr); }
  else if (wkey === "flame") { fireFlame(); weaponCools[wkey] = 1; }
  else if (wkey === "railgun") { fireRailgun(); weaponCools[wkey] = Math.max(10, 55 - level*2 - cdr*2); }
  else if (wkey === "cluster") { fireCluster(); weaponCools[wkey] = Math.max(8, 45 - level*2 - cdr); }
  else if (wkey === "vampire") { fireVampire(); weaponCools[wkey] = Math.max(2, 15 - Math.floor(level/2) - cdr); }
  else if (wkey === "gravity") { fireGravity(); weaponCools[wkey] = Math.max(20, 80 - level*3 - cdr*2); }
  else if (wkey === "iceshard") { fireIceShard(); weaponCools[wkey] = Math.max(3, 16 - Math.floor(level/2) - cdr); }
  else if (wkey === "poison") { firePoison(); weaponCools[wkey] = Math.max(4, 22 - Math.floor(level/2) - cdr); }
  else if (wkey === "holybeam") { fireHolyBeam(); weaponCools[wkey] = Math.max(15, 70 - level*3 - cdr*2); }
  else if (wkey === "bow") { fireBow(); weaponCools[wkey] = Math.max(2, 14 - Math.floor(level/2) - cdr); }
  else if (wkey === "bubble") { fireBubble(); weaponCools[wkey] = Math.max(8, 40 - level*2 - cdr); }
  else if (wkey === "thunder") { fireThunder(); weaponCools[wkey] = Math.max(10, 50 - level*2 - cdr); }
  else if (wkey === "spike") { fireSpike(); weaponCools[wkey] = Math.max(8, 40 - level*2 - cdr); }
  else if (wkey === "nova") { fireNova(); weaponCools[wkey] = Math.max(12, 60 - level*2 - cdr*2); }
}

function shoot() {
  if (!selectedWeapon && activeWeapons.length === 0) return;
  for (const wkey of activeWeapons) {
    if (!weaponCools[wkey]) weaponCools[wkey] = 0;
    fireWeapon(wkey);
  }
  if (activeWeapons.includes("math") || selectedWeapon === "math") {
    mathCooldown = Math.max(0, mathCooldown - 1);
  }
  if (activeWeapons.includes("orbit") || selectedWeapon === "orbit") updateOrbit();
  if (activeWeapons.includes("lightning") || selectedWeapon === "lightning") updateLightning();
}

function damagePlayer(amount, inv) {
  if (gameOver || player.invincible > 0) return;
  player.hp -= amount;
  player.invincible = inv;
  combo = 0; comboTimer = 0;
  shake(50); flash("#ff0044", 12); chroma(15); hitStopAdd(8);
  burst(player.x, player.y, 70, "#ff0044");
  burst(player.x, player.y, 35, "#ffffff");
  if (player.hp <= 0) {
    player.hp = 0;
    gameOver = true;
    shake(120); flash("#ffffff", 25);
  }
}
function knockback(enemy, x, y, strength) {
  const dx = enemy.x - x, dy = enemy.y - y;
  const d = Math.hypot(dx, dy) || 1;
  enemy.vx = dx/d * strength;
  enemy.vy = dy/d * strength;
  enemy.flying = true;
}

function updatePlayer() {
  if (player.dashTimer > 0) {
    player.x += player.dashVx;
    player.y += player.dashVy;
    player.dashTimer--;
    if (time % 2 === 0) burst(player.x, player.y, 6, "#00ffcc");
    afterImages.push({ x: player.x, y: player.y, r: player.drawR, life: 15, maxLife: 15 });
  } else {
    const sp = 5;
    if (keys.arrowleft || keys.a) player.x -= sp;
    if (keys.arrowright || keys.d) player.x += sp;
    if (keys.arrowup || keys.w) player.y -= sp;
    if (keys.arrowdown || keys.s) player.y += sp;
  }
  if (player.dashCooldown > 0) player.dashCooldown--;
  player.x = Math.max(player.hitR, Math.min(W-player.hitR, player.x));
  player.y = Math.max(player.hitR, Math.min(H-player.hitR, player.y));
  for (let i = afterImages.length-1; i >= 0; i--) {
    afterImages[i].life--;
    if (afterImages[i].life <= 0) afterImages.splice(i,1);
  }
}

function updateBullets() {
  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    if (!b) { bullets.splice(i,1); continue; }
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.trail && Math.random() < 0.35) {
      particles.push({
        x: b.x + (Math.random()-.5)*4, y: b.y + (Math.random()-.5)*4,
        vx: 0, vy: 0, life: 6,
        color: b.hue ? `hsl(${b.hue}, 100%, 70%)` : "#ffffff", size: 2
      });
    }
    if (b.type === "spiral" && b.homing > 0) {
      let nearest = null, bd = Infinity;
      for (const e of enemies) {
        const d = Math.hypot(e.x-b.x, e.y-b.y);
        if (d < bd) { nearest = e; bd = d; }
      }
      if (nearest) {
        const ta = Math.atan2(nearest.y-b.y, nearest.x-b.x);
        const ca = Math.atan2(b.vy, b.vx);
        let da = ta - ca;
        while (da > Math.PI) da -= TAU;
        while (da < -Math.PI) da += TAU;
        const na = ca + da * b.homing;
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(na) * sp;
        b.vy = Math.sin(na) * sp;
      }
    }
    if (b.type === "spiral") {
      b.fuse--;
      if (b.fuse <= 0) {
        const r = b.blastRadius || (65 + level*8);
        shockwaves.push({ x:b.x, y:b.y, radius:8, maxRadius:r, life:20, color:"204,102,255" });
        shockwaves.push({ x:b.x, y:b.y, radius:8, maxRadius:r*0.7, life:15, color:"255,255,255" });
        burst(b.x, b.y, 70, "#cc66ff");
        burst(b.x, b.y, 35, "#ffffff");
        burst(b.x, b.y, 20, "#ff00ff");
        shake(20); flash("#cc66ff", 5); chroma(5);
        for (let j = enemies.length-1; j >= 0; j--) {
          const e = enemies[j];
          if (!e) continue;
          if (Math.hypot(e.x-b.x, e.y-b.y) < r + e.r) {
            e.hp -= 3 + pw("spiral");
            showDamage(e.x, e.y, 3 + pw("spiral"), "#cc66ff");
            if (e.hp <= 0) killEnemy(j);
          }
        }
        bullets.splice(i,1); continue;
      }
    }
    if (b.type === "boomerang") {
      b.spin += .35;
      if (!b.returning) {
        if (b.x < 0 || b.x > W || b.y < 0 || b.y > H || b.life < 250) {
          b.returning = true; b.vx *= -1; b.vy *= -1;
        }
      } else {
        const dx = player.x-b.x, dy = player.y-b.y;
        const d = Math.hypot(dx,dy) || 1;
        b.vx += dx/d * .35; b.vy += dy/d * .35;
        const s = Math.hypot(b.vx, b.vy) || 1;
        b.vx = b.vx/s * 8; b.vy = b.vy/s * 8;
        if (d < 22) { bullets.splice(i,1); continue; }
      }
    }
    if (b.type === "blackhole") {
      updateBlackHole(b);
      if (b.field <= 0) { bullets.splice(i,1); continue; }
    }
    if (b.type === "shotgun") {
      b.traveled += Math.hypot(b.vx, b.vy);
      if (b.traveled >= b.maxRange) { b.damage *= 0.5; b.maxRange = 999; }
    }
    if (b.type === "missile") {
      if (!b.target || b.target.hp <= 0 || !enemies.includes(b.target)) {
        let nearest = null, nd = Infinity;
        for (const e of enemies) {
          const d = Math.hypot(e.x-b.x, e.y-b.y);
          if (d < 300 && d < nd) { nearest = e; nd = d; }
        }
        b.target = nearest;
      }
      if (b.target) {
        const ta = Math.atan2(b.target.y-b.y, b.target.x-b.x);
        const ca = Math.atan2(b.vy, b.vx);
        let da = ta - ca;
        while (da > Math.PI) da -= TAU;
        while (da < -Math.PI) da += TAU;
        const na = ca + da * 0.15;
        b.vx = Math.cos(na) * b.speed;
        b.vy = Math.sin(na) * b.speed;
      }
    }
    if (b.type === "cluster") {
      b.clusterFuse--;
      if (b.clusterFuse <= 0) {
        const n = b.childCount || 6;
        for (let k = 0; k < n; k++) {
          const a = k / n * TAU;
          bullets.push({
            x: b.x, y: b.y, vx: Math.cos(a)*8, vy: Math.sin(a)*8,
            size: 5, damage: 1.5, type: "cluster-child", life: 200, trail: true
          });
        }
        burst(b.x, b.y, 40, "#ccff33");
        burst(b.x, b.y, 20, "#ffffff");
        shake(15); flash("#ccff33", 4); chroma(6);
        bullets.splice(i,1); continue;
      }
    }
    if (b.type === "flame") b.size *= 0.96;
    if (b.type === "chakram" && b.centerOnPlayer) {
      b.angle += b.angleSpeed;
      b.x = player.x + Math.cos(b.angle) * b.radius;
      b.y = player.y + Math.sin(b.angle) * b.radius;
    }
    if (b.type === "gravity") {
      if (b.travel > 0) { b.travel--; }
      else {
        b.field--;
        for (const e of enemies) {
          if (e.type === "boss") continue;
          const dx = b.x - e.x, dy = b.y - e.y;
          const d = Math.hypot(dx, dy) || 1;
          if (d < b.pullRadius) {
            e.x += dx/d * b.pullForce;
            e.y += dy/d * b.pullForce;
          }
          if (d < 30 + e.r) {
            e.hp -= b.damage;
            if (Math.random() < 0.1) showDamage(e.x, e.y, b.damage, "#8844ff");
          }
        }
        if (b.field <= 0) { bullets.splice(i,1); continue; }
      }
    }
    if (b.type === "holybeam") {
      if (b.delay > 0) b.delay--;
      else {
        for (let j = enemies.length-1; j >= 0; j--) {
          const e = enemies[j];
          if (!e) continue;
          if (Math.hypot(e.x - b.x, e.y - b.y) < b.size + e.r) {
            e.hp -= b.damage;
            showDamage(e.x, e.y, b.damage, "#ffeeaa");
            if (e.hp <= 0) killEnemy(j);
          }
        }
      }
    }
    if (b.type === "spike") {
      if (b.delay > 0) b.delay--;
      else {
        for (let j = enemies.length-1; j >= 0; j--) {
          const e = enemies[j];
          if (!e) continue;
          if (Math.hypot(e.x - b.x, e.y - b.y) < b.size + e.r) {
            e.hp -= b.damage;
            showDamage(e.x, e.y, b.damage, "#aabbbb");
            if (e.hp <= 0) killEnemy(j);
          }
        }
      }
    }
    if (b.life <= 0 || b.x < -100 || b.x > W+100 || b.y < -100 || b.y > H+100) {
      bullets.splice(i,1);
    }
  }
}

function updateEnemies() {
  for (let i = enemies.length-1; i >= 0; i--) {
    const e = enemies[i];
    if (!e) { enemies.splice(i,1); continue; }
    if (e.chakramCD > 0) e.chakramCD--;
    e.slowTimer = Math.max(0, (e.slowTimer || 0) - 1);
    const slow = e.slowTimer > 0 ? (e.slowFactor || .4) : 1;
    const frozenMult = e.slowTimer > 0 ? 2 : 1;
    if (e.poisonTime > 0) {
      e.poisonTime--;
      e.hp -= e.poisonDPS || 0;
      if (time % 30 === 0) showDamage(e.x, e.y, (e.poisonDPS || 0) * 30, "#88ff44");
      if (e.hp <= 0) { killEnemy(i); continue; }
    }
    if (e.floatTime > 0) {
      e.floatTime--;
      e.y -= 1.5;
      if (e.floatTime === 0) {
        e.flying = true;
        e.vx = (Math.random()-.5)*3;
        e.vy = -3;
      }
      continue;
    }
    if (e.flying) {
      e.x += e.vx; e.y += e.vy;
      e.vx *= .94; e.vy *= .94;
      if (Math.hypot(e.vx, e.vy) < 1) e.flying = false;
    } else {
      if (e.type === "dasher") {
        e.dashTimer--;
        if (e.dashing) {
          e.x += e.dashVx; e.y += e.dashVy;
          e.dashVx *= 0.97; e.dashVy *= 0.97;
          if (Math.abs(e.dashVx) < 0.5 && Math.abs(e.dashVy) < 0.5) {
            e.dashing = false;
            e.dashTimer = 60 + Math.random()*60;
          }
        } else {
          e.y += e.speed * 0.5 * slow;
          if (e.dashTimer <= 0) {
            const a = Math.atan2(player.y - e.y, player.x - e.x);
            e.dashVx = Math.cos(a) * e.speed * 2.5;
            e.dashVy = Math.sin(a) * e.speed * 2.5;
            e.dashing = true;
            burst(e.x, e.y, 10, "#ffaa00");
          }
        }
      } else {
        e.y += e.speed * slow;
      }
      if (e.wave !== undefined) {
        e.wave += .04;
        e.x += Math.sin(e.wave) * e.wavePower;
      }
      if (e.type === "boss") {
        e.bossPhase += 0.02;
        if (e.y > 120) e.y -= e.speed * .5;
        e.x = W/2 + Math.sin(e.bossPhase) * 130;
      }
    }
    if (Math.hypot(player.x-e.x, player.y-e.y) < player.hitR + e.r) {
      damagePlayer(e.type === "heavy" ? 15 : e.type === "boss" ? 25 : e.type === "tank" ? 20 : 8, 55);
      if (e.type !== "boss") {
        burst(e.x, e.y, 35, "#ff3366");
        burst(e.x, e.y, 20, "#ffffff");
        enemies.splice(i,1);
        continue;
      }
    }
    let killed = false;
    for (let j = bullets.length-1; j >= 0; j--) {
      const b = bullets[j];
      if (!b) continue;
      if (b.type === "blackhole" || b.type === "gravity") continue;
      if (b.type === "mochi" && e.flying) continue;
      if (b.type === "chakram" && b.hitSet && b.hitSet.has(e)) continue;
      if (b.type === "boomerang" && b.hitSet && b.hitSet.has(e)) continue;
      if (b.type === "railgun" && b.hitSet && b.hitSet.has(e)) continue;
      const d = Math.hypot(e.x-b.x, e.y-b.y);
      if (d >= e.r + b.size) continue;
      let dmg = (b.damage || 1) * frozenMult;
      let consumed = false;
      shake(2);
      for (let k = 0; k < 8 * FX.particleMultiplier; k++) {
        const a = Math.random()*TAU, sp = 3 + Math.random()*5;
        particles.push({
          x: b.x, y: b.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
          life: 10 + Math.random()*6,
          color: k % 3 === 0 ? "#ffff00" : (k % 3 === 1 ? "#ffffff" : (b.hue ? `hsl(${b.hue}, 100%, 70%)` : "#ff00ff")),
          size: 2 + Math.random()*2
        });
      }
      if (Math.random() < 0.25) {
        shockwaves.push({ x:b.x, y:b.y, radius:5, maxRadius:22, life:8, color:"255,255,255" });
      }
      if (b.type === "boomerang") { b.hitSet.add(e); e.hp -= dmg; showDamage(e.x, e.y, dmg, "#7cff6b"); }
      else if (b.type === "mochi") {
        knockback(e, b.x, b.y, 8 + level*.5);
        e.hp -= dmg; showDamage(e.x, e.y, dmg, "#fff0c0");
        b.pierce--; burst(e.x, e.y, 15, "#fff0c0"); shake(8);
        if (b.pierce <= 0) consumed = true;
      }
      else if (b.type === "freeze" || b.type === "iceshard") {
        e.hp -= dmg;
        e.slowTimer = (b.slowDuration || 90 + level*5);
        e.slowFactor = Math.max(.12, .42 - level*.02);
        showDamage(e.x, e.y, dmg, "#a3e8ff");
        if (b.type === "freeze") consumed = true;
      }
      else if (b.type === "poison") {
        e.hp -= dmg; e.poisonTime = b.poisonTime; e.poisonDPS = b.poisonDPS;
        showDamage(e.x, e.y, dmg, "#88ff44"); consumed = true;
      }
      else if (b.type === "bubble") {
        e.floatTime = b.floatTime;
        showDamage(e.x, e.y, "BUBBLE!", "#aaddff"); consumed = true;
      }
      else if (b.type === "railgun") {
        if (!b.hitSet) b.hitSet = new Set();
        b.hitSet.add(e); e.hp -= dmg;
        showBigDamage(e.x, e.y, dmg, "#00eeff");
        shake(12); flash("#00eeff", 3); chroma(6); hitStopAdd(2);
      }
      else if (b.type === "vampire") {
        e.hp -= dmg; showDamage(e.x, e.y, dmg, "#cc0066");
        vampireHeal += dmg * (b.stealRatio || 0.3); consumed = true;
      }
      else if (b.type === "auto") {
        e.hp -= dmg; showDamage(e.x, e.y, dmg, "#99ff66");
        b.pierce--;
        if (b.pierce <= 0) consumed = true;
      }
      else if (b.type === "laser" || b.type === "bow") {
        e.hp -= dmg;
        showDamage(e.x, e.y, dmg, b.type === "laser" ? "#ff00ff" : "#c8a06a");
        if (b.type === "bow") {
          b.pierce--;
          if (b.pierce <= 0) consumed = true;
        }
      }
      else if (b.type === "chakram") {
        b.hitSet.add(e); e.hp -= dmg;
        showDamage(e.x, e.y, dmg, "#ffddaa");
      }
      else {
        e.hp -= dmg; showDamage(e.x, e.y, dmg, "#ffffff");
        if (b.pierce) {
          b.pierce--;
          if (b.pierce <= 0) consumed = true;
        } else consumed = true;
      }
      if (consumed) {
        const idx2 = bullets.indexOf(b);
        if (idx2 >= 0) bullets.splice(idx2, 1);
      }
      if (e.hp <= 0) { killEnemy(i); killed = true; break; }
    }
    if (killed) continue;
    if (!enemies[i]) continue;
    if (e.y > H+60 && e.type !== "boss") { enemies.splice(i,1); continue; }
    if (Math.random() < e.shootRate) fireEnemyBullet(e);
  }
}

/* 敵の弾幕（軽量化） */
function fireEnemyBullet(e) {
  const baseAngle = Math.atan2(player.y - e.y, player.x - e.x);
  const speedBase = 2 + difficulty * 0.5;
  if (e.type === "boss") {
    const pattern = Math.floor(e.bossPhase * 3) % 3;
    if (pattern === 0) {
      for (let k = 0; k < 9; k++) {   /* 12 → 9 */
        const a = baseAngle + (k - 4) * 0.20;
        const s = 3.5 + difficulty * 0.4;
        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 6, hue: 0 });
      }
    } else if (pattern === 1) {
      const offset = time * 0.1;
      for (let k = 0; k < 12; k++) {   /* 16 → 12 */
        const a = k / 12 * TAU + offset;
        const s = 3 + difficulty * 0.4;
        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 5, hue: 300 });
      }
    } else {
      for (let layer = 0; layer < 3; layer++) {
        const a = baseAngle + layer * 0.4 - 0.4;
        const s = 4 + difficulty * 0.5 + layer * 0.5;
        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 7, hue: 30 });
      }
    }
    return;
  }
  if (e.type === "heavy") {
    for (let k = 0; k < 3; k++) {   /* 5 → 3 */
      const a = baseAngle + (k - 1) * 0.22;
      const s = 3 + difficulty * 0.4;
      enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 6, hue: 30 });
    }
    return;
  }
  if (e.type === "tank") {
    const offset = time * 0.03;
    for (let k = 0; k < 6; k++) {   /* 8 → 6 */
      const a = k / 6 * TAU + offset;
      const s = 2.2 + difficulty * 0.3;
      enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 7, hue: 270 });
    }
    return;
  }
  if (e.type === "shooter") {
    e.burstCooldown = (e.burstCooldown || 0) + 1;
    if (e.burstCooldown % 5 === 0) {
      const offset = time * 0.05;
      for (let k = 0; k < 8; k++) {   /* 10 → 8 */
        const a = k / 8 * TAU + offset;
        const s = 2.5 + difficulty * 0.4;
        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 5, hue: 200 });
      }
    } else {
      for (let k = -1; k <= 1; k++) {
        const a = baseAngle + k * 0.22;
        const s = 3.5 + difficulty * 0.5;
        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 5, hue: 200 });
      }
    }
    return;
  }
  if (e.type === "splitter") {
    const offset = Math.random() * TAU;
    for (let k = 0; k < 4; k++) {   /* 6 → 4 */
      const a = k / 4 * TAU + offset;
      const s = 2.5 + difficulty * 0.3;
      enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 5, hue: 330 });
    }
    return;
  }
  /* normal：2-way → 1発 */
  const a = baseAngle;
  const s = speedBase + 0.5;
  enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 4, hue: 30 });
}

function updateEnemyBullets() {
  for (let i = enemyBullets.length-1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx; b.y += b.vy;
    if (Math.hypot(player.x-b.x, player.y-b.y) < player.hitR + b.r) {
      enemyBullets.splice(i,1);
      damagePlayer(1, 40);
      continue;
    }
    if (b.x < -200 || b.x > W+200 || b.y < -200 || b.y > H+200) enemyBullets.splice(i,1);
  }
}

function updatePowerups() {
  for (let i = powerups.length-1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.vy; p.bob += 0.1; p.life--;
    if (Math.hypot(player.x-p.x, player.y-p.y) < player.hitR + p.r) {
      collectPowerup(p);
      powerups.splice(i,1);
      continue;
    }
    if (p.life <= 0 || p.y > H+40) powerups.splice(i,1);
  }
}

function updateEffects() {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= .97; p.vy *= .97; p.life--;
    if (p.life <= 0) particles.splice(i,1);
  }
  for (let i = shockwaves.length-1; i >= 0; i--) {
    const s = shockwaves[i];
    s.radius += (s.maxRadius - s.radius) * .3;
    s.life--;
    if (s.life <= 0) shockwaves.splice(i,1);
  }
  for (let i = lightningBolts.length-1; i >= 0; i--) {
    lightningBolts[i].life--;
    if (lightningBolts[i].life <= 0) lightningBolts.splice(i,1);
  }
  if (mathFlash) { mathFlash.timer--; if (mathFlash.timer <= 0) mathFlash = null; }
  if (powerUpFlash) { powerUpFlash.timer--; if (powerUpFlash.timer <= 0) powerUpFlash = null; }
  for (let i = damageNumbers.length-1; i >= 0; i--) {
    const d = damageNumbers[i];
    d.y += d.vy; d.vy *= 0.96; d.life--;
    if (d.life <= 0) damageNumbers.splice(i,1);
  }
  if (zoomPulse > 1) zoomPulse = 1 + (zoomPulse - 1) * 0.9;
  if (zoomPulse < 1.005) zoomPulse = 1;
}

function update() {
  updateStars();
  const constantWobble = FX.constantShake + (bossActive ? 0.8 : 0) + (combo > 20 ? 0.4 : 0);
  shakeX = (Math.random()-.5) * (screenShake * 2 + constantWobble);
  shakeY = (Math.random()-.5) * (screenShake * 2 + constantWobble);
  if (screenShake > 0.3) screenShake *= 0.85;
  else screenShake = 0;
  if (flashScreen > 0) flashScreen--;
  if (chromaOffset > 0) chromaOffset *= 0.88;
  if (hitStop > 0) { hitStop--; return; }
  if (titleScreen || weaponMenu || gameOver) return;
  time++;
  rainbowHue = (rainbowHue + 3) % 360;
  difficulty = Math.min(3, 1 + time / 1500);
  bgTint = (Math.sin(time * 0.02) * 30 * FX.bgMultiplier + combo * 3 * FX.bgMultiplier) % 360;
  if (player.hp / player.maxHp < 0.3) dangerTint = Math.min(1, dangerTint + 0.05);
  else dangerTint = Math.max(0, dangerTint - 0.02);
  beatPulse = (Math.sin(time * 0.15) + 1) * 0.5;
  waveTimer++;
  if (waveTimer >= WAVE_DURATION) {
    waveTimer = 0;
    wave++;
    const bossWave = quickMode ? (wave % 2 === 0) : (wave % 3 === 0);
    if (bossWave && !bossActive) spawnBoss();
    else { showDamage(W/2, 200, `WAVE ${wave}`, "#00ffcc"); shake(15); flash("#00ffcc", 4); }
  }
  if (comboTimer > 0) { comboTimer--; if (comboTimer === 0) combo = 0; }
  if (player.invincible > 0) player.invincible--;
  if (vampireHeal > 0) {
    const heal = Math.min(vampireHeal, 0.5);
    player.hp = Math.min(player.maxHp, player.hp + heal);
    vampireHeal -= heal;
  }
  updatePlayer();

  const weaponCount = Math.max(1, activeWeapons.length);
  const weaponMultiplier = 1 + (weaponCount - 1) * 0.6;

  const spawnRate = Math.min(.25, (.006 + difficulty*.004 + (level-1)*0.003) * weaponMultiplier);
  if (Math.random() < spawnRate) spawnEnemy();
  if (level > 6 && Math.random() < (level - 6) * 0.003 * weaponMultiplier) spawnEnemy();
  if (level > 10 && Math.random() < (level - 10) * 0.004 * weaponMultiplier) {
    spawnEnemy(); spawnEnemy();
  }
  const minEnemies = Math.min(25, 4 + Math.floor(level * 0.6 * weaponMultiplier));
  if (enemies.length < minEnemies && Math.random() < 0.1) spawnEnemy();

  shoot();
  updateTurrets();
  updateMines();
  updateBullets();
  updateEnemies();
  updateEnemyBullets();
  updatePowerups();
  updateEffects();

  if (score > highScore) {
    highScore = score;
    try { localStorage.setItem("neonHighScore", String(highScore)); } catch {}
  }
}

function drawEnemies() {

    else if (e.type === "child") c = "#ff66bb";
    else if (e.type === "tank") c = "#8866ff";
    else if (e.type === "dasher") c = "#ff6600";
    else if (e.type === "shooter") c = "#00ddff";
    if (e.type === "boss") {
      const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 3);
      grad.addColorStop(0, "rgba(255, 0, 68, .5)");
      grad.addColorStop(1, "rgba(255, 0, 68, 0)");

      ctx.fillRect(e.x - e.r*3, e.y - e.r*3, e.r*6, e.r*6);

    ctx.shadowBlur = e.type === "boss" ? 50 : 25;

    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,.4)";
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r*0.4, 0, TAU); ctx.fill();
    if (e.type === "tank") {
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
      ctx.strokeRect(e.x-e.r, e.y-e.r, e.r*2, e.r*2);
    }
    if (e.type === "dasher" && e.dashing) {
      ctx.strokeStyle = "#ffff00"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x - e.dashVx*3, e.y - e.dashVy*3);

    }
    if (e.type === "shooter") {
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 4, 0, TAU); ctx.stroke();

    if (e.type === "boss") {

      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 14, 0, TAU); ctx.stroke();
    }
    if (e.slowTimer > 0) {
      ctx.strokeStyle = "#a3e8ff"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 4, 0, TAU); ctx.stroke();
    }
    if (e.poisonTime > 0) {
      ctx.strokeStyle = "#88ff44"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 8, 0, TAU); ctx.stroke();
    }

      ctx.strokeStyle = "#aaddff"; ctx.lineWidth = 3;
      ctx.fillStyle = "rgba(170, 221, 255, .4)";
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 12, 0, TAU); ctx.fill();
      ctx.stroke();

    ctx.restore();
    if (e.type === "heavy" || e.type === "boss" || e.type === "tank") {
      const barW = e.type === "boss" ? 240 : (e.type === "tank" ? 60 : 50);

    if (selected) {
      ctx.fillStyle = m.color;
      ctx.font = "bold 10px Arial";
      ctx.fillText("▶", x + w/2, y + 56);
    }
  }

  /* 合成モードボタン（常時表示） */
  {
    const y = 320;
    const btnW = 360;
    const btnH = 55;
    const x = (W - btnW) / 2;
    const hue = (Date.now() * 0.15) % 360;
    ctx.shadowBlur = 30;
    ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
    ctx.strokeStyle = `hsl(${hue}, 100%, 60%)`;
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, btnW, btnH);
    ctx.fillStyle = `hsla(${hue}, 100%, 60%, .15)`;
    ctx.fillRect(x, y, btnW, btnH);
    ctx.fillStyle = `hsl(${hue}, 100%, 70%)`;
    ctx.font = "bold 20px Arial";
    ctx.fillText("⚡ FUSION MODE ⚡", W/2, y + 28);
    ctx.fillStyle = "rgba(255,255,255,.8)";
    ctx.font = "10px Arial";
    ctx.fillText("2つ以上の武器を同時装備！", W/2, y + 46);
  }

  /* クイックモードボタン */
  {
    const y = 390;
    const btnW = 360;
    const btnH = 40;
    const x = (W - btnW) / 2;
    ctx.shadowBlur = 20;
    ctx.shadowColor = "#ffcc00";
    ctx.strokeStyle = "#ffcc00";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, btnW, btnH);
    ctx.fillStyle = "rgba(255, 204, 0, .12)";
    ctx.fillRect(x, y, btnW, btnH);
    ctx.fillStyle = "#ffcc00";
    ctx.font = "bold 15px Arial";
    ctx.fillText("⚡ QUICK MODE (WAVE 2,4でボス)", W/2, y + 26);
  }

  ctx.shadowBlur = 0;
  if (Math.floor(Date.now()/500) % 2 === 0) {
    ctx.fillStyle = "#fff";
    ctx.font = "16px Arial";
    ctx.fillText("タップで通常プレイ開始", W/2, 470);
    ctx.fillStyle = "#aaa";
    ctx.font = "11px Arial";
    ctx.fillText("(1:CHAOS / 2:NORMAL / 3:SAFE)", W/2, 495);
  }
  ctx.fillStyle = "#ffcc00";
  ctx.font = "12px Arial";
  ctx.fillText(`ボスを ${BOSS_KILL_TARGET} 回倒すとゲームクリア！`, W/2, 530);
  ctx.fillStyle = "#88ff88";
  ctx.font = "11px Arial";
  ctx.fillText("(Q:クイックモード / F:合成モード)", W/2, 550);
  ctx.textAlign = "left";
}
function drawWeaponMenu() {
  ctx.fillStyle = "rgba(0,0,8,.92)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = fusionMode ? "#ff00ff" : "#00ffcc";
  ctx.font = "bold 24px Arial";
  ctx.shadowBlur = 20; ctx.shadowColor = fusionMode ? "#ff00ff" : "#00ffcc";
  ctx.fillText(fusionMode ? "⚡ FUSION MODE ⚡" : "SELECT WEAPON", W/2, 36);

  ctx.fillStyle = "#fff";
  ctx.font = "12px Arial";
  ctx.shadowBlur = 0;
  if (fusionMode) {
    ctx.fillText(`選択中: ${fusionSelected.length}個 (2個以上で開始)`, W/2, 58);
  } else {
    ctx.fillText("タップ / スクロール / 数字・A〜Z", W/2, 58);
  }

  ctx.save();
  ctx.beginPath(); ctx.rect(0, MENU_TOP, W, MENU_VIEW_HEIGHT); ctx.clip();
  for (let i = 0; i < WEAPON_ORDER.length; i++) {
    const key = WEAPON_ORDER[i];
    const w = weapons[key];
    const y = MENU_TOP + i*(MENU_ITEM_HEIGHT+MENU_GAP) - menuScrollY;
    if (y + MENU_ITEM_HEIGHT < MENU_TOP || y > H) continue;

    const isFusionSelected = fusionMode && fusionSelected.includes(key);

    let borderColor = w.color;
    let borderW = 2;
    if (isFusionSelected) { borderColor = "#ff00ff"; borderW = 4; }

    ctx.shadowBlur = isFusionSelected ? 30 : 20;
    ctx.shadowColor = borderColor;
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = borderW;
    ctx.strokeRect(MENU_MARGIN, y, MENU_WIDTH, MENU_ITEM_HEIGHT);

    if (isFusionSelected) {
      ctx.fillStyle = "rgba(255, 0, 255, .15)";
      ctx.fillRect(MENU_MARGIN, y, MENU_WIDTH, MENU_ITEM_HEIGHT);
    }
    ctx.shadowBlur = 0;

    ctx.textAlign = "left";
    ctx.fillStyle = w.color;
    ctx.font = "bold 20px Arial";
    let label;
    if (i < 9) label = String(i+1);
    else if (i === 9) label = "0";
    else label = String.fromCharCode(65 + i - 10);
    ctx.fillText(label, MENU_MARGIN + 16, y + 40);

    ctx.fillStyle = "#fff";
    ctx.font = "bold 18px Arial";
    ctx.fillText(w.name, MENU_MARGIN + 56, y + 40);

    if (isFusionSelected) {
      ctx.save();
      ctx.shadowBlur = 20; ctx.shadowColor = "#ff00ff";
      ctx.fillStyle = "#ff00ff";
      ctx.font = "bold 28px Arial";
      ctx.textAlign = "right";
      ctx.fillText("✓", MENU_MARGIN + MENU_WIDTH - 14, y + 42);
      ctx.restore();
      ctx.textAlign = "left";
    }

    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.font = "13px Arial";
    ctx.fillText(w.description, MENU_MARGIN + 16, y + 74);
  }
  ctx.restore();

  if (fusionMode && fusionSelected.length >= 2) {
    const btnY = H - 50;
    const btnW = 200;
    const btnX = (W - btnW) / 2;
    const pulse = 0.5 + Math.sin(Date.now()*0.01) * 0.5;
    ctx.shadowBlur = 30; ctx.shadowColor = "#00ffcc";
    ctx.strokeStyle = "#00ffcc";
    ctx.lineWidth = 3;
    ctx.strokeRect(btnX, btnY - 25, btnW, 40);
    ctx.fillStyle = `rgba(0, 255, 204, ${0.2 + pulse * 0.2})`;
    ctx.fillRect(btnX, btnY - 25, btnW, 40);
    ctx.fillStyle = "#00ffcc";
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";
    ctx.fillText("START ▶", W/2, btnY);
    ctx.textAlign = "left";
  } else if (fusionMode) {
    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.font = "12px Arial";
    ctx.textAlign = "center";
    ctx.fillText("2個以上選択してください", W/2, H - 30);
    ctx.textAlign = "left";
  }
  ctx.textAlign = "left";
}
function drawMathUI() {
  if (!mathProblem) return;
  if (mathFlash) {
    ctx.fillStyle = mathFlash.correct ? "rgba(80,255,120,.25)" : "rgba(255,60,60,.25)";
    ctx.fillRect(30, 190, W-60, 110);
  }
  ctx.textAlign = "center";
  ctx.fillStyle = "#fff";
  ctx.font = "bold 22px Arial";
  ctx.shadowBlur = 15; ctx.shadowColor = "#66ccff";
  ctx.fillText(`${mathProblem.text} = ?`, W/2, 220);
  for (let i = 0; i < 3; i++) {
    const x = 45 + i*135;
    ctx.strokeStyle = "#66ccff"; ctx.lineWidth = 2;
    ctx.shadowBlur = 10; ctx.shadowColor = "#66ccff";
    ctx.strokeRect(x, 235, 120, 50);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 20px Arial";
    ctx.fillText(String(mathProblem.choices[i]), x + 60, 267);
  }
  ctx.shadowBlur = 0;
  ctx.textAlign = "left";
}
function drawGameUI() {
  ctx.fillStyle = "#222"; ctx.fillRect(20, 20, 200, 16);
  ctx.fillStyle = player.hp <= 15 ? "#ff3344" : "#00ff66";
  ctx.shadowBlur = 15; ctx.shadowColor = player.hp <= 15 ? "#ff3344" : "#00ff66";
  ctx.fillRect(20, 20, 200 * player.hp/player.maxHp, 16);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "#fff"; ctx.strokeRect(20, 20, 200, 16);

  ctx.fillStyle = "#fff"; ctx.font = "18px Arial";
  ctx.shadowBlur = 10; ctx.shadowColor = "#fff";
  ctx.fillText(`SCORE : ${score}`, 20, 60);
  ctx.fillText(`HIGH : ${highScore}`, 20, 85);
  ctx.fillText(`LEVEL : ${level}`, 20, 110);
  ctx.shadowBlur = 0;

  if (activeWeapons.length > 1) {
    ctx.fillStyle = "#ff00ff";
    ctx.font = "bold 14px Arial";
    ctx.shadowBlur = 15; ctx.shadowColor = "#ff00ff";
    ctx.fillText(`⚡ FUSION x${activeWeapons.length} ⚡`, 20, 145);
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = weapons[selectedWeapon].color;
    ctx.font = "14px Arial";
    ctx.shadowBlur = 10; ctx.shadowColor = weapons[selectedWeapon].color;
    ctx.fillText(`WEAPON : ${weapons[selectedWeapon].name}`, 20, 145);
    ctx.shadowBlur = 0;
  }

  const wp = weaponPower[selectedWeapon] || 0;
  if (wp > 0 && activeWeapons.length === 1) {
    ctx.fillStyle = weapons[selectedWeapon].color;
    ctx.font = "bold 13px Arial";
    ctx.fillText(`★ POWER Lv${wp}`, 20, 162);
  }

  ctx.fillStyle = "#333"; ctx.fillRect(20, 170, 200, 10);
  ctx.fillStyle = "#00ccff";
  ctx.shadowBlur = 10; ctx.shadowColor = "#00ccff";
  ctx.fillRect(20, 170, 200 * exp/nextExp, 10);
  ctx.shadowBlur = 0;

  ctx.textAlign = "right";
  ctx.fillStyle = "#00ffcc"; ctx.font = "bold 20px Arial";
  ctx.shadowBlur = 15; ctx.shadowColor = "#00ffcc";
  ctx.fillText(`WAVE ${wave}`, W - 20, 42);
  if (bossActive) {
    ctx.fillStyle = "#ff0044"; ctx.font = "bold 18px Arial";
    ctx.shadowBlur = 20; ctx.shadowColor = "#ff0044";
    ctx.fillText("BOSS!", W - 20, 68);
  }
  ctx.fillStyle = "#ffcc00"; ctx.font = "bold 14px Arial";
  ctx.shadowBlur = 10; ctx.shadowColor = "#ffcc00";
  ctx.fillText(`BOSS: ${bossKillCount}/${BOSS_KILL_TARGET}`, W - 20, 90);
  if (quickMode) {
    ctx.fillStyle = "#ffcc00"; ctx.font = "bold 11px Arial";
    ctx.shadowBlur = 8; ctx.shadowColor = "#ffcc00";
    ctx.fillText("QUICK", W - 20, 108);
  }
  ctx.shadowBlur = 0;
  ctx.textAlign = "left";

  if (combo > 1) {
    const alpha = Math.min(1, comboTimer/60);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = "right";
    ctx.fillStyle = "#ffcc00";
    ctx.shadowBlur = 30; ctx.shadowColor = "#ffcc00";
    const size = 32 + Math.min(30, combo * 0.4);
    ctx.font = `bold ${size}px Arial`;
    ctx.fillText(`${combo} COMBO`, W - 20, 135);
    ctx.font = "bold 20px Arial";
    ctx.fillStyle = "#fff";
    ctx.fillText(`x${comboMultiplier().toFixed(1)}`, W - 20, 163);
    ctx.restore();
    ctx.textAlign = "left";
  }

  if (player.dashCooldown > 0) {
    ctx.fillStyle = "#333"; ctx.fillRect(20, 200, 100, 6);
    ctx.fillStyle = "#ff3366";
    ctx.shadowBlur = 10; ctx.shadowColor = "#ff3366";
    ctx.fillRect(20, 200, 100 * (1 - player.dashCooldown/45), 6);
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = "#00ffcc"; ctx.font = "12px Arial";
    ctx.shadowBlur = 8; ctx.shadowColor = "#00ffcc";
    ctx.fillText("[SPACE] DASH READY", 20, 208);
    ctx.shadowBlur = 0;
  }

  if (selectedWeapon === "rapid") {
    ctx.fillStyle = "#333"; ctx.fillRect(20, 190, 200, 8);
    const p = rapidCooldown > 0 ? rapidCooldown/RAPID_COOLDOWN_TIME : rapidTimer/RAPID_ACTIVE_TIME;
    ctx.fillStyle = rapidCooldown > 0 ? "#ff3366" : "#ffcc00";
    ctx.fillRect(20, 190, 200*p, 8);
  }
  if (selectedWeapon === "math") drawMathUI();

  ctx.fillStyle = "rgba(255,255,255,.6)";
  ctx.font = "12px Arial";
  ctx.fillText("MOVE: TOUCH / WASD / ARROW KEYS", 20, H - 18);
}
function drawGameOver() {
  ctx.fillStyle = "rgba(0,0,0,.85)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";

  if (gameClear) {
    const t = Date.now() * 0.005;
    const hue = (t * 30) % 360;
    ctx.shadowBlur = 40;
    ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
    ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
    ctx.font = "bold 54px Arial";
    ctx.fillText("GAME CLEAR!", W/2, H/2 - 130);

    ctx.shadowBlur = 30; ctx.shadowColor = "#ffcc00";
    ctx.fillStyle = "#ffcc00";
    ctx.font = "bold 30px Arial";
    if (fusionMode && activeWeapons.length > 1) {
      ctx.fillText("⚡ FUSION CLEAR ⚡", W/2, H/2 - 70);
    } else {
      ctx.fillText("WEAPON CLEAR", W/2, H/2 - 70);
    }

    ctx.shadowBlur = 15; ctx.shadowColor = "#fff";
    ctx.fillStyle = "#fff";
    ctx.font = "24px Arial";
    ctx.fillText(`SCORE : ${score}`, W/2, H/2 - 15);
    ctx.font = "20px Arial";
    ctx.fillText(`LEVEL : ${level}`, W/2, H/2 + 20);
    ctx.fillText(`WAVE : ${wave}`, W/2, H/2 + 50);
    ctx.fillStyle = "#ffcc00";
    ctx.shadowColor = "#ffcc00";
    ctx.fillText(`MAX COMBO : ${maxCombo}`, W/2, H/2 + 80);

    if (Math.floor(Date.now()/500) % 2 === 0) {
      ctx.shadowBlur = 20; ctx.shadowColor = "#00ffcc";
      ctx.fillStyle = "#00ffcc";
      ctx.font = "bold 16px Arial";
      ctx.fillText("TAP OR PRESS ENTER TO RESTART", W/2, H/2 + 140);
    }
  } else {
    ctx.fillStyle = "#ff3366";
    ctx.font = "bold 50px Arial";
    ctx.shadowBlur = 30; ctx.shadowColor = "#ff3366";
    ctx.fillText("GAME OVER", W/2, H/2 - 100);
    ctx.shadowBlur = 15; ctx.shadowColor = "#fff";
    ctx.fillStyle = "#fff";
    ctx.font = "30px Arial";
    ctx.fillText(`SCORE : ${score}`, W/2, H/2 - 40);
    ctx.font = "22px Arial";
    ctx.fillText(`LEVEL : ${level}`, W/2, H/2);
    ctx.fillText(`WAVE : ${wave}`, W/2, H/2 + 35);
    ctx.fillStyle = "#ffcc00";
    ctx.shadowColor = "#ffcc00";
    ctx.fillText(`MAX COMBO : ${maxCombo}`, W/2, H/2 + 70);
    ctx.fillStyle = "#ff0044";
    ctx.shadowColor = "#ff0044";
    ctx.font = "bold 16px Arial";
    ctx.fillText(`BOSS: ${bossKillCount} / ${BOSS_KILL_TARGET}`, W/2, H/2 + 105);
    ctx.fillStyle = "#00ffcc";
    ctx.shadowColor = "#00ffcc";
    ctx.font = "18px Arial";
    ctx.fillText("TAP OR PRESS ENTER TO RESTART", W/2, H/2 + 150);
  }
  ctx.textAlign = "left";
}

let comboMilestones = {};
function addCombo() {
  combo++;
  comboTimer = 120;
  if (combo > maxCombo) maxCombo = combo;
  const milestones = [5, 10, 15, 20, 30, 40, 50, 75, 100];
  const colors = ["#00ffcc", "#99ff66", "#ffcc00", "#ff8844",
                  "#ff3366", "#ff00ff", "#00ffff", "#ffffff", "#ff00ff"];
  for (let i = 0; i < milestones.length; i++) {
    const m = milestones[i];
    if (combo === m && !comboMilestones[m]) {
      comboMilestones[m] = true;
      const col = colors[i];
      shake(25); flash(col, 8); chroma(12); hitStopAdd(4);
      burst(player.x, player.y, 60, col);
      burst(player.x, player.y, 30, "#ffffff");
    }
  }
}
function comboMultiplier() { return 1 + Math.floor(combo/5) * 0.5; }

function draw() {
  drawBackground();
  if (titleScreen) { drawTitle(); return; }

  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(zoomPulse, zoomPulse);
  ctx.translate(-W/2, -H/2);
  ctx.translate(shakeX, shakeY);

  drawEffects();

  if (!weaponMenu) {
    drawPlayer();
    drawKnifeAim();
    drawOrbit();
    drawTurrets();
    drawMines();
    for (const b of bullets) drawBullet(b);
    drawEnemies();
    drawPowerups();

    ctx.save();
    for (const b of enemyBullets) {
      const hue = b.hue || 30;
      const col = `hsl(${hue}, 100%, 65%)`;
      ctx.shadowBlur = 12;
      ctx.shadowColor = col;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(255,255,255,.85)";
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, TAU); ctx.fill();
    }
    ctx.restore();

    drawLightning();
    drawDamageNumbers();
    drawGameUI();

    if (powerUpFlash) {
      const alpha = powerUpFlash.timer / 150;
      ctx.save();
      ctx.globalAlpha = alpha * 0.6 * FX.flashMultiplier;
      ctx.fillStyle = weapons[powerUpFlash.weapon].color;
      ctx.fillRect(-W*2, -H*2, W*5, H*5);
      ctx.restore();

      ctx.save();
      ctx.textAlign = "center";
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#fff";
      ctx.shadowBlur = 40; ctx.shadowColor = weapons[powerUpFlash.weapon].color;
      const scale = 1 + (1 - alpha) * 0.8;
      ctx.font = `bold ${50 * scale}px Arial`;
      ctx.fillText("POWER UP!", W/2, H/2);
      ctx.font = `bold ${32 * scale}px Arial`;
      ctx.fillStyle = weapons[powerUpFlash.weapon].color;
      ctx.fillText(`Lv${powerUpFlash.lv}`, W/2, H/2 + 50);
      ctx.restore();
      ctx.textAlign = "left";
    }
  }

  if (weaponMenu) drawWeaponMenu();
  if (gameOver) drawGameOver();
  ctx.restore();

  if (flashScreen > 0 && FX.flashMultiplier > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, flashScreen / 10) * 0.7 * FX.flashMultiplier;
    ctx.fillStyle = flashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  if (chromaOffset > 0.5 && FX.chromaMultiplier > 0) {
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    ctx.globalAlpha = Math.min(0.4, chromaOffset / 30) * FX.chromaMultiplier;
    ctx.fillStyle = `hsl(${(time * 10) % 360}, 100%, 50%)`;
    ctx.fillRect(-chromaOffset, -chromaOffset, W, H);
    ctx.fillStyle = `hsl(${(time * 10 + 180) % 360}, 100%, 50%)`;
    ctx.fillRect(chromaOffset, chromaOffset, W, H);
    ctx.restore();
  }

  if (player.hp / player.maxHp < 0.3 && !gameOver && !weaponMenu && !titleScreen) {
    const intensity = (1 - player.hp / player.maxHp) * 0.55 * FX.bgMultiplier;
    const pulse = 0.7 + Math.sin(time * 0.3) * 0.3;
    const grad = ctx.createRadialGradient(W/2, H/2, H*0.15, W/2, H/2, H*0.75);
    grad.addColorStop(0, "rgba(255, 0, 40, 0)");
    grad.addColorStop(1, `rgba(255, 0, 40, ${intensity * pulse})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  if (combo > 20 && !gameOver && !weaponMenu && !titleScreen && FX.bgMultiplier > 0.5) {
    ctx.save();
    ctx.globalCompositeOperation = "overlay";
    ctx.globalAlpha = Math.min(0.3, (combo - 20) / 100) * FX.bgMultiplier;
    const hue = (time * 4) % 360;
    ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

createStars();
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
