  if (!audioCtx || !bgmGain) return;
  const s = step % 64;
  if (BGM_PATTERNS.bass[s]) playBGMNote("triangle", noteFreq(NOTE[BGM_PATTERNS.bass[s]]), BGM_STEP_DUR * 1.8, 0.18);
  if (BGM_PATTERNS.lead[s]) playBGMNote("square", noteFreq(NOTE[BGM_PATTERNS.lead[s]]), BGM_STEP_DUR * 1.5, 0.10);
  if (BGM_PATTERNS.arp[s]) playBGMNote("sawtooth", noteFreq(NOTE[BGM_PATTERNS.arp[s]]), BGM_STEP_DUR * 0.8, 0.05);
  const dm = BGM_DRUMS[s];
  if (dm === "K") playBGMDrum("K", 0.3);
  else if (dm === "S") playBGMDrum("S", 0.18);
  else if (dm === "H") playBGMDrum("H", 0.08);
}
function bgmScheduler() {
  if (!audioCtx || !bgmGain) return;
  const now = audioCtx.currentTime;
  while (bgmNextStepTime < now + 0.1) {
    scheduleStep(bgmCurrentStep);
    bgmNextStepTime += BGM_STEP_DUR;
    bgmCurrentStep++;
    if (bgmCurrentStep >= 128) bgmCurrentStep = 0;
  }
}
function startSynthBGM() {
  if (!audioCtx) return;
  ensureGains();
  if (bgmSchedulerId) clearInterval(bgmSchedulerId);
  bgmNextStepTime = audioCtx.currentTime + 0.05;
  bgmCurrentStep = 0;
  bgmSchedulerId = setInterval(bgmScheduler, 25);
}

function startBGM() {
  if (!audioCtx) return;
  ensureGains();
  if (bgmMp3Failed) { startSynthBGM(); return; }
  if (!bgmAudio) {
    bgmAudio = new Audio(BGM_FILE);
    bgmAudio.loop = true;
    bgmAudio.preload = "auto";
    bgmAudio.addEventListener("error", () => { bgmMp3Failed = true; bgmAudio = null; startSynthBGM(); });
  }
  applyMp3Volume();
  const p = bgmAudio.play();
  if (p && p.catch) p.catch(() => {
    const retry = () => { if (bgmAudio) bgmAudio.play().catch(()=>{}); window.removeEventListener("pointerdown", retry, true); window.removeEventListener("keydown", retry, true); };
    window.addEventListener("pointerdown", retry, true);
    window.addEventListener("keydown", retry, true);
  });
}

function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function pickWrongs(ans, cnt, range) {
  const set = new Set([ans]), w = [];
  let s = 0;
  while (w.length < cnt && s < 200) {
    s++;
    let x = ans + randInt(-range, range);
    if (x === 0 && ans !== 0) x += 1;
    if (x !== ans && !set.has(x)) { set.add(x); w.push(x); }
  }
  while (w.length < cnt) w.push(ans + (w.length + 1) * 7);
  return w;
}
function shuffle(a) {
  for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function generateQuizGrade1() {

    return { text: `(-${a}) ${m?"-":"+"} ${b} = ?`, choices: shuffle([ans, ...pickWrongs(ans,3,5)]), answer: ans }; }
  else if (t === 1) { const a = randInt(2,6), x = randInt(-8,8), b = randInt(-15,15), c = a*x+b;
    const s = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
    return { text: `${a}x ${s} = ${c}\n x = ?`, choices: shuffle([x, ...pickWrongs(x,3,4)]), answer: x }; }
  else { const a = randInt(2,9), b = randInt(2,9), ans = a+b;
    return { text: `${a}x + ${b}x = ?\n xの係数は？`, choices: shuffle([ans, ...pickWrongs(ans,3,4)]), answer: ans }; }
}
function generateQuizGrade2() {

  if (t === 0) { const x = randInt(1,9), y = randInt(1,9);
    return { text: `x + y = ${x+y}\nx - y = ${x-y}\n x = ?`, choices: shuffle([x, ...pickWrongs(x,3,3)]), answer: x }; }
  else if (t === 1) { const a = randInt(2,5), x = randInt(1,6), y = randInt(1,9), c = a*x+y;
    return { text: `${a}x + y = ${c}\n x = ${x} のとき y = ?`, choices: shuffle([y, ...pickWrongs(y,3,4)]), answer: y }; }
  else { const a = randInt(2,5), b = randInt(-8,8), x = randInt(-5,7), y = a*x+b;
    const s = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
    return { text: `y = ${a}x ${s}\n x = ${x} のとき y = ?`, choices: shuffle([y, ...pickWrongs(y,3,6)]), answer: y }; }
}
function generateQuizGrade3() {
  const t = Math.floor(Math.random()*3);

    return { text: `(x + ${a})(x + ${b})\n x の係数は？`, choices: shuffle([ans, ...pickWrongs(ans,3,4)]), answer: ans }; }
  else if (t === 1) { const a = randInt(1,9), b = randInt(1,9), ans = a*b;
    return { text: `x² + ${a+b}x + ${a*b}\n = (x + ${a})(x + ?)`, choices: shuffle([b, ...pickWrongs(ans,3,Math.max(5,Math.floor(ans/2)))]), answer: b }; }

function updateStars() {

  for (const n of nebulae) { n.y += n.speed; if (n.y - n.r > H) { n.y = -n.r; n.x = Math.random()*W; } }
  if (Math.random() < 0.012 * FX.bgMultiplier) shootingStars.push({ x: Math.random()*W, y: -20, vx: -8-Math.random()*6, vy: 5+Math.random()*4, life: 100, length: 80+Math.random()*100, hue: cfg.starHue+Math.random()*40 });

  else if (tk === "theme_sunset") { rate = 0.06*FX.bgMultiplier; vy = -0.5-Math.random()*0.5; size = 3+Math.random()*3; cf = () => `hsla(${10+Math.random()*30},100%,70%,0.7)`; sway = 0.4; }
  else if (tk === "theme_toxic") { rate = 0.10*FX.bgMultiplier; vy = -0.4-Math.random()*0.6; size = 3+Math.random()*4; cf = () => `hsla(${90+Math.random()*40},100%,60%,0.6)`; sway = 0.8; }

function drawBackground() {
  const tk = getEquippedTheme();

  const nightFactor = 0.5 + Math.sin(dayPhase*TAU - Math.PI/2)*0.5;

  ctx.fillRect(0, 0, W, H);
  const hueShift = bgTint*0.3 + time*cfg.hueDrift;
  const dangerA = dangerTint;
  for (const n of nebulae) {
    const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    grad.addColorStop(0, `hsla(${(n.hue+hueShift)%360},90%,55%,${n.alpha*FX.bgMultiplier*1.4})`);
    grad.addColorStop(1, `hsla(${(n.hue+hueShift)%360},90%,55%,0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(n.x-n.r, n.y-n.r, n.r*2, n.r*2);
  }
  if (FX.bgMultiplier > 0.2 && time % 2 === 0) {
    for (const b of auroraBands) {
      b.phase += b.speed;
      const hue = (b.hue+hueShift)%360;
      const grad = ctx.createLinearGradient(0, b.yBase-100, 0, b.yBase+100);
      grad.addColorStop(0, `hsla(${hue},90%,60%,0)`);
      grad.addColorStop(0.5, `hsla(${hue},90%,60%,${0.14*FX.bgMultiplier})`);
      grad.addColorStop(1, `hsla(${hue},90%,60%,0)`);
      ctx.fillStyle = grad;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, b.yBase);
      for (let x = 0; x <= W; x += 40) ctx.lineTo(x, b.yBase + Math.sin(b.phase + x*0.015)*b.amp);
      ctx.lineTo(W, b.yBase+150); ctx.lineTo(0, b.yBase+150); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
  initAudio();
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  if (titleScreen && showDailyBonusPopup) { claimDailyBonus(); return; }
  if (emergencyMenu) { if (k === "escape") { emergencyMenu = false; } return; }
  if (settingsScreen) { if (k === "escape") { settingsScreen = false; titleScreen = true; return; } return; }
  if (pauseScreen) {
    if (k === "escape") { if (pauseBackToTitleConfirm) pauseBackToTitleConfirm = false; else pauseScreen = false; return; }
    if (k === "enter" && pauseBackToTitleConfirm) { pauseBackToTitleConfirm = false; pauseScreen = false; abortGameToTitle(); return; }
    return;
  }
  if (studyQuizActive && studyQuiz) { if (/^[1-4]$/.test(k)) answerStudyQuiz(Number(k)-1); return; }
  if (missionScreen) { if (k === "escape" || k === "q") { missionScreen = false; titleScreen = true; } return; }
  if (challengeScreen) { if (k === "escape" || k === "q") { challengeScreen = false; titleScreen = true; } return; }
  if (hardChallengeScreen) { if (k === "escape" || k === "q") { hardChallengeScreen = false; titleScreen = true; } return; }
  if (studySelectScreen) {
    if (k === "escape" || k === "q") { studySelectScreen = false; titleScreen = true; }
    if (k === "1") { startStudyMode(1); return; }
    if (k === "2") { startStudyMode(2); return; }
    if (k === "3") { startStudyMode(3); return; }
    return;
  }
  if (titleScreen) {
    if (k === "f") { studyMode = false; fusionMode = true; quickMode = false; fusionSelected = []; applyChallenge(null); titleScreen = false; weaponMenu = true; specialMenu = false; menuScrollY = 0; return; }
    if (k === "q") { studyMode = false; quickMode = true; fusionMode = false; fusionSelected = []; applyChallenge(null); titleScreen = false; weaponMenu = true; specialMenu = false; menuScrollY = 0; return; }
    if (k === "s") { shopScreen = true; titleScreen = false; shopScrollY = 0; shopTab = "weapon"; return; }
    if (k === "b") { openBossSelect(); return; }
    if (k === "m") { checkDailyMissions(); missionScreen = true; titleScreen = false; return; }
    if (k === "c") { openHardChallenge(); return; }
    if (k === "t") { studySelectScreen = true; titleScreen = false; return; }
    if (k === "g") { rollGacha(); return; }
    studyMode = false; titleScreen = false; quickMode = false; fusionMode = false; applyChallenge(null);
    weaponMenu = true; specialMenu = false; menuScrollY = 0;
    shake(15);
    if (fxMode !== "safe") flash("#00ffcc", 6);
    return;
  }
  if (shopScreen) { if (k === "escape" || k === "q") { shopScreen = false; titleScreen = true; } return; }
  if (specialMenu) { if (k === "escape" || k === "q") { specialMenu = false; weaponMenu = true; fusionSelected = []; fusionMode = false; } return; }
  if (weaponMenu) {
    if (bossMode) {
      if (k === "enter" && bossSelected.length === 3) { startBossBattleFromMenu(); return; }
      if (k === "escape") { exitBossSelect(); return; }
      return;
    }
    if (fusionMode) {
      if (k === "enter" && fusionSelected.length >= 2) { startFusionGame(); return; }
      if (k === "escape") { fusionMode = false; fusionSelected = []; titleScreen = true; weaponMenu = false; return; }
    }
    return;
  }
  if (gameOver && k === "enter") { if (gameClear) returnToTitle(); else resetGame(); return; }
  if (k === " " && !gameOver) { tryDash(); return; }
  if (k === "escape" && !gameOver) { pauseScreen = true; pauseBackToTitleConfirm = false; return; }
  if (k === "e" && !gameOver && !bossMode && !challengeNoSpecials && specialGauge >= SPECIAL_MAX && specialActive <= 0 && !studyMode) { sfx.special(); activateSpecial(); return; }
  if (k === "e" && !gameOver && studyMode && studyBurstGauge >= STUDY_BURST_MAX && specialActive <= 0) { sfx.special(); activateSpecial(); return; }
});

function tryDash() {
  if (player.dashCooldown > 0 || player.dashTimer > 0) return;
  let dx = 0, dy = 0;
  if (keys.arrowleft || keys.a) dx -= 1;
  if (keys.arrowright || keys.d) dx += 1;
  if (keys.arrowup || keys.w) dy -= 1;
  if (keys.arrowdown || keys.s) dy += 1;
  if (dx === 0 && dy === 0) dy = -1;
  const len = Math.hypot(dx, dy);
  player.dashVx = dx/len * 14;
  player.dashVy = dy/len * 14;
  player.dashTimer = 12;
  player.dashCooldown = Math.floor(45 * getDashCdMult());
  player.invincible = Math.max(player.invincible, 14);
  sfx.dash();
  burst(player.x, player.y, 20, getPlayerColor());
  burst(player.x, player.y, 10, "#ffffff");
  shake(12); flash(getPlayerColor(), 4);
}

/* ========== スケーリング ========== */
function enemyHpScale() {
  const lv = level;
  let s = 1 + (lv-1)*0.22;
  if (lv > 20) s += (lv-20)*0.10;
  if (lv > 40) s += (lv-40)*0.15;
  if (lv > 60) s += (lv-60)*0.22;
  return s;
}
function enemySpeedScale() {
  const lv = level;
  let s = 1 + (lv-1)*0.025;
  if (lv > 15) s += (lv-15)*0.012;
  if (lv > 35) s += (lv-35)*0.018;
  if (challengeFastEnemy) s *= 1.5;
  const dp = (time%7200)/7200;
  const nf = 0.5 + Math.sin(dp*TAU - Math.PI/2)*0.5;
  s *= (1 + nf*0.3);
  return s;
}
function enemyShootScale() {
  const lv = level;
  let s = 1 + (lv-1)*0.020;
  if (lv > 20) s += (lv-20)*0.010;
  if (challengeDoubleBullet) s *= 1.8;
  return s;
}
function enemyBulletSpeedScale() {
  const lv = level;
  let s = 1 + (lv-1)*0.008;
  if (lv > 25) s += (lv-25)*0.006;
  if (hardChallengeState.active && hardChallengeState.fastBullets) s *= 2;
  return s;
}

/* ========== 敵撃破 ========== */
function killEnemy(idx) {
  const e = enemies[idx];
  if (!e) return;
  if (bossMode && e.bm) {
    if (e.invuln) { e.hp = e.maxHp; return; }
    if (e.gateT > 0) { e.hp = e.gateHp; return; }
    if (bossForm < BOSS_FORM_N) { bossFormCleared(e); return; }
    if (e.gn < 1) { bossStartGate(e); return; }
    gameClear = true; gameOver = true;
    missionSession.cleared = true;
    recordGameResult(true);
    sfx.clear();
    shake(180); flash("#ffcc00", 50); chroma(50); hitStopAdd(50); zoomPulse = 2.5;
    burst(e.x, e.y, 200, "#ffee00");
    for (let k = 0; k < 25; k++) setTimeout(() => {
      const bx = Math.random()*W, by = Math.random()*H;
      burst(bx, by, 70, "#ffcc00"); burst(bx, by, 35, "#ffffff"); burst(bx, by, 20, "#ff00ff");
      flash("#ffffff", 6); shake(35);
    }, k*110);
    return;
  }
  if (e.type === "boss" && !e.phase2 && bossKillCount < BOSS_KILL_TARGET && !studyMode && !quickMode && !bossMode) {
    e.phase2 = true;
    e.maxHp = e.maxHp*1.5;
    e.hp = e.maxHp;
    e.speed *= 1.4;
    e.r *= 1.2;
    e.bossPhase = 0;
    showBigDamage(e.x, e.y, "PHASE 2!", "#ff0044");
    sfx.bossAppear();
    shake(80); flash("#ff0044", 20); chroma(25); hitStopAdd(20);
    burst(e.x, e.y, 100, "#ff0044"); burst(e.x, e.y, 50, "#ffffff");
    return;
  }
  const big = e.type === "heavy" || e.type === "boss" || e.type === "tank";
  if (big) sfx.enemyDie();
  burst(e.x, e.y, big?120:40, e.type === "heavy" ? "#ffaa00" : e.type === "boss" ? "#ff0044" : e.type === "tank" ? "#8866ff" : "#ff0088");
  burst(e.x, e.y, big?60:20, "#ffffff");
  burst(e.x, e.y, big?40:15, "#ffff00");
  if (Math.random() < 0.5) burst(e.x, e.y, big?50:15, "#ff00ff");
  shake(big?40:(e.type === "child"?4:10));
  if (big) hitStopAdd(10); else if (Math.random() < 0.5) hitStopAdd(2);
  if (big || Math.random() < 0.15) flash(e.type === "boss" ? "#ff0044" : "#ff00ff", big?8:3);
  if (e.type === "boss") {
    sfx.bossDie();
    shake(120); flash("#ffffff", 25); chroma(30); hitStopAdd(20); zoomPulse = 2;
    for (let k = 0; k < 8; k++) setTimeout(() => {
      const bx = e.x + (Math.random()-.5)*300, by = e.y + (Math.random()-.5)*300;
      burst(bx, by, 60, "#ff0044"); burst(bx, by, 30, "#ffffff");
      shake(35); flash("#ff0044", 5);
    }, k*90);
    bossKillCount++;
    missionSession.bossKills = bossKillCount;
    const target = (studyMode || quickMode || bossMode) ? 1 : BOSS_KILL_TARGET;
    if (bossKillCount >= target && !gameClear) {
      gameClear = true; gameOver = true;
      missionSession.cleared = true;
      recordGameResult(true);
      sfx.clear();
      shake(180); flash("#ffcc00", 50); chroma(50); hitStopAdd(50); zoomPulse = 2.5;
      for (let k = 0; k < 25; k++) setTimeout(() => {
        const bx = Math.random()*W, by = Math.random()*H;
        burst(bx, by, 70, "#ffcc00"); burst(bx, by, 35, "#ffffff"); burst(bx, by, 20, "#ff00ff");
        flash("#ffffff", 6); shake(35);
      }, k*110);
    }
  }
  addCombo();
  score += Math.round(e.score * comboMultiplier());
  if (score > missionSession.maxScore) missionSession.maxScore = score;
  gainExperience(1);
  missionSession.kills++;
  specialGauge = Math.min(SPECIAL_MAX, specialGauge + (big?2:0.5)*getGaugeMult());
  maybeDropPowerup(e.x, e.y, e.type);
  if (e.type === "boss") {
    bossActive = false;
    shockwaves.push({ x:e.x, y:e.y, radius:10, maxRadius:800, life:60, color:"255,0,68" });
    if (!bossMode) for (let i = 0; i < 3; i++) powerups.push({ x: e.x+(i-1)*40, y: e.y, vy: 1.2, r: 14, kind: i === 0 ? "heal" : i === 1 ? "bomb" : "exp", life: 600, bob: Math.random()*TAU });
  }
  enemies.splice(idx, 1);
  if (e.type === "splitter") {

function updateExtraWeapons() {
  for (let i = yoyoStates.length-1; i >= 0; i--) {
    const y = yoyoStates[i];
    y.phase += 0.06; y.life--;
    y.x += y.vx; y.y += y.vy;
    y.vy += 0.35;
    y.vx *= 0.985;
    if (y.life < 60) {
      const dx = player.x-y.x, dy = player.y-y.y, d = Math.hypot(dx, dy)||1;
      y.vx += dx/d*0.9; y.vy += dy/d*0.9;
      y.vx *= 0.94; y.vy *= 0.94;

    }
    for (let j = enemies.length-1; j >= 0; j--) {
      const e = enemies[j];
      if (y.hitSet.has(e)) continue;
      if (Math.hypot(e.x-y.x, e.y-y.y) < e.r+y.r) {
        y.hitSet.add(e);
        e.hp -= y.damage; showDamage(e.x, e.y, y.damage, "#ff66aa");
        burst(y.x, y.y, 12, "#ff66aa");
        if (e.hp <= 0) killEnemy(j);
      }
    }
  }
  for (let i = frisbeeStates.length-1; i >= 0; i--) {
    const f = frisbeeStates[i];
    f.x += f.vx; f.y += f.vy; f.life--; f.spin += 0.3;
    if (f.x < f.r) { f.x = f.r; f.vx = -f.vx; }
    if (f.x > W-f.r) { f.x = W-f.r; f.vx = -f.vx; }
    if (!f.returning && f.life < 200) f.returning = true;
    if (f.returning) {
      const dx = player.x-f.x, dy = player.y-f.y, d = Math.hypot(dx, dy)||1;
      f.vx += dx/d*0.5; f.vy += dy/d*0.5;
      const s = Math.hypot(f.vx, f.vy)||1;
      f.vx = f.vx/s*11; f.vy = f.vy/s*11;
      if (d < 22) { frisbeeStates.splice(i,1); continue; }
    }
    for (let j = enemies.length-1; j >= 0; j--) {
      const e = enemies[j];
      if (f.hitSet.has(e)) continue;
      if (Math.hypot(e.x-f.x, e.y-f.y) < e.r+f.r) {
        f.hitSet.add(e);
        e.hp -= f.damage; showDamage(e.x, e.y, f.damage, "#66ffcc");
        burst(f.x, f.y, 12, "#66ffcc");
        if (e.hp <= 0) killEnemy(j);

          c.hitSet.add(e);
          const d = Math.hypot(e.x-player.x, e.y-player.y)||1;

      if (Math.hypot(e.x-player.x, e.y-player.y) < r+e.r) {
        e.hp -= dmg; showDamage(e.x, e.y, dmg, "#ff88ff");

      const dx = e.x-w.x, dy = e.y-w.y, d = Math.hypot(dx, dy);
      if (d > w.range) continue;
      const at = Math.atan2(dy, dx);
      let diff = at - w.angle;
      while (diff > Math.PI) diff -= TAU;
      while (diff < -Math.PI) diff += TAU;
      if (Math.abs(diff) > Math.PI/3) continue;

    ctx.fillStyle = `rgba(0,0,0,${a*0.85})`; ctx.fillRect(0,0,W,H);

      ctx.fillRect(0, H*k/8, W, H/8);

    gr.addColorStop(0.5, `rgba(255,180,0,${a*0.7})`);
    gr.addColorStop(1, `rgba(120,60,0,${a*0.5})`);

    const gr = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W);

    gr.addColorStop(0, `hsla(${hue},100%,90%,${a*0.9})`);
    gr.addColorStop(0.5, `hsla(${(hue+60)%360},100%,70%,${a*0.7})`);

  }

function draw() {
  drawBackground();
  if (settingsScreen) { drawSettingsScreen(); return; }
  if (titleScreen) { drawTitle(); if (abortPopup) drawAbortPopup(); return; }
  if (shopScreen) { drawShop(); return; }
  if (missionScreen) { drawMissionScreen(); return; }
  if (challengeScreen) { drawChallengeScreen(); return; }
  if (studySelectScreen) { drawStudySelectScreen(); return; }
  if (hardChallengeScreen) { drawHardChallengeScreen(); return; }
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(zoomPulse, zoomPulse);
  ctx.translate(-W/2, -H/2);
  ctx.translate(shakeX, shakeY);
  drawEffects();
  if (!weaponMenu && !specialMenu) {
    drawPlayer();
    drawKnifeAim();
    drawOrbit();
    drawTurrets();
    drawMines();
    for (const b of bullets) drawBullet(b);
    drawEnemies();
    drawPowerups();
    ctx.save();
    for (const b of enemyBullets) {
      const c = `hsl(${b.hue || 30},100%,65%)`;
      ctx.shadowBlur = bossMode ? 0 : 12; ctx.shadowColor = c; ctx.fillStyle = c;
      if (bossMode) { ctx.globalAlpha = .3; ctx.beginPath(); ctx.arc(b.x, b.y, b.r*1.8, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(255,255,255,.85)";
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r*0.45, 0, TAU); ctx.fill();
    }
    ctx.restore();
    drawLightning();
    drawDamageNumbers();
    if (bossMode) drawBossUI(); else drawGameUI();
    drawSpecialEffect();
    drawTheWorldEffect();
    drawMudaMudaEffect();
  }
  if (weaponMenu) drawWeaponMenu();
  if (specialMenu) drawSpecialMenu();
  if (gameOver) drawGameOver();
  ctx.restore();
  drawPauseButton();
  drawMuteButton();
  drawSpecialCircle();
  if (studyQuizActive) drawStudyQuiz();
  if (pauseScreen) drawPauseScreen();
  if (emergencyMenu) drawEmergencyMenu();
  if (flashScreen > 0 && FX.flashMultiplier > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, flashScreen/10)*0.7*FX.flashMultiplier;
    ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  if (chromaOffset > 0.5 && FX.chromaMultiplier > 0) {
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    ctx.globalAlpha = Math.min(0.4, chromaOffset/30)*FX.chromaMultiplier;
    ctx.fillStyle = `hsl(${(time*10)%360},100%,50%)`;
    ctx.fillRect(-chromaOffset, -chromaOffset, W, H);
    ctx.fillStyle = `hsl(${(time*10+180)%360},100%,50%)`;
    ctx.fillRect(chromaOffset, chromaOffset, W, H);
    ctx.restore();
  }
  const vg = ctx.createRadialGradient(W/2, H/2, W*0.3, W/2, H/2, W*0.75);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, `rgba(255,0,68,${dangerTint*0.35})`);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function applyGift(g){
  if (!Array.isArray(saveData.redeemedGifts)) saveData.redeemedGifts = [];
  if (saveData.redeemedGifts.includes(g.id)) return "already";
  if (saveData.giftSent.some(x => x.id === g.id)) return "own";
  if (g.type === "coin") { saveData.coins = (saveData.coins || 0) + Math.max(0, Math.min(100000, Math.floor(+g.value || 0))); }
  else if (g.type === "weapon" && weapons[g.value]) {
    if (!saveData.ownedWeapons.includes(g.value)) saveData.ownedWeapons.push(g.value);
    else saveData.coins = (saveData.coins || 0) + Math.floor(getWeaponPrice(g.value)/2);
  } else return "bad";
  saveData.redeemedGifts.push(g.id); if (saveData.redeemedGifts.length > 300) saveData.redeemedGifts.shift();
  saveData.giftInbox.push(g); writeSave(); return "ok";
}
function receiveGifts(){
  try {
    const SHARED_KEY = "neonBulletGiftInbox_v1";
    const raw = localStorage.getItem(SHARED_KEY);
    if (!raw) return;
    let box = JSON.parse(raw), n = 0;
    const me = (saveData.userName || "").toLowerCase();
    for (const g of box) if ((g.to || "").toLowerCase() === me && applyGift(g) === "ok") n++;
    box = box.filter(g => (g.to || "").toLowerCase() !== me);
    localStorage.setItem(SHARED_KEY, JSON.stringify(box));
    if (n > 0) showGiftReceivePopup(n);
  } catch (e) {}
}

function confirmGiftCode(){
  const c = (giftCodeEl ? giftCodeEl.value : "").trim();
  if (!c) return;
  const g = parseGiftCode(c);
  if (!g) { alert("コードが正しくありません"); return; }
  if ((g.to || "").toLowerCase() !== (saveData.userName || "").toLowerCase()) {
    alert(`このギフトは「${g.to}」さん宛てです\n(あなたの名前: ${saveData.userName})`); return;
  }
  const r = applyGift(g);
  if (r === "ok") { closeGiftCodeInput(); showGiftReceivePopup(1); sfx.coin(); shake(30); flash("#ffd700", 10); chroma(15); }
  else alert(r === "already" ? "このコードは使用済みです" : r === "own" ? "自分で送ったギフトは受け取れません" : "このギフトは受け取れませんでした");
}
if (giftCodeEl) {
  giftCodeEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); confirmGiftCode(); }
    if (e.key === "Escape") { e.preventDefault(); closeGiftCodeInput(); }
  });
}

  if (giftScreen === "weapon") return Math.max(0, [...new Set(saveData.ownedWeapons)].filter(k => weapons[k] && weapons[k].price > 0).length*64 - (H-120-170));
  return 0;

  ctx.shadowBlur = 0;
  ctx.font = "bold 22px Arial";
  ctx.fillStyle = `hsl(${hue},100%,70%)`;
  ctx.fillText("🎁", cx, cy + 1);
  ctx.restore(); ctx.textAlign = "left";
}
const _origDraw = window.draw;
window.draw = function(){
  if (giftScreen !== "none") { drawBackground(); drawGiftScreen(); return; }
  if (inboxScreen) { drawBackground(); drawInbox(); return; }
  _origDraw();
};
// Keep the original game input handler before replacing canvas listeners.
const _origStart = startPointer;
function giftStart(e){
  if (e.target === nameEl || e.target === giftCodeEl) return;
  if (nameInputActive) {
    e.stopImmediatePropagation(); e.preventDefault();
    const p = getPointerPosition(e);
    const cbw = 220, cbh = 54, cbx = (W-cbw)/2, cby = 400;
    if (p.x >= cbx && p.x <= cbx+cbw && p.y >= cby && p.y <= cby+cbh) { initAudio(); sfx.tap(); confirmNameInput(); }
    return;
  }
  if (giftCodeInputActive) {
    e.stopImmediatePropagation(); e.preventDefault();
    const p = getPointerPosition(e);
    if (!(p.x >= (W-320)/2 && p.x <= (W+320)/2 && p.y >= H-140 && p.y <= H-100)) confirmGiftCode();
    return;
  }
  if (giftScreen === "none" && !inboxScreen && titleScreen && !showDailyBonusPopup && !abortPopup && !settingsScreen) {
    const p = getPointerPosition(e);
    const dx = p.x - TITLE_GIFT_BTN_X, dy = p.y - TITLE_GIFT_BTN_Y;
    if (dx*dx + dy*dy <= TITLE_GIFT_BTN_R*TITLE_GIFT_BTN_R) {
      e.stopImmediatePropagation(); e.preventDefault();
      initAudio(); openGiftMenu(); return;
    }
  }
  if (giftScreen !== "none" || inboxScreen) {
    e.stopImmediatePropagation(); e.preventDefault();
    initAudio();
    const p = getPointerPosition(e);
    giftDrag = { y: p.y, s: inboxScreen ? inboxScroll : giftWeaponScroll };
    if (inboxScreen) {
      if (p.x >= (W-320)/2 && p.x <= (W+320)/2 && p.y >= H-140 && p.y <= H-100) { openGiftCodeInput(); return; }
      const bby = H-45, bbw = 200, bbx = (W-bbw)/2;
      if (p.x >= bbx && p.x <= bbx+bbw && p.y >= bby-22 && p.y <= bby+22) { sfx.tap(); inboxScreen = false; }
      return;
    }
    if (giftScreen === "menu") {
      const bw = 300, bh = 60, bx = (W-bw)/2;
      const items = [
        { y: 180, action: () => { giftSelectedType = "coin"; giftScreen = "coin"; sfx.tap(); } },
        { y: 260, action: () => { giftSelectedType = "weapon"; giftScreen = "weapon"; sfx.tap(); } },
        { y: 340, action: () => { receiveGifts(); inboxScreen = true; inboxScroll = 0; sfx.tap(); } },
        { y: 440, action: closeGift }
      ];
      for (const it of items) if (p.x >= bx && p.x <= bx+bw && p.y >= it.y && p.y <= it.y+bh) { it.action(); return; }
      return;
    }
    if (giftScreen === "coin") {
      const bw = 140, bh = 50, gap = 12;
      for (let i = 0; i < GIFT_COIN_PRESETS.length; i++) {
        const c = i % 2, r = Math.floor(i/2);
        const x = (W - (bw*2+gap))/2 + c*(bw+gap);
        const y = 200 + r*(bh+gap);
        if (p.x >= x && p.x <= x+bw && p.y >= y && p.y <= y+bh) {
          const v = GIFT_COIN_PRESETS[i];
          if (saveData.coins >= v) { giftSelectedCoin = v; sfx.tap(); }
          return;
        }
      }
      const sx = 60, sw = W-120, sy = 400;
      if (p.x >= sx && p.x <= sx+sw && p.y >= sy-20 && p.y <= sy+20) { giftSelectedCoin = Math.max(1, Math.round((p.x - sx)/sw*1000)); return; }
      const bw2 = 140, bh2 = 50, by2 = 470;
      const yx = W/2 - bw2 - 8, nx = W/2 + 8;
      const canGo = saveData.coins >= giftSelectedCoin && giftSelectedCoin > 0;
      if (p.x >= yx && p.x <= yx+bw2 && p.y >= by2 && p.y <= by2+bh2) { if (canGo) { giftScreen = "target"; sfx.tap(); } return; }
      if (p.x >= nx && p.x <= nx+bw2 && p.y >= by2 && p.y <= by2+bh2) { giftScreen = "menu"; sfx.tap(); return; }
      return;
    }
    if (giftScreen === "weapon") {
      const list = saveData.ownedWeapons.slice();
      const unique = [...new Set(list)].filter(k => weapons[k] && weapons[k].price > 0);
      const LT = 170, IH = 56, GAP = 8;
      for (let i = 0; i < unique.length; i++) {
        const k = unique[i];
        const y = LT + i*(IH+GAP) - giftWeaponScroll;
        if (p.x >= 24 && p.x <= W-24 && p.y >= y && p.y <= y+IH) { giftSelectedWeapon = k; sfx.tap(); return; }
      }
      const bw2 = 140, bh2 = 50, by2 = H-70;
      const yx = W/2 - bw2 - 8, nx = W/2 + 8;
      const canGo = canSendGift();
      if (p.x >= yx && p.x <= yx+bw2 && p.y >= by2 && p.y <= by2+bh2) { if (canGo) { giftScreen = "target"; sfx.tap(); } return; }
      if (p.x >= nx && p.x <= nx+bw2 && p.y >= by2 && p.y <= by2+bh2) { giftScreen = "menu"; sfx.tap(); return; }
      return;
    }
    if (giftScreen === "target") {
      if (p.x >= (W-320)/2 && p.x <= (W+320)/2 && p.y >= 200 && p.y <= 260) { const v = prompt("送り先のユーザー名", giftTargetUser); if (v !== null) giftTargetUser = v.slice(0, 12); return; }
      const bw2 = 140, bh2 = 50, by2 = 320;
      const yx = W/2 - bw2 - 8, nx = W/2 + 8;
      const canGo = giftTargetUser.trim().length > 0;
      if (p.x >= yx && p.x <= yx+bw2 && p.y >= by2 && p.y <= by2+bh2) { if (canGo) { giftScreen = "message"; sfx.tap(); } return; }
      if (p.x >= nx && p.x <= nx+bw2 && p.y >= by2 && p.y <= by2+bh2) { giftScreen = "menu"; sfx.tap(); return; }
      return;
    }
    if (giftScreen === "message") {
      if (p.x >= (W-340)/2 && p.x <= (W+340)/2 && p.y >= 200 && p.y <= 320) { const v = prompt("メッセージ(空でもOK)", giftMessage); if (v !== null) giftMessage = v.slice(0, 80); return; }
      const bw2 = 140, bh2 = 50, by2 = 430;
      const yx = W/2 - bw2 - 8, nx = W/2 + 8;
      if (p.x >= yx && p.x <= yx+bw2 && p.y >= by2 && p.y <= by2+bh2) { sendGift(); return; }
      if (p.x >= nx && p.x <= nx+bw2 && p.y >= by2 && p.y <= by2+bh2) { giftScreen = "target"; sfx.tap(); return; }
      return;
    }
    if (giftScreen === "sent") {
      if (p.x >= (W-260)/2 && p.x <= (W+260)/2 && p.y >= 368 && p.y <= 408) { copyGiftCode(); return; }
      const bw = 200, bh = 50, bx = (W-bw)/2, by = 420;
      if (p.x >= bx && p.x <= bx+bw && p.y >= by && p.y <= by+bh) { giftScreen = "none"; sfx.tap(); }
      return;
    }
  }
  _origStart(e);
}
canvas.addEventListener("touchstart", giftStart, { passive:false, capture:true });
canvas.addEventListener("mousedown", giftStart, { capture:true });
canvas.removeEventListener("touchstart", startPointer);
canvas.removeEventListener("mousedown", startPointer);

window.addEventListener("keydown", (e) => {
  if (nameInputActive) { e.stopImmediatePropagation(); return; }
  if (giftCodeInputActive) { e.stopImmediatePropagation(); return; }
  if (giftScreen === "target" || giftScreen === "message") {
    e.stopImmediatePropagation();
    if (e.key === "Enter") {
      if (giftScreen === "target" && giftTargetUser.trim().length > 0) { giftScreen = "message"; sfx.tap(); }
      else if (giftScreen === "message" && true) sendGift();
    } else if (e.key === "Escape") { giftScreen = giftScreen === "target" ? "menu" : "target"; }
    else if (e.key === "Backspace") { if (giftScreen === "target") giftTargetUser = giftTargetUser.slice(0, -1); else giftMessage = giftMessage.slice(0, -1); }
    else if (e.key.length === 1 && giftScreen === "target" && giftTargetUser.length < 12) giftTargetUser += e.key;
    else if (e.key.length === 1 && giftScreen === "message" && giftMessage.length < 80) giftMessage += e.key;
    return;
  }
}, true);

setTimeout(receiveGifts, 600);
})();
</script>
