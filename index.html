            if (e.hp <= 0) killEnemy(j);
          }
        }
        bullets.splice(i,1); continue;
      }
    }
    if (b.type === "grenade") {
      b.fuse--;
      if (b.fuse <= 0) {
        const r = b.blastRadius;
        shockwaves.push({ x:b.x, y:b.y, radius:8, maxRadius:r, life:20, color:"180,180,50" });
        burst(b.x, b.y, 80, "#cccc44");
        burst(b.x, b.y, 40, "#ffffff");
        shake(30); flash("#cccc44", 10); chroma(10); hitStopAdd(5);
        for (let j = enemies.length-1; j >= 0; j--) {
          const e = enemies[j];
          if (Math.hypot(e.x-b.x, e.y-b.y) < r + e.r) {
            e.hp -= b.damage;
            showDamage(e.x, e.y, b.damage, "#cccc44");
            if (e.hp <= 0) killEnemy(j);
          }
        }
        bullets.splice(i,1); continue;
      }
    }
    if (b.type === "tornado") {
      for (const e of enemies) {
        if (e.type === "boss") continue;
        const dx = b.x - e.x, dy = b.y - e.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d < b.pullRadius) {
          e.x += dx/d * 3;
          e.y += dy/d * 3;
          e.hp -= b.damage;
        }
      }
      b.spin += 0.3;
      if (b.life <= 0) { burst(b.x, b.y, 60, "#ccccff"); bullets.splice(i,1); continue; }
    }
    if (b.type === "sonic") {
      if (!b.hitSet) b.hitSet = new Set();
      for (let j = enemies.length-1; j >= 0; j--) {
        const e = enemies[j];
        if (b.hitSet.has(e)) continue;
        if (Math.hypot(e.x-b.x, e.y-b.y) < b.radius + e.r) {
          b.hitSet.add(e);
          e.hp -= b.damage;
          e.slowTimer = 60; e.slowFactor = 0.5;
          showDamage(e.x, e.y, b.damage, "#66ffff");
          if (e.hp <= 0) killEnemy(j);
        }
      }
    }
    if (b.type === "phoenix" || b.type === "crazydiamond") {
      b.spin = (b.spin || 0) + 0.2;
      if (!b.returning && b.life < 200) b.returning = true;
      if (b.returning) {
        const dx = player.x-b.x, dy = player.y-b.y;
        const d = Math.hypot(dx,dy) || 1;
        b.vx += dx/d * .3; b.vy += dy/d * .3;
        const s = Math.hypot(b.vx, b.vy) || 1;
        b.vx = b.vx/s * 10; b.vy = b.vy/s * 10;
        if (d < 22) { bullets.splice(i,1); continue; }
      }
    }
    if (b.type === "spiral" && b.homing > 0) {
      let nearest = null, bd = Infinity;
      for (const e of enemies) {
        const d = Math.hypot(e.x-b.x, e.y-b.y);
        if (d < bd) { nearest = e; bd = d; }
      }
      if (nearest) {
        const ta = Math.atan2(nearest.y-b.y, nearest.x-b.x);
        const ca = Math.atan2(b.vy, b.vx);
        let da = ta - ca;
        while (da > Math.PI) da -= TAU;
        while (da < -Math.PI) da += TAU;
        const na = ca + da * b.homing;
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(na) * sp;
        b.vy = Math.sin(na) * sp;
      }
    }
    if (b.type === "spiral") {
      b.fuse--;
      if (b.fuse <= 0) {
        const r = b.blastRadius || (85 + level*10);
        shockwaves.push({ x:b.x, y:b.y, radius:8, maxRadius:r, life:20, color:"204,102,255" });
        burst(b.x, b.y, 70, "#cc66ff");
        burst(b.x, b.y, 35, "#ffffff");
        shake(20); flash("#cc66ff", 5); chroma(5);
        for (let j = enemies.length-1; j >= 0; j--) {
          const e = enemies[j];
          if (!e) continue;
          if (Math.hypot(e.x-b.x, e.y-b.y) < r + e.r) {
            e.hp -= 3 + pw("spiral");
            showDamage(e.x, e.y, 3 + pw("spiral"), "#cc66ff");
            if (e.hp <= 0) killEnemy(j);
          }
        }
        bullets.splice(i,1); continue;
      }
    }
    if (b.type === "boomerang") {
      b.spin += .35;
      if (!b.returning) {
        if (b.x < 0 || b.x > W || b.y < 0 || b.y > H || b.life < 250) {
          b.returning = true; b.vx *= -1; b.vy *= -1;
        }
      } else {
        const dx = player.x-b.x, dy = player.y-b.y;
        const d = Math.hypot(dx,dy) || 1;
        b.vx += dx/d * .35; b.vy += dy/d * .35;
        const s = Math.hypot(b.vx, b.vy) || 1;
        b.vx = b.vx/s * 8; b.vy = b.vy/s * 8;
        if (d < 22) { bullets.splice(i,1); continue; }
      }
    }
    if (b.type === "blackhole") {
      updateBlackHole(b);
      if (b.field <= 0) { bullets.splice(i,1); continue; }
    }
    if (b.type === "shotgun") {
      b.traveled += Math.hypot(b.vx, b.vy);
      if (b.traveled >= b.maxRange) { b.damage *= 0.5; b.maxRange = 999; }
    }
    if (b.type === "missile") {
      if (!b.target || b.target.hp <= 0 || !enemies.includes(b.target)) {
        let nearest = null, nd = Infinity;
        for (const e of enemies) {
          const d = Math.hypot(e.x-b.x, e.y-b.y);
          if (d < 300 && d < nd) { nearest = e; nd = d; }
        }
        b.target = nearest;
      }
      if (b.target) {
        const ta = Math.atan2(b.target.y-b.y, b.target.x-b.x);
        const ca = Math.atan2(b.vy, b.vx);
        let da = ta - ca;
        while (da > Math.PI) da -= TAU;
        while (da < -Math.PI) da += TAU;
        const na = ca + da * 0.15;
        b.vx = Math.cos(na) * b.speed;
        b.vy = Math.sin(na) * b.speed;
      }
    }
    if (b.type === "cluster") {
      b.clusterFuse--;
      if (b.clusterFuse <= 0) {
        const n = b.childCount || 6;
        for (let k = 0; k < n; k++) {
          const a = k / n * TAU;
          bullets.push({ x: b.x, y: b.y, vx: Math.cos(a)*8, vy: Math.sin(a)*8, size: 5, damage: 1.5, type: "cluster-child", life: 200, trail: true });
        }
        burst(b.x, b.y, 40, "#ccff33");
        burst(b.x, b.y, 20, "#ffffff");
        shake(15); flash("#ccff33", 4); chroma(6);
        bullets.splice(i,1); continue;
      }
    }
    if (b.type === "flame") b.size *= 0.96;
    if (b.type === "gravity") {
      if (b.travel > 0) { b.travel--; }
      else {
        b.field--;
        for (const e of enemies) {
          if (e.type === "boss") continue;
          const dx = b.x - e.x, dy = b.y - e.y;
          const d = Math.hypot(dx, dy) || 1;
          if (d < b.pullRadius) {
            e.x += dx/d * b.pullForce;
            e.y += dy/d * b.pullForce;
          }
          if (d < 30 + e.r) {
            e.hp -= b.damage;
            if (Math.random() < 0.1) showDamage(e.x, e.y, b.damage, "#8844ff");
          }
        }
        if (b.field <= 0) { bullets.splice(i,1); continue; }
      }
    }
    if (b.type === "spike") {
      if (b.delay > 0) b.delay--;
      else {
        for (let j = enemies.length-1; j >= 0; j--) {
          const e = enemies[j];
          if (!e) continue;
          if (Math.hypot(e.x - b.x, e.y - b.y) < b.size + e.r) {
            e.hp -= b.damage;
            showDamage(e.x, e.y, b.damage, "#aabbbb");
            if (e.hp <= 0) killEnemy(j);

        }
      }
    }
    if (b.life <= 0 || b.x < -100 || b.x > W+100 || b.y < -100 || b.y > H+100) {
      bullets.splice(i,1);
    }
  }
}

function updateEnemies() {
  const isTimeStopped = theWorldTimer > 0 || studyQuizActive || pauseScreen;
  for (let i = enemies.length-1; i >= 0; i--) {
    const e = enemies[i];
    if (!e) { enemies.splice(i,1); continue; }
    if (e.chakramCD > 0) e.chakramCD--;
    if (e._chainsawCD > 0) e._chainsawCD--;
    e.slowTimer = Math.max(0, (e.slowTimer || 0) - 1);
    const slow = e.slowTimer > 0 ? (e.slowFactor || .4) : 1;
    const frozenMult = e.slowTimer > 0 ? 2 : 1;
    if (e.poisonTime > 0) {
      e.poisonTime--;
      e.hp -= e.poisonDPS || 0;
      if (time % 30 === 0) showDamage(e.x, e.y, (e.poisonDPS || 0) * 30, "#88ff44");
      if (e.hp <= 0) { killEnemy(i); continue; }
    }
    if (e.bleedTimer > 0) {
      e.bleedTimer--;
      e.hp -= e.bleedDPS || 0;
      if (time % 30 === 0) showDamage(e.x, e.y, (e.bleedDPS || 0) * 30, "#ff4444");
      if (e.hp <= 0) { killEnemy(i); continue; }
    }
    if (e.floatTime > 0) {
      e.floatTime--;
      e.y += Math.sin(time * 0.2 + e.x) * 0.5;
      e.x += Math.cos(time * 0.15 + e.y) * 0.3;
      if (e.floatTime === 0) burst(e.x, e.y, 15, "#aaddff");
      continue;
    }
    if (!isTimeStopped) {
      if (e.flying) {
        e.x += e.vx; e.y += e.vy;
        e.vx *= .94; e.vy *= .94;
        if (Math.hypot(e.vx, e.vy) < 1) e.flying = false;
      } else {
        if (e.type === "dasher") {
          e.dashTimer--;
          if (e.dashing) {
            e.x += e.dashVx; e.y += e.dashVy;
            e.dashVx *= 0.97; e.dashVy *= 0.97;
            if (Math.abs(e.dashVx) < 0.5 && Math.abs(e.dashVy) < 0.5) {
              e.dashing = false;
              e.dashTimer = 40 + Math.random()*40;
            }
          } else {
            e.y += e.speed * 0.5 * slow;
            if (e.dashTimer <= 0) {
              const a = Math.atan2(player.y - e.y, player.x - e.x);
              e.dashVx = Math.cos(a) * e.speed * 2.5;
              e.dashVy = Math.sin(a) * e.speed * 2.5;
              e.dashing = true;
              burst(e.x, e.y, 10, "#ffaa00");
            }
          }
        } else {
          e.y += e.speed * slow;
        }
        if (e.wave !== undefined) {
          e.wave += .04;
          e.x += Math.sin(e.wave) * e.wavePower;
        }
        if (e.type === "boss") {
          e.bossPhase += 0.02;
          if (e.y > 120) e.y -= e.speed * .5;
          e.x = W/2 + Math.sin(e.bossPhase) * 130;
        }
      }
    }
    if (Math.hypot(player.x-e.x, player.y-e.y) < player.hitR + e.r) {
      damagePlayer(e.type === "heavy" ? 15 : e.type === "boss" ? 25 : e.type === "tank" ? 20 : 8, 55);
      if (e.type !== "boss") {
        burst(e.x, e.y, 35, "#ff3366");
        burst(e.x, e.y, 20, "#ffffff");
        enemies.splice(i,1);
        continue;
      }
    }
    let killed = false;
    for (let j = bullets.length-1; j >= 0; j--) {
      const b = bullets[j];
      if (!b) continue;
      if (b.type === "blackhole" || b.type === "gravity") continue;
      if (b.type === "tornado") continue;
      if (b.type === "sonic") continue;
      if (b.type === "snake") continue;
      if (b.type === "greenfire") continue;
      if (b.type === "mochi" && e.flying) continue;
      if (b.type === "boomerang" && b.hitSet && b.hitSet.has(e)) continue;
      if (b.type === "railgun" && b.hitSet && b.hitSet.has(e)) continue;
      if (b.type === "phoenix" && b.hitSet && b.hitSet.has(e)) continue;
      if (b.type === "crazydiamond" && b.hitSet && b.hitSet.has(e)) continue;
      const d = Math.hypot(e.x-b.x, e.y-b.y);
      if (d >= e.r + b.size) continue;
      let dmg = (b.damage || 1) * frozenMult;
      let consumed = false;
      shake(2);
      for (let k = 0; k < 8 * FX.particleMultiplier; k++) {
        const a = Math.random()*TAU, sp = 3 + Math.random()*5;
        particles.push({ x: b.x, y: b.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 10 + Math.random()*6, color: k % 3 === 0 ? "#ffff00" : (k % 3 === 1 ? "#ffffff" : (b.hue ? `hsl(${b.hue}, 100%, 70%)` : "#ff00ff")), size: 2 + Math.random()*2 });
      }
      if (Math.random() < 0.25) shockwaves.push({ x:b.x, y:b.y, radius:5, maxRadius:22, life:8, color:"255,255,255" });
      if (b.type === "boomerang") { b.hitSet.add(e); e.hp -= dmg; showDamage(e.x, e.y, dmg, "#7cff6b"); }
      else if (b.type === "phoenix") {
        if (!b.hitSet) b.hitSet = new Set();
        b.hitSet.add(e); e.hp -= dmg;
        showDamage(e.x, e.y, dmg, "#ff6600");
      }
      else if (b.type === "crazydiamond") {
        if (!b.hitSet) b.hitSet = new Set();
        b.hitSet.add(e); e.hp -= dmg;
        showDamage(e.x, e.y, dmg, "#66aaff");
      }
      else if (b.type === "oraora") { e.hp -= dmg; showDamage(e.x, e.y, dmg, "#9966ff"); consumed = true; }
      else if (b.type === "starplatinum") { e.hp -= dmg; showBigDamage(e.x, e.y, dmg, "#8844ff"); b.pierce--; if (b.pierce <= 0) consumed = true; }
      else if (b.type === "friendship") { e.hp -= dmg; showBigDamage(e.x, e.y, dmg, "#ff66ff"); b.pierce--; if (b.pierce <= 0) consumed = true; }
      else if (b.type === "heartbreak") { e.hp -= dmg; showBigDamage(e.x, e.y, dmg, "#ff0044"); }
      else if (b.type === "goldexperience") { e.hp -= dmg; e.slowTimer = b.slowDuration || 150; e.slowFactor = 0.3; showDamage(e.x, e.y, dmg, "#ffdd44"); consumed = true; }
      else if (b.type === "goldenwind") { e.hp -= dmg; showDamage(e.x, e.y, dmg, "#ffcc44"); consumed = true; }
      else if (b.type === "mochi") {
        if (e.type !== "boss") {
          const power = b.knockbackPower || 20;
          knockback(e, b.x, b.y, power);
        }
        e.hp -= dmg;
        showDamage(e.x, e.y, dmg, "#fff0c0");
        b.pierce--;
        burst(e.x, e.y, 25, "#fff0c0");
        burst(e.x, e.y, 15, "#ffcc66");
        shake(12);
        if (b.pierce <= 0) consumed = true;
      }
      else if (b.type === "freeze" || b.type === "iceshard") { e.hp -= dmg; e.slowTimer = (b.slowDuration || 90 + level*5); e.slowFactor = Math.max(.12, .42 - level*.02); showDamage(e.x, e.y, dmg, "#a3e8ff"); if (b.type === "freeze") consumed = true; }
      else if (b.type === "poison") { e.hp -= dmg; e.poisonTime = b.poisonTime; e.poisonDPS = b.poisonDPS; showDamage(e.x, e.y, dmg, "#88ff44"); consumed = true; }
      else if (b.type === "crossbow") { e.hp -= dmg; e.bleedTimer = 120; e.bleedDPS = b.bleed || 0.5; showDamage(e.x, e.y, dmg, "#aa6622"); b.pierce--; if (b.pierce <= 0) consumed = true; }
      else if (b.type === "bubble") { e.floatTime = b.floatTime; showDamage(e.x, e.y, "BUBBLE!", "#aaddff"); consumed = true; }
      else if (b.type === "railgun") { if (!b.hitSet) b.hitSet = new Set(); b.hitSet.add(e); e.hp -= dmg; showBigDamage(e.x, e.y, dmg, "#00eeff"); shake(12); flash("#00eeff", 3); chroma(6); hitStopAdd(2); }
      else if (b.type === "vampire") { e.hp -= dmg; showDamage(e.x, e.y, dmg, "#cc0066"); vampireHeal += dmg * (b.stealRatio || 0.3); consumed = true; }
      else if (b.type === "laser" || b.type === "bow") { e.hp -= dmg; showDamage(e.x, e.y, dmg, b.type === "laser" ? "#ff00ff" : "#c8a06a"); if (b.type === "bow") { b.pierce--; if (b.pierce <= 0) consumed = true; } }
      else { e.hp -= dmg; showDamage(e.x, e.y, dmg, "#ffffff"); if (b.pierce) { b.pierce--; if (b.pierce <= 0) consumed = true; } else consumed = true; }
      if (consumed) {
        const idx2 = bullets.indexOf(b);
        if (idx2 >= 0) bullets.splice(idx2, 1);
      }
      if (e.hp <= 0) { killEnemy(i); killed = true; break; }
    }
    if (killed) continue;
    if (!enemies[i]) continue;
    if (e.y > H+60 && e.type !== "boss") { escapeEnemy(i); continue; }
    if (!isTimeStopped && Math.random() < e.shootRate) fireEnemyBullet(e);
  }
}

function fireEnemyBullet(e) {
  const baseAngle = Math.atan2(player.y - e.y, player.x - e.x);
  const speedBase = (2 + difficulty * 0.5) * enemyBulletSpeedScale();
  if (e.type === "boss") {
    const pattern = Math.floor(e.bossPhase * 3) % 3;
    if (pattern === 0) {
      for (let k = 0; k < 6; k++) {
        const a = baseAngle + (k - 2.5) * 0.22;
        const s = (3.2 + difficulty * 0.3) * enemyBulletSpeedScale();
        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 6, hue: 0 });
      }
    } else if (pattern === 1) {
      const offset = time * 0.1;
      for (let k = 0; k < 8; k++) {
        const a = k / 8 * TAU + offset;
        const s = (2.8 + difficulty * 0.3) * enemyBulletSpeedScale();
        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 5, hue: 300 });
      }
    } else {
      for (let layer = 0; layer < 2; layer++) {
        const a = baseAngle + layer * 0.4 - 0.2;
        const s = (3.5 + difficulty * 0.4 + layer * 0.4) * enemyBulletSpeedScale();
        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 7, hue: 30 });
      }
    }
    return;
  }
  if (e.type === "heavy") {
    for (let k = 0; k < 2; k++) {
      const a = baseAngle + (k - 0.5) * 0.24;
      const s = (2.8 + difficulty * 0.3) * enemyBulletSpeedScale();
      enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 6, hue: 30 });
    }
    return;
  }
  if (e.type === "tank") {
    const offset = time * 0.03;
    for (let k = 0; k < 4; k++) {
      const a = k / 4 * TAU + offset;
      const s = (2.0 + difficulty * 0.25) * enemyBulletSpeedScale();
      enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 7, hue: 270 });
    }
    return;
  }
  if (e.type === "shooter") {
    e.burstCooldown = (e.burstCooldown || 0) + 1;
    if (e.burstCooldown % 7 === 0) {
      const offset = time * 0.05;
      for (let k = 0; k < 6; k++) {
        const a = k / 6 * TAU + offset;
        const s = (2.2 + difficulty * 0.3) * enemyBulletSpeedScale();
        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 5, hue: 200 });
      }
    } else if (e.burstCooldown % 3 === 0) {
      const a = baseAngle;
      const s = (3.2 + difficulty * 0.4) * enemyBulletSpeedScale();
      enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 5, hue: 200 });
    }
    return;
  }
  if (e.type === "splitter") {
    const offset = Math.random() * TAU;
    for (let k = 0; k < 3; k++) {
      const a = k / 3 * TAU + offset;
      const s = (2.3 + difficulty * 0.25) * enemyBulletSpeedScale();
      enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 5, hue: 330 });
    }
    return;
  }
  const a = baseAngle;
  const s = speedBase + 0.5;
  enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, r: 4, hue: 30 });
}

function updateEnemyBullets() {
  const isTimeStopped = theWorldTimer > 0 || studyQuizActive || pauseScreen;
  if (isTimeStopped) return;
  for (let i = enemyBullets.length-1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx; b.y += b.vy;
    if (Math.hypot(player.x-b.x, player.y-b.y) < player.hitR + b.r) {
      enemyBullets.splice(i,1);
      damagePlayer(1, 40);
      continue;
    }
    if (b.x < -200 || b.x > W+200 || b.y < -200 || b.y > H+200) enemyBullets.splice(i,1);
  }
}

function updatePowerups() {
  for (let i = powerups.length-1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.vy; p.bob += 0.1; p.life--;
    if (Math.hypot(player.x-p.x, player.y-p.y) < player.hitR + p.r) {
      collectPowerup(p);
      powerups.splice(i,1);
      continue;
    }
    if (p.life <= 0 || p.y > H+40) powerups.splice(i,1);
  }
}

function updateEffects() {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= .97; p.vy *= .97; p.life--;
    if (p.life <= 0) particles.splice(i,1);
  }
  for (let i = shockwaves.length-1; i >= 0; i--) {
    const s = shockwaves[i];
    s.radius += (s.maxRadius - s.radius) * .3;
    s.life--;
    if (s.life <= 0) shockwaves.splice(i,1);
  }
  for (let i = lightningBolts.length-1; i >= 0; i--) {
    lightningBolts[i].life--;
    if (lightningBolts[i].life <= 0) lightningBolts.splice(i,1);
  }
  if (powerUpFlash) { powerUpFlash.timer--; if (powerUpFlash.timer <= 0) powerUpFlash = null; }
  if (shopMessage) { shopMessage.timer--; if (shopMessage.timer <= 0) shopMessage = null; }
  if (abortPopup) { abortPopup.timer--; if (abortPopup.timer <= 0) abortPopup = null; }
  for (let i = damageNumbers.length-1; i >= 0; i--) {
    const d = damageNumbers[i];
    d.y += d.vy; d.vy *= 0.96; d.life--;
    if (d.life <= 0) damageNumbers.splice(i,1);
  }
  if (zoomPulse > 1) zoomPulse = 1 + (zoomPulse - 1) * 0.9;
  if (zoomPulse < 1.005) zoomPulse = 1;
}

function update() {
  updateStars();
  updateSpecial();
  updateSpecials();
  updateJoJoWeapons();
  updateUndertaleWeapons();

  if (pauseScreen || settingsScreen) return;

  if (studyMode && !titleScreen && !weaponMenu && !specialMenu && !shopScreen && !gameOver && !missionScreen && !challengeScreen && !studySelectScreen) {
    if (studyQuizActive) {
      studyQuizTimeLeft--;
      if (studyQuizTimeLeft <= 0) {
        flash("#ff6666", 8);
        showDamage(player.x, player.y - 60, "時間切れ…", "#ff6666");
        studyQuizActive = false;
        studyQuiz = null;
        studyTimer = studyTimerMax;
      }
    } else {
      studyTimer--;
      if (studyTimer <= 0) startStudyQuiz();
    }
  }

  const constantWobble = FX.constantShake + (bossActive ? 0.8 : 0) + (combo > 20 ? 0.4 : 0);
  shakeX = (Math.random()-.5) * (screenShake * 2 + constantWobble);
  shakeY = (Math.random()-.5) * (screenShake * 2 + constantWobble);
  if (screenShake > 0.3) screenShake *= 0.85;
  else screenShake = 0;
  if (flashScreen > 0) flashScreen--;
  if (chromaOffset > 0) chromaOffset *= 0.88;
  if (hitStop > 0) { hitStop--; return; }
  if (titleScreen || weaponMenu || specialMenu || shopScreen || gameOver || missionScreen || challengeScreen || studySelectScreen) return;
  if (specialActive > 0) return;
  if (studyQuizActive) return;

  time++;
  rainbowHue = (rainbowHue + 3) % 360;
  difficulty = Math.min(3, 1 + time / 1500);
  bgTint = (Math.sin(time * 0.02) * 30 * FX.bgMultiplier + combo * 3 * FX.bgMultiplier) % 360;
  if (player.hp / player.maxHp < 0.3) dangerTint = Math.min(1, dangerTint + 0.05);
  else dangerTint = Math.max(0, dangerTint - 0.02);
  beatPulse = (Math.sin(time * 0.15) + 1) * 0.5;
  waveTimer++;
  if (waveTimer >= WAVE_DURATION) {
    waveTimer = 0;
    wave++;
    if (wave > missionSession.maxWave) missionSession.maxWave = wave;
    let bossWave;
    if (studyMode) bossWave = (wave === 2);
    else if (quickMode) bossWave = (wave === 2);
    else bossWave = (wave % 3 === 0);
    if (bossWave && !bossActive) spawnBoss();
    else { showDamage(W/2, 200, `WAVE ${wave}`, "#00ffcc"); shake(15); flash("#00ffcc", 4); }
  }
  if (comboTimer > 0) { comboTimer--; if (comboTimer === 0) combo = 0; }
  if (combo > missionSession.maxCombo) missionSession.maxCombo = combo;
  if (player.invincible > 0) player.invincible--;
  if (vampireHeal > 0) {
    const heal = Math.min(vampireHeal, 0.5);
    player.hp = Math.min(player.maxHp, player.hp + heal);
    vampireHeal -= heal;
  }
  updatePlayer();

  const weaponCount = Math.max(1, activeWeapons.length);
  const weaponMultiplier = 1 + (weaponCount - 1) * 0.6;
  const levelSpawnBonus = Math.min(0.30, (level - 1) * 0.008);
  let spawnRate = Math.min(.60, (.012 + difficulty*.008 + (level-1)*0.006 + levelSpawnBonus) * weaponMultiplier);
  if (challengeEnemyRush) spawnRate *= 2;
  spawnRate = Math.min(.90, spawnRate);
  if (Math.random() < spawnRate) spawnEnemy();
  if (Math.random() < spawnRate * 0.7) spawnEnemy();
  if (level > 4 && Math.random() < (level - 4) * 0.006 * weaponMultiplier) spawnEnemy();
  if (level > 8 && Math.random() < (level - 8) * 0.008 * weaponMultiplier) { spawnEnemy(); spawnEnemy(); }
  let minEnemies = Math.min(60, 8 + Math.floor(level * 1.2 * weaponMultiplier));
  if (challengeEnemyRush) minEnemies *= 2;
  if (enemies.length < minEnemies && Math.random() < 0.15) spawnEnemy();

  shoot();
  updateTurrets();
  updateMines();
  updateBullets();
  updateEnemies();
  updateEnemyBullets();
  updatePowerups();
  updateEffects();

  if (score > highScore) highScore = score;
}

/* ===== 描画 ===== */
function drawPlayer() {
  if (determinationActive > 0) {
    ctx.save();
    ctx.shadowBlur = 40; ctx.shadowColor = "#ff0000";
    ctx.strokeStyle = "#ff0000"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.drawR + 8 + Math.sin(time*0.3)*3, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
  if (kingCrimsonTimer > 0) {
    ctx.save();
    ctx.shadowBlur = 40; ctx.shadowColor = "#cc0044";
    ctx.strokeStyle = "#cc0044"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.drawR + 12 + Math.sin(time*0.4)*4, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
  if (gerTimer > 0) {
    ctx.save();
    ctx.shadowBlur = 50; ctx.shadowColor = "#ffdd00";
    ctx.strokeStyle = "#ffdd00"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.drawR + 14 + Math.sin(time*0.5)*5, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
  if (theWorldTimer > 0) {
    ctx.save();
    ctx.shadowBlur = 50; ctx.shadowColor = "#ffee00";
    ctx.strokeStyle = "#ffee00"; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.drawR + 16 + Math.sin(time*0.6)*5, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
  for (const a of afterImages) {
    ctx.save();
    ctx.globalAlpha = (a.life / a.maxLife) * 0.6;
    ctx.shadowBlur = 20; ctx.shadowColor = getPlayerColor();
    ctx.fillStyle = getPlayerColor();
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.r, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  if (player.invincible > 0 && Math.floor(time/4) % 2) return;
  ctx.save();
  const pcol = getPlayerColor();
  ctx.shadowBlur = 30; ctx.shadowColor = pcol;
  ctx.fillStyle = hexToRgba(pcol, 0.4);
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.drawR + 4, 0, TAU);
  ctx.fill();
  ctx.fillStyle = pcol;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.drawR, 0, TAU);
  ctx.fill();
  ctx.shadowBlur = 25; ctx.shadowColor = "#ffffff";
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.drawR * 0.4, 0, TAU);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(255,255,255,.5)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.hitR, 0, TAU);
  ctx.stroke();
  ctx.restore();
}
function drawKnifeAim() {
  if (selectedWeapon !== "knife" && selectedWeapon !== "sword") return;
  const a = selectedWeapon === "sword" ? swordAngle : knifeAngle;
  const col = selectedWeapon === "sword" ? "#ffffff" : "#ff5566";
  const x = player.x + Math.cos(a)*30;
  const y = player.y + Math.sin(a)*30;
  ctx.save();
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.shadowBlur = 15; ctx.shadowColor = col;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(x, y); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fill();
  if (selectedWeapon === "sword") {
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.arc(player.x, player.y, 80 + level*2 + pw("sword")*15, a - Math.PI/3, a + Math.PI/3);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawFist(x, y, angle, col, outlineCol, scale) {
  scale = scale || 1;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);
  ctx.fillStyle = col;
  ctx.strokeStyle = outlineCol;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(0, 0, 12, 9, 0, 0, TAU);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(-6, -3, 3, 0, TAU);
  ctx.arc(-2, -5, 3.2, 0, TAU);
  ctx.arc(2, -5, 3.2, 0, TAU);
  ctx.arc(6, -3, 3, 0, TAU);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(7, 4, 4, 3, -0.4, 0, TAU);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = "rgba(0,0,0,.2)";
  ctx.beginPath();
  ctx.ellipse(-2, 3, 8, 3, 0, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function drawBullet(b) {
  if (b.type === "piano") {
    ctx.save();
    ctx.shadowBlur = 15; ctx.shadowColor = "#ffffff";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";
    ctx.fillText(b.note, b.x, b.y);
    ctx.restore();
    ctx.textAlign = "left";
    return;
  }
  if (b.type === "heartbreak") {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.spin = (b.spin || 0) + 0.1);
    ctx.shadowBlur = 30; ctx.shadowColor = "#ff0044";
    ctx.fillStyle = "#ff0044";
    ctx.beginPath();
    ctx.moveTo(0, 5);
    ctx.bezierCurveTo(-15, -8, -10, -20, 0, -10);
    ctx.bezierCurveTo(10, -20, 15, -8, 0, 5);
    ctx.fill();
    ctx.restore();
    return;
  }
  if (b.type === "greenfire") {
    ctx.save();
    ctx.shadowBlur = 30; ctx.shadowColor = "#44ff44";
    ctx.fillStyle = "#44ff44";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size + Math.sin(time * 0.3) * 2, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size * 0.4, 0, TAU); ctx.fill();
    ctx.restore();
    return;
  }
  if (b.type === "snake") {
    ctx.save();
    ctx.shadowBlur = 15; ctx.shadowColor = "#44ff44";
    ctx.fillStyle = "#88ff88";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, TAU); ctx.fill();
    ctx.restore();
    return;
  }
  if (b.type === "tornado") {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.spin || 0);
    ctx.shadowBlur = 25; ctx.shadowColor = "#ccccff";
    ctx.strokeStyle = "#ccccff"; ctx.lineWidth = 3;
    for (let k = 0; k < 4; k++) {
      ctx.globalAlpha = 0.7 - k * 0.15;
      ctx.beginPath(); ctx.arc(0, 0, b.size - k * 4, 0, TAU); ctx.stroke();
    }
    ctx.restore();
    return;
  }
  if (b.type === "oraora") {
    ctx.save();
    ctx.shadowBlur = 30; ctx.shadowColor = "#9966ff";
    drawFist(b.x, b.y, Math.atan2(b.vy, b.vx) + Math.PI/2, "#9966ff", "#ffffff", 1);
    ctx.restore();
    return;
  }
  ctx.save();
  if (b.type === "knife") {
    ctx.translate(b.x, b.y);
    ctx.rotate(b.angle + Math.PI/2);
    ctx.shadowBlur = 15; ctx.shadowColor = "#ff5566";
    ctx.fillStyle = "#eef8ff";
    ctx.beginPath();
    ctx.moveTo(0, -18); ctx.lineTo(4, 6); ctx.lineTo(0, 10);
    ctx.lineTo(-4, 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ff5566"; ctx.fillRect(-2, 10, 4, 9);
  } else if (b.type === "friendship") {
    ctx.translate(b.x, b.y);
    ctx.rotate(b.spin = (b.spin || 0) + 0.4);
    ctx.shadowBlur = 25; ctx.shadowColor = "#ff66ff";
    ctx.fillStyle = "#ffaaff";
    ctx.beginPath();
    ctx.moveTo(0, -18); ctx.lineTo(6, 4); ctx.lineTo(0, 8);
    ctx.lineTo(-6, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ff00ff";
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.fill();
  } else if (b.type === "mochi") {
    ctx.shadowBlur = 40; ctx.shadowColor = "#fff2d9";
    ctx.fillStyle = "#fff6e5";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#d2a05a"; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.beginPath(); ctx.arc(b.x - b.size*0.35, b.y - b.size*0.35, b.size*0.25, 0, TAU); ctx.fill();
  } else if (b.type === "boomerang" || b.type === "phoenix" || b.type === "crazydiamond") {
    ctx.translate(b.x, b.y); ctx.rotate(b.spin);
    ctx.shadowBlur = 25;
    ctx.shadowColor = b.type === "phoenix" ? "#ff6600" : b.type === "crazydiamond" ? "#66aaff" : "#7cff6b";
    ctx.strokeStyle = b.type === "phoenix" ? "#ff6600" : b.type === "crazydiamond" ? "#66aaff" : "#7cff6b";
    ctx.lineWidth = 7; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-16, 12); ctx.lineTo(0, -14); ctx.lineTo(16, 12); ctx.stroke();
  } else if (b.type === "blackhole") {
    if (b.travel <= 0) {
      const grad = ctx.createRadialGradient(b.x, b.y, b.coreRadius, b.x, b.y, b.pullRadius);
      grad.addColorStop(0, "rgba(155, 89, 255, .6)");
      grad.addColorStop(1, "rgba(155, 89, 255, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.pullRadius, 0, TAU); ctx.fill();
    }
    ctx.shadowBlur = 40; ctx.shadowColor = "#9b59ff";
    ctx.fillStyle = "#090014";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.coreRadius || 18, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#9b59ff"; ctx.lineWidth = 3;
    const ringR = (b.coreRadius || 18) + 10 + Math.sin(b.pulse * 0.3) * 5;
    ctx.beginPath(); ctx.arc(b.x, b.y, ringR, 0, TAU); ctx.stroke();
  } else if (b.type === "laser") {
    ctx.shadowBlur = 50; ctx.shadowColor = "#ff00ff";
    ctx.fillStyle = "rgba(255, 0, 255, .9)";
    ctx.fillRect(b.x - b.size, 0, b.size*2, b.y);
    ctx.fillStyle = "#fff";
    ctx.fillRect(b.x - b.size/2, 0, b.size, b.y);
  } else if (b.type === "railgun") {
    ctx.shadowBlur = 50; ctx.shadowColor = "#00eeff";
    ctx.strokeStyle = "#00eeff"; ctx.lineWidth = 7; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 3, b.y - b.vy * 3);
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, TAU); ctx.fill();
  } else if (b.type === "missile" || b.type === "swarm") {
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI/2);
    ctx.shadowBlur = 20;
    ctx.shadowColor = b.type === "swarm" ? "#ffcc00" : "#ffaa22";
    ctx.fillStyle = b.type === "swarm" ? "#ffcc00" : "#ffaa22";
    ctx.beginPath();
    ctx.moveTo(0, -12); ctx.lineTo(6, 7); ctx.lineTo(0, 4); ctx.lineTo(-6, 7);
    ctx.closePath(); ctx.fill();
  } else if (b.type === "flame" || b.type === "dragon") {
    ctx.globalAlpha = 0.8;
    ctx.shadowBlur = 25;
    ctx.shadowColor = b.type === "dragon" ? "#ff4400" : "#ff8822";
    ctx.fillStyle = Math.random() < 0.5 ? (b.type === "dragon" ? "#ff4400" : "#ff8822") : "#ffcc44";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, TAU); ctx.fill();
  } else if (b.type === "grenade") {
    ctx.shadowBlur = 15; ctx.shadowColor = "#666633";
    ctx.fillStyle = "#666633";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ffff00";
    ctx.beginPath(); ctx.arc(b.x - 3, b.y - 3, 3, 0, TAU); ctx.fill();
  } else if (b.type === "gravity") {
    if (b.travel <= 0) {
      const grad = ctx.createRadialGradient(b.x, b.y, 20, b.x, b.y, b.pullRadius);
      grad.addColorStop(0, "rgba(136, 68, 255, .6)");
      grad.addColorStop(1, "rgba(136, 68, 255, 0)");
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.pullRadius, 0, TAU); ctx.fill();
    }
    ctx.shadowBlur = 30; ctx.shadowColor = "#8844ff";
    ctx.fillStyle = "#8844ff";
    ctx.beginPath(); ctx.arc(b.x, b.y, 14, 0, TAU); ctx.fill();
  } else if (b.type === "cluster") {
    ctx.shadowBlur = 20; ctx.shadowColor = "#ccff33";
    ctx.fillStyle = "#ccff33";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, TAU); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
  } else if (b.type === "cluster-child") {
    ctx.shadowBlur = 15; ctx.shadowColor = "#ccff33";
    ctx.fillStyle = "#e6ff77";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, TAU); ctx.fill();
  } else if (b.type === "iceshard") {
    ctx.shadowBlur = 20; ctx.shadowColor = "#ccefff";
    ctx.fillStyle = "#e6f7ff";
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.atan2(b.vy, b.vx));
    ctx.beginPath();
    ctx.moveTo(10, 0); ctx.lineTo(-5, 5); ctx.lineTo(-5, -5); ctx.closePath();
    ctx.fill();
  } else if (b.type === "poison") {
    ctx.shadowBlur = 25; ctx.shadowColor = "#88ff44";
    ctx.fillStyle = "#88ff44";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, TAU); ctx.fill();
  } else if (b.type === "bow" || b.type === "crossbow") {
    const col = b.type === "bow" ? "#c8a06a" : "#aa6622";
    ctx.shadowBlur = 20; ctx.shadowColor = col;
    ctx.strokeStyle = col; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(b.x - b.vx*0.5, b.y - b.vy*0.5);
    ctx.lineTo(b.x + b.vx*0.3, b.y + b.vy*0.3);
    ctx.stroke();
  } else if (b.type === "bubble") {
    ctx.shadowBlur = 25; ctx.shadowColor = "#aaddff";
    ctx.strokeStyle = "#aaddff"; ctx.lineWidth = 4;
    ctx.fillStyle = "rgba(170, 221, 255, .4)";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, TAU); ctx.fill();
    ctx.stroke();
  } else if (b.type === "spike") {
    if (b.delay > 0) {
      ctx.globalAlpha = 0.6;
      ctx.strokeStyle = "#aabbbb"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.size + b.delay*3, 0, TAU); ctx.stroke();
    } else {
      ctx.shadowBlur = 25; ctx.shadowColor = "#aabbbb";
      ctx.fillStyle = "#aabbbb";
      ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, TAU); ctx.fill();
    }
  } else if (b.type === "sonic") {
    ctx.shadowBlur = 40; ctx.shadowColor = "#66ffff";
    ctx.strokeStyle = "#66ffff"; ctx.lineWidth = 4;
    ctx.globalAlpha = 0.8;
    for (let k = 0; k < 3; k++) {
      ctx.beginPath(); ctx.arc(b.x, b.y, b.radius + k * 15, 0, TAU); ctx.stroke();
    }
  } else if (b.type === "umbrella" || b.type === "goldenwind") {
    const col = b.type === "umbrella" ? "#ff88cc" : "#ffcc44";
    ctx.shadowBlur = 25; ctx.shadowColor = col;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, TAU); ctx.fill();
  } else if (b.type === "starplatinum") {
    ctx.shadowBlur = 30; ctx.shadowColor = "#8844ff";
    ctx.strokeStyle = "#8844ff"; ctx.lineWidth = 6; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 2, b.y - b.vy * 2);
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, TAU); ctx.fill();
  } else if (b.type === "goldexperience") {
    ctx.shadowBlur = 25; ctx.shadowColor = "#ffdd44";
    ctx.fillStyle = "#ffdd44";
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, TAU); ctx.fill();
  } else {
    const c = b.type === "freeze" ? "#a3e8ff"
            : b.type === "shotgun" ? "#ff6644"
            : b.type === "vampire" ? "#cc0066"
            : `hsl(${(b.hue || 180)},100%,65%)`;
    ctx.shadowBlur = 25; ctx.shadowColor = c;
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size || 4, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.beginPath(); ctx.arc(b.x, b.y, (b.size || 4) * 0.5, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function drawEnemies() {

  }
  ctx.fillStyle = tabSpecialActive ? "#ffcc00" : "#665533";
  ctx.font = "bold 13px Arial";
  ctx.fillText("⚡ 必殺", SHOP_TAB_SPECIAL_X + SHOP_TAB_W/2, SHOP_TAB_Y + 23);
  const tabUpgradeActive = shopTab === "upgrade";
  ctx.shadowBlur = tabUpgradeActive ? 20 : 8;
  ctx.shadowColor = "#88ff88";
  ctx.strokeStyle = tabUpgradeActive ? "#88ff88" : "#446644";
  ctx.lineWidth = tabUpgradeActive ? 3 : 2;
  ctx.strokeRect(SHOP_TAB_UPGRADE_X, SHOP_TAB_Y, SHOP_TAB_W, SHOP_TAB_H);
  if (tabUpgradeActive) {

    ctx.fillRect(SHOP_TAB_UPGRADE_X, SHOP_TAB_Y, SHOP_TAB_W, SHOP_TAB_H);
  }

  ctx.font = "bold 13px Arial";
  ctx.fillText("💪 強化", SHOP_TAB_UPGRADE_X + SHOP_TAB_W/2, SHOP_TAB_Y + 23);
  const tabCosmeticActive = shopTab === "cosmetic";
  ctx.shadowBlur = tabCosmeticActive ? 20 : 8;
  ctx.shadowColor = "#ff88cc";
  ctx.strokeStyle = tabCosmeticActive ? "#ff88cc" : "#664455";
  ctx.lineWidth = tabCosmeticActive ? 3 : 2;
  ctx.strokeRect(SHOP_TAB_COSMETIC_X, SHOP_TAB_Y, SHOP_TAB_W, SHOP_TAB_H);
  if (tabCosmeticActive) {
    ctx.fillStyle = "rgba(255, 136, 204, .15)";
    ctx.fillRect(SHOP_TAB_COSMETIC_X, SHOP_TAB_Y, SHOP_TAB_W, SHOP_TAB_H);
  }
  ctx.fillStyle = tabCosmeticActive ? "#ff88cc" : "#664455";
  ctx.font = "bold 13px Arial";
  ctx.fillText("🎨 見た目", SHOP_TAB_COSMETIC_X + SHOP_TAB_W/2, SHOP_TAB_Y + 23);
  if (shopMessage) {
    ctx.fillStyle = shopMessage.color;
    ctx.font = "bold 12px Arial";
    ctx.shadowBlur = 15; ctx.shadowColor = shopMessage.color;
    ctx.fillText(shopMessage.text, W/2, SHOP_TAB_Y + SHOP_TAB_H + 16);
  }
  ctx.save();
  const listY = SHOP_TAB_Y + SHOP_TAB_H + 20;
  ctx.beginPath(); ctx.rect(0, listY, W, H - listY - 70); ctx.clip();
  const list = shopTab === "weapon" ? getShopWeapons() : shopTab === "special" ? getShopSpecials() : shopTab === "upgrade" ? UPGRADE_ORDER : getShopCosmetics();
  const srcData = shopTab === "weapon" ? weapons : shopTab === "special" ? specials : shopTab === "upgrade" ? UPGRADES : cosmetics;
  for (let i = 0; i < list.length; i++) {
    const key = list[i];
    const w = srcData[key];
    const y = listY + i*(MENU_ITEM_HEIGHT+MENU_GAP) - shopScrollY;
    if (y + MENU_ITEM_HEIGHT < listY || y > H - 70) continue;
    let owned, price, canAfford, equipped, maxed;
    if (shopTab === "upgrade") {
      const lv = getUpgradeLevel(key);
      maxed = isUpgradeMaxed(key);
      owned = lv > 0;
      price = maxed ? 0 : getUpgradePrice(key);
      canAfford = saveData.coins >= price;
      equipped = false;
    } else {
      owned = shopTab === "weapon" ? ownsWeapon(key) : shopTab === "special" ? ownsSpecial(key) : ownsCosmetic(key);
      price = shopTab === "weapon" ? getWeaponPrice(key) : shopTab === "special" ? getSpecialPrice(key) : getCosmeticPrice(key);
      canAfford = saveData.coins >= price;
      equipped = shopTab === "cosmetic" && owned &&
        ((w.kind === "theme" && saveData.equippedTheme === key) || (w.kind === "color" && saveData.equippedColor === key));
      maxed = false;
    }
    let borderColor = w.color;
    let borderW = 2;
    if (equipped) { borderColor = "#ffd700"; borderW = 4; }
    else if (maxed) { borderColor = "#ffd700"; borderW = 3; }
    else if (owned && shopTab !== "upgrade") { borderColor = "#88ff88"; borderW = 3; }
    else if (owned && shopTab === "upgrade") { borderColor = w.color; borderW = 3; }
    else if (canAfford) { borderColor = "#ffd700"; borderW = 3; }
    else { borderColor = "#555"; borderW = 2; }
    ctx.shadowBlur = (owned || maxed) ? 20 : (canAfford ? 15 : 5);
    ctx.shadowColor = borderColor;
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = borderW;
    ctx.strokeRect(MENU_MARGIN, y, MENU_WIDTH, MENU_ITEM_HEIGHT);
    if (owned || maxed) {
      ctx.fillStyle = "rgba(136, 255, 136, .1)";
      ctx.fillRect(MENU_MARGIN, y, MENU_WIDTH, MENU_ITEM_HEIGHT);
    }
    ctx.shadowBlur = 0;
    ctx.textAlign = "left";
    ctx.fillStyle = (owned && shopTab !== "upgrade") ? "#88ff88" : "#fff";
    if (shopTab === "upgrade" && owned) ctx.fillStyle = "#88ff88";
    ctx.font = "bold 14px Arial";
    ctx.fillText(w.name, MENU_MARGIN + 16, y + 24);
    ctx.fillStyle = "rgba(255,255,255,.6)";
    ctx.font = "11px Arial";
    ctx.fillText(w.description, MENU_MARGIN + 16, y + 46);
    if (shopTab === "upgrade") {
      const lv = getUpgradeLevel(key);
      ctx.fillStyle = w.color;
      ctx.font = "bold 11px Arial";
      ctx.fillText(`Lv ${lv} / ${w.maxLevel}`, MENU_MARGIN + 16, y + 62);
    }
    ctx.textAlign = "right";
    if (shopTab === "upgrade") {
      if (maxed) {
        ctx.fillStyle = "#ffd700";
        ctx.font = "bold 15px Arial";
        ctx.shadowBlur = 15; ctx.shadowColor = "#ffd700";
        ctx.fillText("★ MAX", MENU_MARGIN + MENU_WIDTH - 12, y + 40);
      } else {
        ctx.fillStyle = canAfford ? "#ffd700" : "#888";
        ctx.font = "bold 15px Arial";
        ctx.shadowBlur = canAfford ? 12 : 0;
        ctx.shadowColor = "#ffd700";
        ctx.fillText(`🪙 ${price}`, MENU_MARGIN + MENU_WIDTH - 12, y + 40);
      }
    } else if (shopTab === "cosmetic" && owned) {
      ctx.fillStyle = equipped ? "#ffd700" : "#88ff88";
      ctx.font = "bold 14px Arial";
      ctx.shadowBlur = 15; ctx.shadowColor = ctx.fillStyle;
      ctx.fillText(equipped ? "★ 装備中" : "装備する▶", MENU_MARGIN + MENU_WIDTH - 12, y + 40);
    } else if (owned) {
      ctx.fillStyle = "#88ff88";
      ctx.font = "bold 16px Arial";
      ctx.shadowBlur = 15; ctx.shadowColor = "#88ff88";
      ctx.fillText("✓ OWNED", MENU_MARGIN + MENU_WIDTH - 12, y + 40);
    } else {
      ctx.fillStyle = canAfford ? "#ffd700" : "#888";
      ctx.font = "bold 15px Arial";
      ctx.shadowBlur = canAfford ? 12 : 0;
      ctx.shadowColor = "#ffd700";
      ctx.fillText(`🪙 ${price}`, MENU_MARGIN + MENU_WIDTH - 12, y + 40);
    }
    ctx.shadowBlur = 0;
    ctx.textAlign = "left";
  }
  ctx.restore();
  const backBtnY = H - 45;
  const backBtnW = 200;
  const backBtnX = (W - backBtnW) / 2;
  ctx.shadowBlur = 20; ctx.shadowColor = "#00ffcc";
  ctx.strokeStyle = "#00ffcc"; ctx.lineWidth = 3;
  ctx.strokeRect(backBtnX, backBtnY - 22, backBtnW, 44);
  ctx.fillStyle = "rgba(0, 255, 204, .15)";
  ctx.fillRect(backBtnX, backBtnY - 22, backBtnW, 44);
  ctx.fillStyle = "#00ffcc";
  ctx.font = "bold 18px Arial";
  ctx.textAlign = "center";
  ctx.fillText("◀ 戻る", W/2, backBtnY + 7);
  ctx.textAlign = "left";
}

function drawMissionScreen() {
  ctx.fillStyle = "rgba(0,0,8,.95)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = "#88ff88";
  ctx.font = "bold 24px Arial";
  ctx.shadowBlur = 20; ctx.shadowColor = "#88ff88";
  ctx.fillText("📅 デイリーミッション", W/2, 42);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 12px Arial";
  ctx.shadowBlur = 0;
  ctx.fillText(`今日: ${todayStr()}`, W/2, 62);
  ctx.fillStyle = "#ffcc00";
  ctx.fillText("毎日0時に更新", W/2, 80);
  const listY = 120;
  for (let i = 0; i < dailyMissions.length; i++) {
    const m = dailyMissions[i];
    const y = listY + i * 150;
    const complete = isMissionComplete(m);
    const progress = missionProgress[m.stat] || 0;
    const target = m.target;
    const progressRatio = Math.min(1, progress / target);
    let borderColor = "#555";
    if (m.claimed) borderColor = "#888";
    else if (complete) borderColor = "#ffd700";
    else if (progress > 0) borderColor = "#88ff88";
    ctx.shadowBlur = complete && !m.claimed ? 25 : 10;
    ctx.shadowColor = borderColor;
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 3;
    ctx.strokeRect(MENU_MARGIN, y, MENU_WIDTH, 130);
    ctx.shadowBlur = 0;
    if (m.claimed) {
      ctx.fillStyle = "rgba(136,136,136,.15)";
      ctx.fillRect(MENU_MARGIN, y, MENU_WIDTH, 130);
    } else if (complete) {
      ctx.fillStyle = "rgba(255,215,0,.10)";
      ctx.fillRect(MENU_MARGIN, y, MENU_WIDTH, 130);
    }
    ctx.textAlign = "left";
    ctx.fillStyle = m.claimed ? "#888" : "#fff";
    ctx.font = "bold 15px Arial";
    ctx.fillText(m.name, MENU_MARGIN + 16, y + 28);
    ctx.fillStyle = "#222";
    ctx.fillRect(MENU_MARGIN + 16, y + 48, MENU_WIDTH - 32, 12);
    ctx.fillStyle = m.claimed ? "#666" : (complete ? "#ffd700" : "#88ff88");
    ctx.shadowBlur = 8; ctx.shadowColor = ctx.fillStyle;
    ctx.fillRect(MENU_MARGIN + 16, y + 48, (MENU_WIDTH - 32) * progressRatio, 12);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1;
    ctx.strokeRect(MENU_MARGIN + 16, y + 48, MENU_WIDTH - 32, 12);
    ctx.fillStyle = "#fff";

  const colors = ["#00ffcc", "#99ff66", "#ffcc00", "#ff8844", "#ff3366", "#ff00ff", "#00ffff", "#ffffff", "#ff00ff"];
  for (let i = 0; i < milestones.length; i++) {
    const m = milestones[i];
    if (combo === m && !comboMilestones[m]) {
      comboMilestones[m] = true;
      sfx.combo();
      const col = colors[i];
      shake(25); flash(col, 8); chroma(12); hitStopAdd(4);
      burst(player.x, player.y, 60, col);

  drawPauseButton();

  if (studyQuizActive) drawStudyQuiz();

  if (flashScreen > 0 && FX.flashMultiplier > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, flashScreen / 10) * 0.7 * FX.flashMultiplier;
    ctx.fillStyle = flashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  if (chromaOffset > 0.5 && FX.chromaMultiplier > 0) {
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    ctx.globalAlpha = Math.min(0.4, chromaOffset / 30) * FX.chromaMultiplier;
    ctx.fillStyle = `hsl(${(time * 10) % 360}, 100%, 50%)`;
    ctx.fillRect(-chromaOffset, -chromaOffset, W, H);
    ctx.fillStyle = `hsl(${(time * 10 + 180) % 360}, 100%, 50%)`;
    ctx.fillRect(chromaOffset, chromaOffset, W, H);
    ctx.restore();
  }
}

window.addEventListener("keydown", e => {

});

checkDailyMissions();

}

 {n:"ノーマル",d:"バランス型",c:"#00ffcc",cd:10,spd:11,sp:.12,r:4,dmg:l=>Math.max(3,7-l),cnt:l=>l},

 {n:"ラピッド",d:"超高速連射",c:"#66ccff",cd:5,spd:13,sp:.05,r:3,dmg:l=>2,cnt:l=>l>2?2:1},

function cleanup(){clr();try{S.conn&&S.conn.close()}catch(e){}try{S.peer&&S.peer.destroy()}catch(e){}S.conn=S.peer=null}

}
function join(){
  const c=(prompt("相手から聞いた部屋コードを入力")||"").trim().toUpperCase();
  if(!c)return;
  if(typeof Peer==="undefined")return back("通信ライブラリを読み込めませんでした");
  S.host=false;S.code=c;S.scr="wait";S.msg="";
  const p=S.peer=new Peer();
  p.on("open",()=>bind(p.connect(PFX+c,{reliable:true,serialization:"json"})));
  p.on("error",e=>back(e.type==="peer-unavailable"?"その部屋は見つかりません":"接続エラー: "+e.type));
}
function bind(c){
  S.conn=c;
  const hi=()=>send({t:"hi"});
  c.open?hi():c.on("open",hi);
  c.on("data",d=>{
    if(d.t==="hi"){if(S.host){send({t:"go"});begin()}}
    else if(d.t==="go")begin();
    else if(d.t==="s"){S.op.tx=W-d.x;S.op.ty=H-d.y;S.op.hp=d.hp}
    else if(d.t==="b")S.ob.push({id:d.id,x:W-d.x,y:H-d.y,vx:-d.vx,vy:-d.vy,d:d.d,r:d.r||4});
    else if(d.t==="sp"){shake(30);flash("#ff3366",8);chroma(10);showDamage(W/2,H/2-40,"相手の必殺!","#ff3366");sfx.bossAppear()}
    else if(d.t==="h"){const i=S.mb.findIndex(b=>b.id===d.id);if(i>=0){dealt(S.mb[i]);S.mb.splice(i,1)}}
    else if(d.t==="dmg")takeDmg(d.n);
    else if(d.t==="dead")fin(S.res==="lose"?"draw":"win");
  });
  c.on("close",()=>{
    if(S.scr==="play"||S.scr==="count")fin("win","相手が切断しました");
    else if(S.scr==="wait")back("切断されました");
  });
}

/* ---- バトル ---- */
function begin(){
  clr();S.scr="count";S.t=0;S.mb=[];S.ob=[];S.res="";S.msg="";S.tx=null;S.lv=1;S.combo=0;S.ct=0;S.g=0;
  S.me={x:W/2,y:H-110,hp:HP,cd:0,inv:0};S.op={x:W/2,y:110,tx:W/2,ty:110,hp:HP};
}
function fin(r,m){if(S.scr==="result")return;S.scr="result";S.res=r;S.msg=m||"";r==="win"?sfx.clear():sfx.gameOver()}
const hsl=(h,l)=>`hsl(${h},100%,${l||60}%)`;
function dealt(b){
  burst(b.x,b.y,16,hsl(rainbowHue));showDamage(b.x,b.y-10,b.d,"#ffffff");
  shake(4);chroma(4);sfx.enemyHit();addG(b.d*1.5);S.combo++;S.ct=90;
  if(S.combo%5===0){showDamage(W/2,H/2+60,S.combo+" COMBO!","#ff00ff");sfx.combo();zoomPulse=1.04;flash("#ff00ff",4)}
  if(Math.random()<.14){const r=Math.random();powerups.push({x:40+Math.random()*(W-80),y:-10,vy:1.6,r:14,kind:r<.45?"exp":r<.8?"heal":"bomb",life:700,bob:0})}
}
function takeDmg(n){
  const m=S.me;if(S.scr!=="play"||m.inv>0)return false;
  m.hp-=n;m.inv=20;S.combo=0;S.ct=0;addG(n);
  sfx.playerHit();shake(50);flash("#ff0044",12);chroma(15);
  burst(m.x,m.y,60,"#ff0044");burst(m.x,m.y,30,"#ffffff");showDamage(m.x,m.y-24,n,"#ff3366");
  if(m.hp<=0){m.hp=0;send({t:"s",x:m.x,y:m.y,hp:0});send({t:"dead"});fin("lose");shake(120);flash("#ffffff",25)}
  return true;
}
function collect(p){
  const m=S.me;
  if(p.kind==="heal"){m.hp=Math.min(HP,m.hp+15);showDamage(p.x,p.y,"+15 HP","#00ff66");burst(p.x,p.y,30,"#00ff66");shake(8);sfx.powerup()}
  else if(p.kind==="bomb"){
    for(const b of S.ob)burst(b.x,b.y,4,"#ffcc00");
    S.ob=[];send({t:"dmg",n:8});sfx.special();
    shockwaves.push({x:m.x,y:m.y,radius:10,maxRadius:800,life:50,color:"255,200,0"});
    shake(40);flash("#ffcc00",12);chroma(20);burst(p.x,p.y,100,"#ffcc00");showDamage(p.x,p.y,"BOMB!","#ffcc00");
  }else{S.lv=Math.min(4,S.lv+1);showDamage(p.x,p.y,"LEVEL UP! Lv"+S.lv,"#66ccff");burst(p.x,p.y,40,"#66ccff");sfx.levelUp();flash("#66ccff",6);zoomPulse=1.05}
}
function add(x,y,vx,vy,d,h,r){const b={id:++S.id,x,y,vx,vy,d,h,r};S.mb.push(b);send({t:"b",id:b.id,x,y,vx,vy,d,r})}
function addG(n){const was=S.g<100;S.g=Math.min(100,S.g+n);if(was&&S.g>=100){sfx.powerup();showDamage(SB.x-40,SB.y-50,"必殺 READY!","#ff00ff")}}
function fire(){
  const m=S.me,w=WP[S.w],n=w.cnt(S.lv),d=w.dmg(S.lv);
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+(w.jit?(Math.random()-.5)*w.sp:w.sp*(i-(n-1)/2));
    const v=w.spd*(w.jit?.75+Math.random()*.5:1);
    add(m.x,m.y-14,Math.cos(a)*v,Math.sin(a)*v,d,(rainbowHue+i*30)%360,w.r);
  }
  m.cd=w.cd;sfx.shoot();shake(w.r>5?4:1.5);
}
function useSp(){
  const m=S.me;if(S.g<100||S.scr!=="play")return;
  S.g=0;m.inv=45;send({t:"sp"});
  for(let i=0;i<36;i++){const a=i/36*TAU;add(m.x,m.y,Math.cos(a)*7,Math.sin(a)*7,5,(i*10)%360,4)}
  for(let i=0;i<12;i++){const a=-Math.PI/2+(i-5.5)*.09;add(m.x,m.y-14,Math.cos(a)*13,Math.sin(a)*13,4,(i*30)%360,4)}
  sfx.special();shake(60);flash("#ffffff",10);chroma(20);zoomPulse=1.08;
  shockwaves.push({x:m.x,y:m.y,radius:10,maxRadius:700,life:50,color:"255,0,255"});
  burst(m.x,m.y,120,"#ff00ff");showDamage(m.x,m.y-40,"必殺!!","#ff00ff");
}
function clampMe(){S.me.x=clamp(S.me.x,14,W-14);S.me.y=clamp(S.me.y,H/2+30,H-34)}
function step(){
  const m=S.me,o=S.op,k=S.k;S.t++;time++;rainbowHue=(rainbowHue+3)%360;
  bgTint=Math.sin(time*.02)*30*FX.bgMultiplier+S.combo*3*FX.bgMultiplier;beatPulse=(Math.sin(time*.15)+1)*.5;
  dangerTint=m.hp/HP<.3?Math.min(1,dangerTint+.05):Math.max(0,dangerTint-.02);
  const w=screenShake*2+FX.constantShake;shakeX=(Math.random()-.5)*w;shakeY=(Math.random()-.5)*w;
  screenShake=screenShake>.3?screenShake*.85:0;if(flashScreen>0)flashScreen--;if(chromaOffset>0)chromaOffset*=.88;
  updateEffects();
  m.x+=((k.arrowright||k.d)?5:0)-((k.arrowleft||k.a)?5:0);
  m.y+=((k.arrowdown||k.s)?5:0)-((k.arrowup||k.w)?5:0);
  clampMe();
  o.x+=(o.tx-o.x)*.4;o.y+=(o.ty-o.y)*.4;
  if(S.ct>0&&--S.ct===0)S.combo=0;
  if(m.inv>0)m.inv--;
  player.x=m.x;player.y=m.y;player.invincible=m.inv;
  if(S.scr==="count"&&S.t>=180)S.scr="play";
  if(S.scr==="play"){addG(.04);if(--m.cd<=0)fire()}
  for(const b of S.mb){b.x+=b.vx;b.y+=b.vy}
  S.mb=S.mb.filter(b=>b.y>-20&&b.y<H+20&&b.x>-20&&b.x<W+20);
  for(let i=S.ob.length-1;i>=0;i--){
    const b=S.ob[i];b.x+=b.vx;b.y+=b.vy;
    if(b.y<-20||b.y>H+20||b.x<-20||b.x>W+20){S.ob.splice(i,1);continue}
    if(S.scr==="play"&&Math.hypot(b.x-m.x,b.y-m.y)<10+b.r&&takeDmg(b.d)){send({t:"h",id:b.id});S.ob.splice(i,1)}
  }
  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];p.y+=p.vy;p.bob+=.1;p.life--;
    if(S.scr==="play"&&Math.hypot(m.x-p.x,m.y-p.y)<10+p.r){collect(p);powerups.splice(i,1)}
    else if(p.life<=0||p.y>H+40)powerups.splice(i,1);
  }
  if(S.t%2===0)send({t:"s",x:m.x,y:m.y,hp:m.hp});
}

/* ---- 描画 ---- */
function T(s,x,y,sz,col){ctx.font=`bold ${sz}px Arial`;ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=12;ctx.fillText(s,x,y);ctx.shadowBlur=0}
function btn(b){
  ctx.fillStyle=b.on?b.c:"rgba(0,0,0,.6)";ctx.strokeStyle=b.c;ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,10);ctx.fill();ctx.stroke();
  T(b.l,b.x+b.w/2,b.y+b.h/2+6,16,b.on?"#000":b.c);
}
function btns(){
  if(S.scr==="menu")return[
    ...WP.map((w,i)=>({x:60,y:170+i*46,w:360,h:40,l:w.n+" ─ "+w.d,c:w.c,on:S.w===i,f:()=>S.w=i})),
    {x:60,y:415,w:360,h:50,l:"🏠 部屋をつくる",c:"#ff00ff",f:host},
    {x:60,y:475,w:360,h:50,l:"🔑 コードで参加",c:"#66ccff",f:join},
    {x:60,y:540,w:360,h:40,l:"← タイトルへ",c:"#888888",f:()=>{cleanup();S.on=false}}];
  if(S.scr==="wait")return[{x:60,y:540,w:360,h:45,l:"キャンセル",c:"#888888",f:()=>back()}];
  return[];
}
function bar(y,hp,col){ctx.fillStyle="#222";ctx.fillRect(20,y,W-40,10);ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=8;ctx.fillRect(20,y,(W-40)*Math.max(0,hp)/HP,10);ctx.shadowBlur=0}
function ship(x,y,d,col){
  ctx.save();ctx.shadowBlur=15;ctx.shadowColor=col;ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(x,y-14*d);ctx.lineTo(x-11,y+10*d);ctx.lineTo(x+11,y+10*d);ctx.closePath();ctx.fill();ctx.restore();
}
function vdraw(){
  ctx.save();ctx.textAlign="center";
  if(S.scr==="menu"||S.scr==="wait"){
    ctx.fillStyle="rgba(0,0,8,.8)";ctx.fillRect(0,0,W,H);
    T("ONLINE VS",W/2,90,40,"#ff00ff");T("1対1 打ち合いバトル",W/2,122,14,"#ffffff");
    if(S.scr==="menu")T("武器を選ぶ",W/2,158,13,"#aaaaaa");
    else if(S.host){T("この部屋コードを相手に送ってね",W/2,290,14,"#ffffff");T(S.code,W/2,380,64,"#00ffcc");T("相手を待っています…",W/2,440,14,"#ffcc00")}
    else T("接続中…",W/2,320,18,"#ffffff");
    if(S.msg)T(S.msg,W/2,S.scr==="menu"?615:500,14,"#ff6666");
    for(const b of btns())btn(b);
  }else{
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoomPulse,zoomPulse);ctx.translate(-W/2,-H/2);ctx.translate(shakeX,shakeY);
    drawEffects();
    ctx.strokeStyle="rgba(255,255,255,.15)";ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();ctx.setLineDash([]);
    ship(S.op.x,S.op.y,-1,"#ff3366");
    drawPlayer();
    drawPowerups();
    for(const b of S.mb){
      const c=hsl(b.h);ctx.strokeStyle=c;ctx.lineWidth=b.r;ctx.shadowBlur=14;ctx.shadowColor=c;
      ctx.beginPath();ctx.moveTo(b.x-b.vx*2,b.y-b.vy*2);ctx.lineTo(b.x,b.y);ctx.stroke();
      ctx.fillStyle=c;ctx.beginPath();ctx.arc(b.x,b.y,b.r+1,0,TAU);ctx.fill();
      ctx.shadowBlur=0;ctx.fillStyle="rgba(255,255,255,.9)";ctx.beginPath();ctx.arc(b.x,b.y,b.r*.45,0,TAU);ctx.fill();
    }
    for(const b of S.ob){
      const c=hsl(340,65);ctx.shadowBlur=12;ctx.shadowColor=c;ctx.fillStyle=c;
      ctx.beginPath();ctx.arc(b.x,b.y,b.r+1,0,TAU);ctx.fill();
      ctx.shadowBlur=0;ctx.fillStyle="rgba(255,255,255,.85)";ctx.beginPath();ctx.arc(b.x,b.y,b.r*.45,0,TAU);ctx.fill();
    }
    drawDamageNumbers();
    ctx.restore();
    if(chromaOffset>.5&&FX.chromaMultiplier>0){
      ctx.save();ctx.globalCompositeOperation="screen";ctx.globalAlpha=Math.min(.4,chromaOffset/30)*FX.chromaMultiplier;
      ctx.fillStyle=`hsl(${(time*10)%360},100%,50%)`;ctx.fillRect(-chromaOffset,-chromaOffset,W,H);
      ctx.fillStyle=`hsl(${(time*10+180)%360},100%,50%)`;ctx.fillRect(chromaOffset,chromaOffset,W,H);ctx.restore();
    }
    if(flashScreen>0&&FX.flashMultiplier>0){ctx.save();ctx.globalAlpha=Math.min(1,flashScreen/10)*.7*FX.flashMultiplier;ctx.fillStyle=flashColor;ctx.fillRect(0,0,W,H);ctx.restore()}
    bar(12,S.op.hp,"#ff3366");bar(H-24,S.me.hp,"#00ffcc");
    ctx.textAlign="left";T("Lv"+S.lv+"  "+WP[S.w].n,20,H-32,14,"#ffcc00");
    ctx.textAlign="right";if(S.combo>1)T(S.combo+" HIT",W-20,H-32,16,"#ff00ff");
    ctx.textAlign="center";
    if(S.scr==="play"||S.scr==="count"){
      const rdy=S.g>=100;ctx.save();ctx.translate(SB.x,SB.y);
      ctx.lineWidth=5;ctx.strokeStyle="#333";ctx.beginPath();ctx.arc(0,0,SB.r,0,TAU);ctx.stroke();
      ctx.strokeStyle=rdy?hsl(rainbowHue):"#ff00ff";ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=rdy?25:8;
      ctx.beginPath();ctx.arc(0,0,SB.r,-Math.PI/2,-Math.PI/2+TAU*S.g/100);ctx.stroke();ctx.restore();
      T(rdy?"必殺":"SP",SB.x,SB.y+5,rdy?16:12,rdy?"#ffffff":"#aaaaaa");
    }
    if(S.scr==="count")T(String(Math.ceil((180-S.t)/60)),W/2,H/2+20,80,"#ffffff");
    if(S.scr==="result"){
      ctx.fillStyle="rgba(0,0,0,.6)";ctx.fillRect(0,0,W,H);
      T(S.res==="win"?"YOU WIN!":S.res==="lose"?"YOU LOSE":"DRAW",W/2,H/2,48,S.res==="win"?"#ffcc00":"#ff3366");
      if(S.msg)T(S.msg,W/2,H/2+40,14,"#ffffff");
      T("タップで戻る",W/2,H/2+80,14,"#aaaaaa");
    }
  }
  ctx.restore();
}
function titleBtn(){
  ctx.save();ctx.textAlign="center";
  btn({...TB,l:"🌐 オンライン対戦",c:"#ff00ff"});ctx.restore();
}

/* ---- 既存ループへの差し込み ---- */
const _u=window.update,_d=window.draw;
window.update=function(){
  if(!S.on)return _u();
  updateStars();
  const n=performance.now();S.acc=Math.min(100,S.acc+n-S.last);S.last=n;
  while(S.acc>=DT){if(S.scr==="count"||S.scr==="play"||S.scr==="result")step();S.acc-=DT}
};
window.draw=function(){
  if(S.on){drawBackground();vdraw();return}
  _d();if(titleOk())titleBtn();
};

/* ---- 入力 ---- */
const P=e=>{const r=canvas.getBoundingClientRect(),q=e.changedTouches?e.changedTouches[0]:e;return{x:(q.clientX-r.left)*W/r.width,y:(q.clientY-r.top)*H/r.height}};
function down(e){
  if(e.target!==canvas)return;
  if(!S.on){
    if(!titleOk())return;
    if(inR(P(e),TB.x,TB.y,TB.w,TB.h)){e.stopImmediatePropagation();e.preventDefault();initAudio();sfx.tap();S.on=true;S.scr="menu";S.msg="";S.k={};S.last=performance.now();S.acc=0}
    return;
  }
  e.stopImmediatePropagation();e.preventDefault();initAudio();
  const p=P(e);
  if(S.scr==="result"){back();return}
  if(S.scr==="menu"||S.scr==="wait"){for(const b of btns())if(inR(p,b.x,b.y,b.w,b.h)){sfx.tap();b.f();return}return}
  if(S.scr==='play'&&Math.hypot(p.x-SB.x,p.y-SB.y)<SB.r+10){useSp();return}
  if(S.tx===null){S.tx=p.x;S.ty=p.y}
}
function move(e){
  if(!S.on||e.target!==canvas)return;
  e.stopImmediatePropagation();e.preventDefault();
  if(S.tx===null||(S.scr!=="play"&&S.scr!=="count"))return;
  const p=P(e);S.me.x+=p.x-S.tx;S.me.y+=p.y-S.ty;S.tx=p.x;S.ty=p.y;clampMe();
}
function up(e){if(!S.on)return;e.stopImmediatePropagation();if(!e.touches||e.touches.length===0)S.tx=null}
const O={capture:true,passive:false};
for(const ev of["touchstart","mousedown"])window.addEventListener(ev,down,O);
for(const ev of["touchmove","mousemove"])window.addEventListener(ev,move,O);
for(const ev of["touchend","touchcancel","mouseup"])window.addEventListener(ev,up,O);
window.addEventListener("keydown",e=>{
  if(!S.on)return;
  e.stopImmediatePropagation();const k=e.key.toLowerCase();S.k[k]=true;
  if(k.startsWith("arrow")||k===" ")e.preventDefault();
  if(k===" "||k==="e")useSp();
  if(k==="escape"){if(S.scr==="menu"){cleanup();S.on=false}else if(S.scr==="wait"||S.scr==="result")back()}
},true);
window.addEventListener("keyup",e=>{S.k[e.key.toLowerCase()]=false},true);
})();
</script>
