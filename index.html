<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>NEON BULLET SURVIVAL</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #05050a; overflow: hidden;
  display: flex; justify-content: center; align-items: center;
  height: 100vh; font-family: Arial, sans-serif; touch-action: none;
}
canvas {
  width: min(100vw, 66.6vh); height: min(150vw, 100vh);
  max-width: 480px; max-height: 720px;
  background: #020205; border: 3px solid #00ffcc;
  box-shadow:
    0 0 15px #00ffcc,
    0 0 35px rgba(0, 255, 204, .4),
    0 0 60px rgba(255, 0, 255, .3);
  touch-action: none;
  animation: pulseBorder 3s infinite;
}
@keyframes pulseBorder {
  0%, 100% { border-color: #00ffcc; }
  50% { border-color: #ff00ff; }
}
#loading { position: fixed; color: #00ffcc; font-size: 20px; }
</style>
</head>
<body>
<div id="loading">LOADING...</div>
<canvas id="game" width="480" height="720"></canvas>
<script>
"use strict";

/* ==================================================================
   Web Audio API による音声合成エンジン
================================================================== */
let audioCtx = null;
let audioInitialized = false;
let bgmEnabled = true;
let seEnabled = true;
let bgmVolume = 0.35;
let seVolume = 0.5;
let bgmSchedulerId = null;
let bgmStartTime = 0;
let bgmCurrentStep = 0;
const BGM_BPM = 128;
const BGM_STEP_DUR = 60 / BGM_BPM / 4;
const BGM_TOTAL_STEPS = 64;

function initAudio() {
  if (audioInitialized) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    audioInitialized = true;
    startBGM();
  } catch(e) {}
}

let bgmGain = null;
let seGain = null;
function ensureGains() {
  if (!audioCtx) return;
  if (!bgmGain) {
    bgmGain = audioCtx.createGain();
    bgmGain.gain.value = bgmEnabled ? bgmVolume : 0;
    bgmGain.connect(audioCtx.destination);
  }
  if (!seGain) {
    seGain = audioCtx.createGain();
    seGain.gain.value = seEnabled ? seVolume : 0;
    seGain.connect(audioCtx.destination);
  }
}

function playTone(opts) {
  if (!audioCtx || !seEnabled) return;
  ensureGains();
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = opts.type || "square";
  osc.frequency.setValueAtTime(opts.freq || 440, t);
  if (opts.freqEnd) {
    osc.frequency.exponentialRampToValueAtTime(opts.freqEnd, t + (opts.dur || 0.1));
  }
  const vol = opts.vol !== undefined ? opts.vol : 0.3;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.001, t + (opts.dur || 0.1));
  osc.connect(gain);
  if (opts.filter) {
    const f = audioCtx.createBiquadFilter();
    f.type = opts.filter;
    f.frequency.value = opts.filterFreq || 1000;
    gain.connect(f);
    f.connect(seGain);
  } else {
    gain.connect(seGain);
  }
  osc.start(t);
  osc.stop(t + (opts.dur || 0.1) + 0.02);
}

function playNoise(opts) {
  if (!audioCtx || !seEnabled) return;
  ensureGains();
  const t = audioCtx.currentTime;
  const dur = opts.dur || 0.1;
  const bufferSize = Math.floor(audioCtx.sampleRate * dur);
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(opts.vol || 0.3, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  const filter = audioCtx.createBiquadFilter();
  filter.type = opts.filter || "lowpass";
  filter.frequency.value = opts.filterFreq || 2000;
  src.connect(filter);
  filter.connect(gain);
  gain.connect(seGain);
  src.start(t);
  src.stop(t + dur + 0.02);
}

const sfx = {
  shoot: () => playTone({ type: "square", freq: 1200, freqEnd: 600, dur: 0.04, vol: 0.12 }),
  shootHeavy: () => playTone({ type: "square", freq: 400, freqEnd: 120, dur: 0.12, vol: 0.2 }),
  enemyHit: () => playTone({ type: "square", freq: 800, freqEnd: 400, dur: 0.03, vol: 0.08 }),
  enemyDie: () => { playNoise({ dur: 0.12, vol: 0.15, filterFreq: 3000 }); playTone({ type: "square", freq: 300, freqEnd: 80, dur: 0.12, vol: 0.12 }); },
  levelUp: () => { if (!audioCtx || !seEnabled) return; [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone({ type: "square", freq: f, dur: 0.15, vol: 0.18 }), i * 80)); },
  bossAppear: () => { if (!audioCtx || !seEnabled) return; for (let i = 0; i < 6; i++) setTimeout(() => playTone({ type: "sawtooth", freq: 80, freqEnd: 60, dur: 0.3, vol: 0.15, filter: "lowpass", filterFreq: 200 }), i * 150); },
  bossDie: () => { playNoise({ dur: 0.6, vol: 0.35, filterFreq: 1500 }); playTone({ type: "sawtooth", freq: 200, freqEnd: 40, dur: 0.6, vol: 0.3 }); },
  playerHit: () => { playNoise({ dur: 0.2, vol: 0.35, filterFreq: 800 }); playTone({ type: "sawtooth", freq: 200, freqEnd: 60, dur: 0.2, vol: 0.25 }); },
  combo: () => { playTone({ type: "sine", freq: 1500, dur: 0.06, vol: 0.15 }); setTimeout(() => playTone({ type: "sine", freq: 2000, dur: 0.08, vol: 0.12 }), 40); },
  quizCorrect: () => { if (!audioCtx || !seEnabled) return; playTone({ type: "sine", freq: 880, dur: 0.12, vol: 0.25 }); setTimeout(() => playTone({ type: "sine", freq: 1320, dur: 0.18, vol: 0.25 }), 100); },
  quizWrong: () => playTone({ type: "square", freq: 200, freqEnd: 100, dur: 0.35, vol: 0.2 }),
  clear: () => { if (!audioCtx || !seEnabled) return; [523, 659, 784, 1047, 1319, 1047, 1319, 1568].forEach((f, i) => setTimeout(() => playTone({ type: "square", freq: f, dur: 0.2, vol: 0.2 }), i * 120)); },
  gameOver: () => { if (!audioCtx || !seEnabled) return; [400, 350, 300, 250, 200, 150].forEach((f, i) => setTimeout(() => playTone({ type: "sawtooth", freq: f, dur: 0.25, vol: 0.18 }), i * 150)); },
  tap: () => playTone({ type: "square", freq: 800, dur: 0.03, vol: 0.1 }),
  coin: () => { playTone({ type: "sine", freq: 1320, dur: 0.06, vol: 0.18 }); setTimeout(() => playTone({ type: "sine", freq: 1760, dur: 0.1, vol: 0.15 }), 50); },
  dash: () => playNoise({ dur: 0.15, vol: 0.15, filterFreq: 4000, filter: "highpass" }),
  special: () => { if (!audioCtx || !seEnabled) return; playTone({ type: "sawtooth", freq: 200, freqEnd: 1200, dur: 0.4, vol: 0.25 }); playNoise({ dur: 0.5, vol: 0.25, filterFreq: 3000 }); },
  powerup: () => { if (!audioCtx || !seEnabled) return; playTone({ type: "square", freq: 400, freqEnd: 1600, dur: 0.25, vol: 0.2 }); }
};

function noteFreq(note) { return 440 * Math.pow(2, (note - 69) / 12); }

const NOTE = {
  "A1": 33, "B1": 35, "C2": 36, "D2": 38, "E2": 40, "F2": 41, "G2": 43,
  "A2": 45, "B2": 47, "C3": 48, "D3": 50, "E3": 52, "F3": 53, "G3": 55,
  "A3": 57, "B3": 59, "C4": 60, "D4": 62, "E4": 64, "F4": 65, "G4": 67,
  "A4": 69, "B4": 71, "C5": 72, "D5": 74, "E5": 76, "F5": 77, "G5": 79,
  "A5": 81, "B5": 83
};

const BGM_PATTERNS = {
  bass: [
    "A1", null, "A1", null, "A2", null, "A1", null, "A1", null, "A1", null, "A2", null, "A1", null,
    "F2", null, "F2", null, "F2", null, "F2", null, "C3", null, "F2", null, "F2", null, "A2", null,
    "C2", null, "C2", null, "C3", null, "C2", null, "G2", null, "C2", null, "C3", null, "C2", null,
    "G2", null, "G2", null, "G3", null, "G2", null, "D3", null, "G2", null, "G3", null, "B2", null
  ],
  lead: [
    "A4", null, "C5", null, "B4", null, "A4", null, "E5", null, "D5", null, "C5", null, "B4", null,
    "A4", null, "F4", null, "A4", null, "C5", null, "B4", null, "A4", null, "G4", null, "F4", null,
    "G4", null, "E4", null, "G4", null, "C5", null, "B4", null, "G4", null, "E4", null, "D4", null,
    "D4", null, "G4", null, "B4", null, "D5", null, "B4", null, "G4", null, "D4", null, "G4", null
  ],
  arp: [
    "A3", "E4", "A4", "C5", "A4", "E4", "A3", "E4", "A3", "E4", "A4", "E5", "C5", "A4", "E4", "A3",
    "F3", "C4", "F4", "A4", "F4", "C4", "F3", "C4", "F3", "C4", "F4", "C5", "A4", "F4", "C4", "F3",
    "C3", "G3", "C4", "E4", "C4", "G3", "C3", "G3", "C3", "G3", "C4", "G4", "E4", "C4", "G3", "C3",
    "G3", "D4", "G4", "B4", "G4", "D4", "G3", "D4", "G3", "D4", "G4", "B4", "D4", "B3", "G3", "D3"
  ]
};

const BGM_DRUMS = [
  "K", null, "H", null, "S", null, "H", "K", "K", null, "H", null, "S", null, "H", "H",
  "K", null, "H", null, "S", null, "H", "K", "K", null, "H", null, "S", null, "H", "H",
  "K", null, "H", null, "S", null, "H", "K", "K", null, "H", null, "S", null, "H", "H",
  "K", null, "H", null, "S", null, "H", "K", "K", null, "H", "H", "S", null, "K", "S"
];

function playBGMNote(type, freq, duration, vol) {
  if (!audioCtx || !bgmGain) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(vol, t + 0.01);
  gain.gain.setValueAtTime(vol, t + duration - 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(gain);
  gain.connect(bgmGain);
  osc.start(t);
  osc.stop(t + duration + 0.02);
}

function playBGMDrum(type, vol) {
  if (!audioCtx || !bgmGain) return;
  const t = audioCtx.currentTime;
  if (type === "K") {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(gain);
    gain.connect(bgmGain);
    osc.start(t);
    osc.stop(t + 0.18);
  } else if (type === "S") {
    const bufferSize = Math.floor(audioCtx.sampleRate * 0.1);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = "highpass";
    filter.frequency.value = 800;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(bgmGain);
    src.start(t);
    src.stop(t + 0.15);
  } else if (type === "H") {
    const bufferSize = Math.floor(audioCtx.sampleRate * 0.05);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = "highpass";
    filter.frequency.value = 6000;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(bgmGain);
    src.start(t);
    src.stop(t + 0.06);
  }
}

function scheduleStep(step) {
  if (!audioCtx || !bgmGain) return;
  const s = step % 64;
  const bassNote = BGM_PATTERNS.bass[s];
  if (bassNote) playBGMNote("triangle", noteFreq(NOTE[bassNote]), BGM_STEP_DUR * 1.8, 0.18);
  const leadNote = BGM_PATTERNS.lead[s];
  if (leadNote) {
    const vol = (step % 128 < 64) ? 0.10 : 0.14;
    playBGMNote("square", noteFreq(NOTE[leadNote]), BGM_STEP_DUR * 1.5, vol);
  }
  const arpNote = BGM_PATTERNS.arp[s];
  if (arpNote) playBGMNote("sawtooth", noteFreq(NOTE[arpNote]), BGM_STEP_DUR * 0.8, 0.05);
  const drum = BGM_DRUMS[s];
  if (drum === "K") playBGMDrum("K", 0.3);
  else if (drum === "S") playBGMDrum("S", 0.18);
  else if (drum === "H") playBGMDrum("H", 0.08);
}

let bgmNextStepTime = 0;
const BGM_LOOKAHEAD = 0.1;
function bgmScheduler() {
  if (!audioCtx || !bgmGain) return;
  const now = audioCtx.currentTime;
  while (bgmNextStepTime < now + BGM_LOOKAHEAD) {
    scheduleStep(bgmCurrentStep);
    bgmNextStepTime += BGM_STEP_DUR;
    bgmCurrentStep++;
    if (bgmCurrentStep >= 128) bgmCurrentStep = 0;
  }
}

function startBGM() {
  if (!audioCtx) return;
  ensureGains();
  if (bgmSchedulerId) clearInterval(bgmSchedulerId);
  bgmNextStepTime = audioCtx.currentTime + 0.05;
  bgmCurrentStep = 0;
  bgmSchedulerId = setInterval(bgmScheduler, 25);
}
function stopBGM() {
  if (bgmSchedulerId) clearInterval(bgmSchedulerId);
  bgmSchedulerId = null;
}

function setBGMEnabled(v) {
  bgmEnabled = v;
  if (bgmGain) bgmGain.gain.value = bgmEnabled ? bgmVolume : 0;
}
function setSEEnabled(v) {
  seEnabled = v;
  if (seGain) seGain.gain.value = seEnabled ? seVolume : 0;
}
function setBGMVolume(v) {
  bgmVolume = Math.max(0, Math.min(1, v));
  if (bgmGain && bgmEnabled) bgmGain.gain.value = bgmVolume;
}
function setSEVolume(v) {
  seVolume = Math.max(0, Math.min(1, v));
  if (seGain && seEnabled) seGain.gain.value = seVolume;
}

/* ==================================================================
   ゲーム本体
================================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
document.getElementById("loading").remove();

const W = canvas.width;
const H = canvas.height;
const TAU = Math.PI * 2;

const SAVE_KEY = "neonBulletSave_v1";

function createDefaultSave() {
  return {
    highScore: 0,
    coins: 0,
    totalCoinsEarned: 0,
    ownedWeapons: ["normal", "spiral", "rapid", "knife", "mochi", "boomerang", "orbit", "lightning", "freeze", "shotgun", "missile", "flame", "spike", "swarm", "piano"],
    ownedSpecials: ["fireworks"],
    weaponRecords: {},
    totalClears: 0,
    totalPlays: 0,
    lastLoginDate: null,
    loginStreak: 0,
    dailyBonusClaimedDate: null,
    ownedCosmetics: ["theme_default", "color_cyan"],
    equippedTheme: "theme_default",
    equippedColor: "color_cyan",
    upgrades: {},
    dailyMissions: null,
    dailyMissionsDate: null,
    missionProgress: {},
    challengeRecords: {},
    studyGrade: 1,
    studyHighScore: 0,
    studyClears: 0,
    bgmVolume: 0.35,
    seVolume: 0.5,
    bgmEnabled: true,
    seEnabled: true
  };
}

let saveData = createDefaultSave();

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      saveData = { ...createDefaultSave(), ...parsed };
      if (!saveData.weaponRecords) saveData.weaponRecords = {};
      if (!saveData.ownedWeapons) saveData.ownedWeapons = createDefaultSave().ownedWeapons;
      if (!saveData.ownedSpecials) saveData.ownedSpecials = createDefaultSave().ownedSpecials;
      for (const k of createDefaultSave().ownedWeapons) {
        if (!saveData.ownedWeapons.includes(k)) saveData.ownedWeapons.push(k);
      }
      for (const k of createDefaultSave().ownedSpecials) {
        if (!saveData.ownedSpecials.includes(k)) saveData.ownedSpecials.push(k);
      }
      if (!saveData.ownedCosmetics) saveData.ownedCosmetics = createDefaultSave().ownedCosmetics;
      for (const k of createDefaultSave().ownedCosmetics) {
        if (!saveData.ownedCosmetics.includes(k)) saveData.ownedCosmetics.push(k);
      }
      if (!saveData.equippedTheme) saveData.equippedTheme = "theme_default";
      if (!saveData.equippedColor) saveData.equippedColor = "color_cyan";
      if (!saveData.upgrades) saveData.upgrades = {};
      if (!saveData.challengeRecords) saveData.challengeRecords = {};
      if (!saveData.missionProgress) saveData.missionProgress = {};
      if (typeof saveData.studyGrade !== "number") saveData.studyGrade = 1;
      if (typeof saveData.studyHighScore !== "number") saveData.studyHighScore = 0;
      if (typeof saveData.studyClears !== "number") saveData.studyClears = 0;
      if (typeof saveData.bgmVolume !== "number") saveData.bgmVolume = 0.35;
      if (typeof saveData.seVolume !== "number") saveData.seVolume = 0.5;
      if (typeof saveData.bgmEnabled !== "boolean") saveData.bgmEnabled = true;
      if (typeof saveData.seEnabled !== "boolean") saveData.seEnabled = true;
      saveData.ownedWeapons = saveData.ownedWeapons.filter(k => k !== "math");
    }
  } catch (e) {
    saveData = createDefaultSave();
  }
}
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(saveData)); } catch {}
}
function getWeaponRecord(key) {
  if (!saveData.weaponRecords[key]) {
    saveData.weaponRecords[key] = {
      cleared: false, clearCount: 0,
      highScore: 0, maxLevel: 1, maxCombo: 0, maxWave: 1
    };
  }
  return saveData.weaponRecords[key];
}
function ownsWeapon(key) { return saveData.ownedWeapons.includes(key); }
function ownsSpecial(key) { return saveData.ownedSpecials.includes(key); }
function buyWeapon(key) {
  const price = getWeaponPrice(key);
  if (ownsWeapon(key)) return false;
  if (saveData.coins < price) return false;
  saveData.coins -= price;
  saveData.ownedWeapons.push(key);
  writeSave();
  return true;
}
function buySpecial(key) {
  const price = getSpecialPrice(key);
  if (ownsSpecial(key)) return false;
  if (saveData.coins < price) return false;
  saveData.coins -= price;
  saveData.ownedSpecials.push(key);
  writeSave();
  return true;
}

loadSave();
let highScore = saveData.highScore || 0;
bgmVolume = saveData.bgmVolume;
seVolume = saveData.seVolume;
bgmEnabled = saveData.bgmEnabled;
seEnabled = saveData.seEnabled;

const UPGRADES = {
  maxhp:      { name: "最大HP +10",       description: "最大HPが10増える",            color: "#00ff66", basePrice: 200, maxLevel: 10, step: 10 },
  speed:      { name: "移動速度 +5%",     description: "移動速度が5%上がる",          color: "#00ffcc", basePrice: 250, maxLevel: 8,  step: 0.05 },
  startlevel: { name: "初期レベル +1",    description: "開始時のレベルが1上がる",     color: "#ffcc00", basePrice: 300, maxLevel: 5,  step: 1 },
  coinrate:   { name: "コイン獲得 +10%",  description: "獲得コインが10%増える",       color: "#ffd700", basePrice: 400, maxLevel: 8,  step: 0.10 },
  gauge:      { name: "必殺ゲージ +15%",  description: "必殺ゲージの溜まりが15%UP",   color: "#ff88ff", basePrice: 350, maxLevel: 6,  step: 0.15 },
  defense:    { name: "被ダメ -5%",       description: "受けるダメージが5%減る",      color: "#66ccff", basePrice: 300, maxLevel: 8,  step: 0.05 },
  invincible: { name: "無敵時間 +20f",    description: "被弾後の無敵時間が伸びる",     color: "#ffffff", basePrice: 200, maxLevel: 6,  step: 20 },
  dashcd:     { name: "ダッシュCD -8%",   description: "ダッシュのクールダウン短縮",   color: "#ff6600", basePrice: 250, maxLevel: 6,  step: 0.08 }
};
const UPGRADE_ORDER = Object.keys(UPGRADES);

function getUpgradeLevel(key) { return (saveData.upgrades && saveData.upgrades[key]) || 0; }
function getUpgradePrice(key) {
  const u = UPGRADES[key];
  const lv = getUpgradeLevel(key);
  return Math.floor(u.basePrice * Math.pow(1.6, lv));
}
function isUpgradeMaxed(key) { return getUpgradeLevel(key) >= UPGRADES[key].maxLevel; }
function buyUpgrade(key) {
  if (isUpgradeMaxed(key)) return false;
  const price = getUpgradePrice(key);
  if (saveData.coins < price) return false;
  saveData.coins -= price;
  if (!saveData.upgrades) saveData.upgrades = {};
  saveData.upgrades[key] = getUpgradeLevel(key) + 1;
  writeSave();
  return true;
}

function getMaxHpBonus() { return getUpgradeLevel("maxhp") * UPGRADES.maxhp.step; }
function getSpeedMult() { return 1 + getUpgradeLevel("speed") * UPGRADES.speed.step; }
function getStartLevelBonus() { return getUpgradeLevel("startlevel") * UPGRADES.startlevel.step; }
function getCoinRateMult() { return 1 + getUpgradeLevel("coinrate") * UPGRADES.coinrate.step; }

let dailyMissions = [];
let missionProgress = {};
let missionSession = { kills: 0, plays: 0, maxCombo: 0, maxWave: 0, maxLevel: 1, bossKills: 0, maxScore: 0, cleared: false };

function pickDailyMissions() {
  const pool = MISSION_POOL.slice();
  const picked = [];
  for (let i = 0; i < 3; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    picked.push(pool.splice(idx, 1)[0]);
  }
  return picked.map(m => ({ ...m, claimed: false }));
}
function checkDailyMissions() {
  const today = todayStr();
  if (saveData.dailyMissionsDate === today && saveData.dailyMissions) {
    dailyMissions = saveData.dailyMissions;
    missionProgress = saveData.missionProgress || {};
  } else {
    dailyMissions = pickDailyMissions();
    missionProgress = {};
    saveData.dailyMissions = dailyMissions;
    saveData.dailyMissionsDate = today;
    saveData.missionProgress = missionProgress;
    writeSave();
  }
}
function resetMissionSession() {
  missionSession = { kills: 0, plays: 0, maxCombo: 0, maxWave: 0, maxLevel: 1, bossKills: 0, maxScore: 0, cleared: false };
}
function updateMissionProgressFromSession() {
  const s = missionSession;
  missionProgress.kills = Math.max(missionProgress.kills || 0, s.kills);
  missionProgress.combo20 = missionProgress.combo20 || (s.maxCombo >= 20 ? 1 : 0);
  missionProgress.combo30 = missionProgress.combo30 || (s.maxCombo >= 30 ? 1 : 0);
  missionProgress.wave5 = missionProgress.wave5 || (s.maxWave >= 5 ? 1 : 0);
  missionProgress.boss1 = missionProgress.boss1 || (s.bossKills >= 1 ? 1 : 0);
  missionProgress.boss2 = missionProgress.boss2 || (s.bossKills >= 2 ? 1 : 0);
  missionProgress.level10 = missionProgress.level10 || (s.maxLevel >= 10 ? 1 : 0);
  missionProgress.level15 = missionProgress.level15 || (s.maxLevel >= 15 ? 1 : 0);
  missionProgress.clear = missionProgress.clear || (s.cleared ? 1 : 0);
  missionProgress.plays = Math.max(missionProgress.plays || 0, s.plays);
  missionProgress.score5000 = missionProgress.score5000 || (s.maxScore >= 5000 ? 1 : 0);
  missionProgress.score10000 = missionProgress.score10000 || (s.maxScore >= 10000 ? 1 : 0);
  saveData.missionProgress = missionProgress;
  writeSave();
}
function isMissionComplete(m) {
  const p = missionProgress[m.stat] || 0;
  if (m.stat === "kills" || m.stat === "plays") return p >= m.target;
  return p >= 1;
}
function claimMissionReward(idx) {
  const m = dailyMissions[idx];
  if (!m || m.claimed) return false;
  if (!isMissionComplete(m)) return false;
  m.claimed = true;
  saveData.coins = (saveData.coins || 0) + m.reward;
  saveData.totalCoinsEarned = (saveData.totalCoinsEarned || 0) + m.reward;
  saveData.dailyMissions = dailyMissions;
  writeSave();
  sfx.coin();
  return true;
}

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pickWrongs(answer, count, range) {
  const set = new Set([answer]);
  const wrongs = [];
  let safety = 0;
  while (wrongs.length < count && safety < 200) {
    safety++;
    let w = answer + randInt(-range, range);
    if (w === 0 && answer !== 0) w += 1;
    if (w !== answer && !set.has(w)) {
      set.add(w);
      wrongs.push(w);
    }
  }
  while (wrongs.length < count) wrongs.push(answer + (wrongs.length + 1) * 7);
  return wrongs;
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function generateQuizGrade1() {
  const type = Math.floor(Math.random() * 3);
  if (type === 0) {
    const a = randInt(2, 12);
    const b = randInt(1, 15);
    const minus = Math.random() < 0.5;
    const answer = minus ? (-a) - b : (-a) + b;
    const expr = `(-${a}) ${minus ? "-" : "+"} ${b}`;
    const wrongs = pickWrongs(answer, 3, 5);
    return { text: `${expr} = ?`, choices: shuffle([answer, ...wrongs]), answer };
  } else if (type === 1) {
    const a = randInt(2, 6);
    const x = randInt(-8, 8);
    const b = randInt(-15, 15);
    const c = a * x + b;
    const sign = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
    const wrongs = pickWrongs(x, 3, 4);
    return { text: `${a}x ${sign} = ${c}\n x = ?`, choices: shuffle([x, ...wrongs]), answer: x };
  } else {
    const a = randInt(2, 9);
    const b = randInt(2, 9);
    const answer = a + b;
    const wrongs = pickWrongs(answer, 3, 4);
    return { text: `${a}x + ${b}x = ?\n xの係数は？`, choices: shuffle([answer, ...wrongs]), answer, suffix: "x" };
  }
}
function generateQuizGrade2() {
  const type = Math.floor(Math.random() * 3);
  if (type === 0) {
    const x = randInt(1, 9);
    const y = randInt(1, 9);
    const s = x + y;
    const d = x - y;
    const wrongs = pickWrongs(x, 3, 3);
    return { text: `x + y = ${s}\nx - y = ${d}\n x = ?`, choices: shuffle([x, ...wrongs]), answer: x };
  } else if (type === 1) {
    const a = randInt(2, 5);
    const x = randInt(1, 6);
    const y = randInt(1, 9);
    const c = a * x + y;
    const wrongs = pickWrongs(y, 3, 4);
    return { text: `${a}x + y = ${c}\n x = ${x} のとき y = ?`, choices: shuffle([y, ...wrongs]), answer: y };
  } else {
    const a = randInt(2, 5);
    const b = randInt(-8, 8);
    const x = randInt(-5, 7);
    const y = a * x + b;
    const sign = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
    const wrongs = pickWrongs(y, 3, 6);
    return { text: `y = ${a}x ${sign}\n x = ${x} のとき y = ?`, choices: shuffle([y, ...wrongs]), answer: y };
  }
}
function generateQuizGrade3() {
  const type = Math.floor(Math.random() * 3);
  if (type === 0) {
    const a = randInt(1, 9);
    const b = randInt(1, 9);
    const answer = a + b;
    const wrongs = pickWrongs(answer, 3, 4);
    return { text: `(x + ${a})(x + ${b})\n x の係数は？`, choices: shuffle([answer, ...wrongs]), answer };
  } else if (type === 1) {
    const a = randInt(1, 9);
    const b = randInt(1, 9);
    const answer = a * b;
    const wrongs = pickWrongs(answer, 3, Math.max(5, Math.floor(answer/2)));
    return { text: `x² + ${a+b}x + ${a*b}\n = (x + ${a})(x + ?)`, choices: shuffle([b, ...wrongs]), answer: b };
  } else {
    const a = randInt(1, 8);
    const b = randInt(1, 8);
    const answer = Math.max(a, b);
    const wrongs = pickWrongs(answer, 3, 4);
    return { text: `x² - ${a+b}x + ${a*b} = 0\n 大きい方の解は？`, choices: shuffle([answer, ...wrongs]), answer };
  }
}
function generateQuiz() {
  if (studyGrade === 1) return generateQuizGrade1();
  if (studyGrade === 2) return generateQuizGrade2();
  return generateQuizGrade3();
}

function startStudyQuiz() {
  studyQuiz = generateQuiz();
  studyQuizActive = true;
  studyQuizTimeLeft = studyQuizTimeMax;
  flash("#66ccff", 12); chroma(20); shake(30); hitStopAdd(20);
}
function answerStudyQuiz(idx) {

    showBigDamage(player.x, player.y - 50, "LEVEL UP!", "#88ff88");

}

const THEME_CONFIG = {
  theme_default: { bg: "#02020a", nebulaHues: [190, 280, 160, 320], starHue: 190, auroraHue: 190, milkyHue: 190, hueDrift: 0.0 },
  theme_sakura:  { bg: "#1a0812", nebulaHues: [330, 350, 310, 20],  starHue: 330, auroraHue: 330, milkyHue: 330, hueDrift: 0.0 },
  theme_snow:    { bg: "#050912", nebulaHues: [200, 210, 190, 220], starHue: 200, auroraHue: 200, milkyHue: 200, hueDrift: 0.0 },
  theme_space:   { bg: "#050014", nebulaHues: [270, 300, 240, 320], starHue: 270, auroraHue: 270, milkyHue: 270, hueDrift: 0.0 },
  theme_sunset:  { bg: "#1a0a05", nebulaHues: [20, 40, 350, 10],    starHue: 20,  auroraHue: 20,  milkyHue: 20,  hueDrift: 0.0 },
  theme_toxic:   { bg: "#04140a", nebulaHues: [100, 130, 80, 150],  starHue: 100, auroraHue: 100, milkyHue: 100, hueDrift: 0.0 }
};
function getThemeConfig() { return THEME_CONFIG[getEquippedTheme()] || THEME_CONFIG.theme_default; }

function createStars() {
  stars = [];
  const cfg = getThemeConfig();
  for (let i = 0; i < 350; i++) {
    const depth = Math.random();
    stars.push({
      x: Math.random()*W, y: Math.random()*H,
      speed: 0.2 + depth*3.5,
      size: 0.3 + depth*1.5,
      length: 1 + depth*7,
      alpha: 0.1 + depth*0.7,
      twinkle: Math.random() * TAU,
      twinkleSpeed: 0.03 + Math.random()*0.08,
      hue: cfg.starHue + (Math.random()*40 - 20)
    });
  }
  nebulae = [];
  for (let i = 0; i < 4; i++) {
    nebulae.push({
      x: Math.random()*W, y: Math.random()*H,
      r: 100 + Math.random()*180,
      hue: cfg.nebulaHues[i % cfg.nebulaHues.length],
      alpha: 0.08 + Math.random()*0.1,
      speed: 0.02 + Math.random()*0.04
    });
  }
  shootingStars = [];
  auroraBands = [];
  for (let i = 0; i < 2; i++) {
    auroraBands.push({
      phase: Math.random()*TAU,
      speed: 0.005 + Math.random()*0.008,
      yBase: H * (0.15 + i * 0.35),
      hue: cfg.auroraHue + i * 30,
      amp: 60 + Math.random()*60
    });
  }
  themeParticles = [];
}
function updateStars() {
  const cfg = getThemeConfig();
  for (const s of stars) {
    s.y += s.speed;
    s.twinkle += s.twinkleSpeed;
    if (s.y > H+10) { s.y = -10; s.x = Math.random()*W; }
  }
  for (const n of nebulae) {
    n.y += n.speed;
    if (n.y - n.r > H) { n.y = -n.r; n.x = Math.random()*W; }
  }
  if (Math.random() < 0.012 * FX.bgMultiplier) {
    shootingStars.push({
      x: Math.random()*W, y: -20,
      vx: -8 - Math.random()*6, vy: 5 + Math.random()*4,
      life: 100, length: 80 + Math.random()*100,
      hue: cfg.starHue + Math.random()*40
    });
  }
  for (let i = shootingStars.length-1; i >= 0; i--) {
    const ss = shootingStars[i];
    ss.x += ss.vx; ss.y += ss.vy; ss.life--;
    if (ss.life <= 0 || ss.x < -100 || ss.y > H+100) shootingStars.splice(i,1);
  }
  updateThemeParticles();
}

function updateThemeParticles() {
  const themeKey = getEquippedTheme();
  if (themeKey === "theme_default") return;
  let spawnRate = 0, speedY = 0, size = 0, colorFn = null, swayAmp = 0;
  if (themeKey === "theme_sakura") {
    spawnRate = 0.12 * FX.bgMultiplier; speedY = 0.8 + Math.random()*0.6;
    size = 4 + Math.random()*3; colorFn = () => `hsla(${330 + Math.random()*30}, 90%, 80%, 0.8)`; swayAmp = 1.2;
  } else if (themeKey === "theme_snow") {
    spawnRate = 0.25 * FX.bgMultiplier; speedY = 0.6 + Math.random()*0.8;
    size = 2 + Math.random()*2; colorFn = () => `hsla(200, 90%, 95%, 0.9)`; swayAmp = 0.6;
  } else if (themeKey === "theme_space") {
    spawnRate = 0.05 * FX.bgMultiplier; speedY = 1.5 + Math.random()*1.5;
    size = 2 + Math.random()*2; colorFn = () => `hsla(${270 + Math.random()*60}, 100%, 80%, 0.9)`; swayAmp = 0.3;
  } else if (themeKey === "theme_sunset") {
    spawnRate = 0.06 * FX.bgMultiplier; speedY = -0.5 - Math.random()*0.5;
    size = 3 + Math.random()*3; colorFn = () => `hsla(${10 + Math.random()*30}, 100%, 70%, 0.7)`; swayAmp = 0.4;
  } else if (themeKey === "theme_toxic") {
    spawnRate = 0.10 * FX.bgMultiplier; speedY = -0.4 - Math.random()*0.6;
    size = 3 + Math.random()*4; colorFn = () => `hsla(${90 + Math.random()*40}, 100%, 60%, 0.6)`; swayAmp = 0.8;
  }
  if (spawnRate > 0 && Math.random() < spawnRate) {
    themeParticles.push({
      x: Math.random() * W,
      y: themeKey === "theme_sunset" || themeKey === "theme_toxic" ? H + 20 : -20,
      vy: speedY, vx: (Math.random() - 0.5) * 0.5, size,
      color: colorFn(), life: 600, maxLife: 600,
      swayPhase: Math.random() * TAU, swayAmp,
      rot: Math.random() * TAU, rotSpeed: (Math.random() - 0.5) * 0.05
    });
  }
  for (let i = themeParticles.length-1; i >= 0; i--) {
    const p = themeParticles[i];
    p.swayPhase += 0.05;
    p.x += p.vx + Math.sin(p.swayPhase) * p.swayAmp * 0.5;
    p.y += p.vy;
    p.rot += p.rotSpeed;
    p.life--;
    if (p.life <= 0 || p.y < -50 || p.y > H + 50) themeParticles.splice(i,1);
  }
  if (themeParticles.length > 300) themeParticles.splice(0, themeParticles.length - 300);
}

function drawBackground() {
  const themeKey = getEquippedTheme();
  const cfg = getThemeConfig();
  ctx.fillStyle = cfg.bg;
  ctx.fillRect(0, 0, W, H);
  const hueShift = bgTint * 0.3 + time * cfg.hueDrift;
  const dangerA = dangerTint;
  for (const n of nebulae) {
    const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    grad.addColorStop(0, `hsla(${(n.hue + hueShift) % 360}, 90%, 55%, ${n.alpha * FX.bgMultiplier * 1.4})`);
    grad.addColorStop(1, `hsla(${(n.hue + hueShift) % 360}, 90%, 55%, 0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(n.x - n.r, n.y - n.r, n.r*2, n.r*2);
  }
  if (FX.bgMultiplier > 0.2) {
    for (const band of auroraBands) {
      band.phase += band.speed;
      const hue = (band.hue + hueShift) % 360;
      const grad = ctx.createLinearGradient(0, band.yBase - 100, 0, band.yBase + 100);
      grad.addColorStop(0, `hsla(${hue}, 90%, 60%, 0)`);
      grad.addColorStop(0.5, `hsla(${hue}, 90%, 60%, ${0.14 * FX.bgMultiplier})`);
      grad.addColorStop(1, `hsla(${hue}, 90%, 60%, 0)`);
      ctx.fillStyle = grad;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, band.yBase);
      for (let x = 0; x <= W; x += 40) {
        const y = band.yBase + Math.sin(band.phase + x * 0.015) * band.amp;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, band.yBase + 150);
      ctx.lineTo(0, band.yBase + 150);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.rotate(-Math.PI / 5 + Math.sin(time*0.005)*0.05);
  const milkyGrad = ctx.createLinearGradient(0, -140, 0, 140);
  const mh = (cfg.milkyHue + hueShift) % 360;
  milkyGrad.addColorStop(0, `hsla(${mh}, 80%, 70%, 0)`);
  milkyGrad.addColorStop(0.3, `hsla(${(mh+30)%360}, 90%, 70%, ${.13 * FX.bgMultiplier})`);
  milkyGrad.addColorStop(0.5, `hsla(${(mh+60)%360}, 90%, 80%, ${.22 * FX.bgMultiplier})`);
  milkyGrad.addColorStop(0.7, `hsla(${(mh+90)%360}, 90%, 70%, ${.13 * FX.bgMultiplier})`);
  milkyGrad.addColorStop(1, `hsla(${(mh+120)%360}, 80%, 70%, 0)`);
  ctx.fillStyle = milkyGrad;
  ctx.fillRect(-W, -140, W*2, 280);
  ctx.restore();
  for (const s of stars) {
    const twinkle = 0.6 + Math.sin(s.twinkle) * 0.5;
    const alpha = s.alpha * twinkle;
    const hue = `hsla(${(s.hue + hueShift) % 360}, 90%, 75%, ${alpha})`;
    ctx.strokeStyle = hue;
    ctx.lineWidth = s.size;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x, s.y - s.length);
    ctx.stroke();
  }
  for (const ss of shootingStars) {
    const alpha = Math.min(1, ss.life / 50);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = `hsla(${(ss.hue + hueShift) % 360}, 95%, 80%, 1)`;
    ctx.shadowBlur = 15;
    ctx.shadowColor = `hsla(${(ss.hue + hueShift) % 360}, 95%, 80%, 1)`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ss.x, ss.y);
    ctx.lineTo(ss.x - ss.vx * (ss.length/10), ss.y - ss.vy * (ss.length/10));
    ctx.stroke();
    ctx.restore();
  }
  for (const p of themeParticles) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, p.life / 120);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.shadowBlur = 10;
    ctx.shadowColor = p.color;
    ctx.fillStyle = p.color;
    if (themeKey === "theme_sakura") {
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, TAU);
      ctx.fill();
    } else if (themeKey === "theme_snow") {
      ctx.beginPath();
      for (let k = 0; k < 6; k++) {
        const a = k / 6 * TAU;
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * p.size * 2, Math.sin(a) * p.size * 2);
      }
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, p.size, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
  if (dangerA > 0) {
    const pulse = 0.5 + Math.sin(time * 0.2) * 0.5;
    ctx.fillStyle = `rgba(255, 0, 40, ${dangerA * 0.35 * pulse * FX.bgMultiplier})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function shake(amount) { screenShake = Math.max(screenShake, amount * FX.shakeMultiplier); }
function hitStopAdd(frames) { hitStop = Math.max(hitStop, Math.floor(frames * FX.hitStopMultiplier)); }
function flash(color, frames) {
  if (FX.flashMultiplier <= 0.01) return;
  flashScreen = Math.max(flashScreen, Math.floor(frames * FX.flashMultiplier));
  flashColor = color || "#ffffff";
}
function chroma(amount) {
  if (FX.chromaMultiplier <= 0.01) return;
  chromaOffset = Math.max(chromaOffset, amount * FX.chromaMultiplier);
}
function burst(x, y, count, color) {
  const n = Math.floor(count * FX.particleMultiplier);
  for (let i = 0; i < n; i++) {
    const a = Math.random()*TAU, s = 1 + Math.random()*6;
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 25 + Math.random()*25, color,
      size: 2 + Math.random()*3
    });
  }
  if (particles.length > 1500) particles.splice(0, particles.length - 1500);
}

function getPointerPosition(e) {
  const rect = canvas.getBoundingClientRect();
  const src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * W / rect.width,
    y: (src.clientY - rect.top) * H / rect.height
  };
}

function selectWeapon(type) {
  if (!ownsWeapon(type)) {
    showShopMessage("未購入の武器です！ショップで購入してください", "#ff6666");
    return;
  }
  sfx.tap();
  selectedWeapon = type;
  weaponMenu = false;
  specialMenu = true;
  specialMenuScrollY = 0;
  activeWeapons = [type];
  fusionMode = false;
}

function selectSpecial(key) {
  if (!ownsSpecial(key) && key !== "knowledgeburst") {
    showShopMessage("未購入の必殺技です！ショップで購入してください", "#ff6666");
    return;
  }
  sfx.tap();
  selectedSpecial = key;
  startGameWithCurrentSelection();
}

function selectWeaponAt(x, y) {
  if (settingsScreen) {
    const toggleX = W/2 + 60;
    const toggleW = 60;
    const toggleH = 30;
    const row1Y = 200;
    const row2Y = 290;
    const row3Y = 380;
    if (p_inRange(x, y, toggleX, row1Y, toggleW, toggleH)) {
      setBGMEnabled(!bgmEnabled);
      saveData.bgmEnabled = bgmEnabled;
      writeSave();
      sfx.tap();
      return;
    }
    if (p_inRange(x, y, toggleX, row2Y, toggleW, toggleH)) {
      setSEEnabled(!seEnabled);
      saveData.seEnabled = seEnabled;
      writeSave();
      sfx.tap();
      return;
    }
    const sliderX = W/2 - 100;
    const sliderW = 200;
    const sliderY = 245;
    const sliderH = 10;
    if (p_inRange(x, y, sliderX, sliderY - 10, sliderW, 30)) {
      const ratio = Math.max(0, Math.min(1, (x - sliderX) / sliderW));
      setBGMVolume(ratio);
      saveData.bgmVolume = bgmVolume;
      writeSave();
      return;
    }
    const sliderY2 = 335;
    if (p_inRange(x, y, sliderX, sliderY2 - 10, sliderW, 30)) {
      const ratio = Math.max(0, Math.min(1, (x - sliderX) / sliderW));
      setSEVolume(ratio);
      saveData.seVolume = seVolume;
      writeSave();
      return;
    }
    const btnW = 200, btnH = 50;
    const btnX = (W - btnW)/2, btnY = H - 100;
    if (p_inRange(x, y, btnX, btnY, btnW, btnH)) {
      sfx.tap();
      settingsScreen = false;
      titleScreen = true;
      return;
    }
    return;
  }

  if (pauseScreen) {
    if (pauseBackToTitleConfirm) {
      const btnW = 140, btnH = 50;
      const btnY = H/2 + 30;
      const yesX = W/2 - btnW - 8;
      const noX = W/2 + 8;
      if (p_inRange(x, y, yesX, btnY, btnW, btnH)) {
        sfx.tap();
        pauseBackToTitleConfirm = false;
        pauseScreen = false;
        abortGameToTitle();
        return;
      }
      if (p_inRange(x, y, noX, btnY, btnW, btnH)) {
        sfx.tap();
        pauseBackToTitleConfirm = false;
        return;
      }
      return;
    }
    const btnW = 240, btnH = 60;
    const btnX = (W - btnW) / 2;
    const resumeY = H/2 - 80;
    const quitY = H/2 + 10;
    if (p_inRange(x, y, btnX, resumeY, btnW, btnH)) {
      sfx.tap();
      pauseScreen = false;
      return;
    }
    if (p_inRange(x, y, btnX, quitY, btnW, btnH)) {
      sfx.tap();
      pauseBackToTitleConfirm = true;
      return;
    }
    return;
  }

  if (shopScreen) {
    if (p_inRange(x, y, SHOP_TAB_WEAPON_X, SHOP_TAB_Y, SHOP_TAB_W, SHOP_TAB_H)) {
      if (shopTab !== "weapon") { sfx.tap(); shopTab = "weapon"; shopScrollY = 0; }
      return;
    }
    if (p_inRange(x, y, SHOP_TAB_SPECIAL_X, SHOP_TAB_Y, SHOP_TAB_W, SHOP_TAB_H)) {
      if (shopTab !== "special") { sfx.tap(); shopTab = "special"; shopScrollY = 0; }
      return;
    }
    if (p_inRange(x, y, SHOP_TAB_UPGRADE_X, SHOP_TAB_Y, SHOP_TAB_W, SHOP_TAB_H)) {
      if (shopTab !== "upgrade") { sfx.tap(); shopTab = "upgrade"; shopScrollY = 0; }
      return;
    }
    if (p_inRange(x, y, SHOP_TAB_COSMETIC_X, SHOP_TAB_Y, SHOP_TAB_W, SHOP_TAB_H)) {
      if (shopTab !== "cosmetic") { sfx.tap(); shopTab = "cosmetic"; shopScrollY = 0; }
      return;
    }
    const backBtnY = H - 45;
    const backBtnW = 200;
    const backBtnX = (W - backBtnW) / 2;
    if (p_inRange(x, y, backBtnX, backBtnY - 22, backBtnW, 44)) {
      sfx.tap();
      shopScreen = false;
      titleScreen = true;
      return;
    }
    const listY = SHOP_TAB_Y + SHOP_TAB_H + 20;
    if (x < MENU_MARGIN || x > MENU_MARGIN+MENU_WIDTH || y < listY || y > H - 70) return;
    const localY = y - listY + shopScrollY;
    const idx = Math.floor(localY / (MENU_ITEM_HEIGHT+MENU_GAP));
    const list = shopTab === "weapon" ? getShopWeapons() : shopTab === "special" ? getShopSpecials() : shopTab === "upgrade" ? UPGRADE_ORDER : getShopCosmetics();
    if (idx < 0 || idx >= list.length) return;
    if (localY % (MENU_ITEM_HEIGHT+MENU_GAP) > MENU_ITEM_HEIGHT) return;
    const key = list[idx];
    if (shopTab === "weapon") {
      if (ownsWeapon(key)) return;
      const price = getWeaponPrice(key);
      if (buyWeapon(key)) {
        sfx.coin();
        showShopMessage(`「${weapons[key].name}」を購入しました！`, "#88ff88");
        shake(15); flash("#88ff88", 6);
      } else {
        showShopMessage(`コインが足りません（必要: ${price} / 所持: ${saveData.coins}）`, "#ff6666");
        shake(10); flash("#ff6666", 4);
      }
    } else if (shopTab === "special") {
      if (ownsSpecial(key)) return;
      const price = getSpecialPrice(key);
      if (buySpecial(key)) {
        sfx.coin();
        showShopMessage(`「${specials[key].name}」を購入しました！`, "#88ff88");
        shake(15); flash("#88ff88", 6);
      } else {
        showShopMessage(`コインが足りません（必要: ${price} / 所持: ${saveData.coins}）`, "#ff6666");
        shake(10); flash("#ff6666", 4);
      }
    } else if (shopTab === "upgrade") {
      if (isUpgradeMaxed(key)) {
        showShopMessage("この強化は最大レベルです", "#ffcc00");
        return;
      }
      const price = getUpgradePrice(key);
      if (buyUpgrade(key)) {
        sfx.coin();
        showShopMessage(`「${UPGRADES[key].name}」をLv${getUpgradeLevel(key)}に強化！`, "#88ff88");
        shake(15); flash(UPGRADES[key].color, 6);
      } else {
        showShopMessage(`コインが足りません（必要: ${price} / 所持: ${saveData.coins}）`, "#ff6666");
        shake(10); flash("#ff6666", 4);
      }
    } else {
      if (ownsCosmetic(key)) {
        sfx.tap();
        equipCosmetic(key);
        showShopMessage(`「${cosmetics[key].name}」を装備しました！`, "#88ff88");
        shake(8); flash(cosmetics[key].color, 5);
        if (cosmetics[key].kind === "theme") createStars();
        return;
      }
      const price = getCosmeticPrice(key);
      if (buyCosmetic(key)) {
        sfx.coin();
        showShopMessage(`「${cosmetics[key].name}」を購入しました！`, "#88ff88");
        shake(15); flash("#88ff88", 6);
      } else {
        showShopMessage(`コインが足りません（必要: ${price} / 所持: ${saveData.coins}）`, "#ff6666");
        shake(10); flash("#ff6666", 4);
      }
    }
    return;
  }

  if (missionScreen) {
    const backBtnY = H - 45;
    const backBtnW = 200;
    const backBtnX = (W - backBtnW) / 2;
    if (p_inRange(x, y, backBtnX, backBtnY - 22, backBtnW, 44)) {
      sfx.tap();
      missionScreen = false;
      titleScreen = true;
      return;
    }
    const listY = 120;
    for (let i = 0; i < dailyMissions.length; i++) {
      const m = dailyMissions[i];
      const y2 = listY + i * 150;
      const btnX = MENU_MARGIN;
      const btnW = MENU_WIDTH;
      if (p_inRange(x, y, btnX, y2 + 100, btnW, 36)) {
        if (!m.claimed && isMissionComplete(m)) {
          if (claimMissionReward(i)) {
            shake(20); flash("#ffd700", 8); chroma(10);
            burst(W/2, H/2, 60, "#ffd700");
            burst(W/2, H/2, 30, "#ffffff");
          }
        }
        return;
      }
    }
    return;
  }

  if (challengeScreen) {
    const backBtnY = H - 45;
    const backBtnW = 200;
    const backBtnX = (W - backBtnW) / 2;
    if (p_inRange(x, y, backBtnX, backBtnY - 22, backBtnW, 44)) {
      sfx.tap();
      challengeScreen = false;
      titleScreen = true;
      return;
    }
    const listY = 90;
    for (let i = 0; i < CHALLENGE_ORDER.length; i++) {
      const y2 = listY + i * 60;
      if (y2 > H - 100) break;
      if (p_inRange(x, y, MENU_MARGIN, y2, MENU_WIDTH, 54)) {
        sfx.tap();
        const key = CHALLENGE_ORDER[i];
        applyChallenge(key);
        challengeScreen = false;
        titleScreen = false;
        weaponMenu = true;
        specialMenu = false;
        fusionMode = false;
        quickMode = false;
        menuScrollY = 0;
        shake(15); flash(CHALLENGES[key].color, 6);
        return;
      }
    }
    if (p_inRange(x, y, MENU_MARGIN, H - 100, MENU_WIDTH, 36)) {
      sfx.tap();
      applyChallenge(null);
      challengeScreen = false;
      titleScreen = false;
      weaponMenu = true;
      specialMenu = false;
      fusionMode = false;
      quickMode = false;
      menuScrollY = 0;
      shake(15); flash("#00ffcc", 6);
      return;
    }
    return;
  }

  if (studySelectScreen) {
    const backBtnY = H - 45;
    const backBtnW = 200;
    const backBtnX = (W - backBtnW) / 2;
    if (p_inRange(x, y, backBtnX, backBtnY - 22, backBtnW, 44)) {
      sfx.tap();
      studySelectScreen = false;
      titleScreen = true;
      return;
    }
    const btnY1 = 200, btnY2 = 270, btnY3 = 340;
    const btnW = 280, btnH = 55;
    const btnX = (W - btnW) / 2;
    if (p_inRange(x, y, btnX, btnY1, btnW, btnH)) { startStudyMode(1); return; }
    if (p_inRange(x, y, btnX, btnY2, btnW, btnH)) { startStudyMode(2); return; }
    if (p_inRange(x, y, btnX, btnY3, btnW, btnH)) { startStudyMode(3); return; }
    return;
  }

  if (specialMenu) {
    const list = getAvailableSpecials();
    if (x < MENU_MARGIN || x > MENU_MARGIN+MENU_WIDTH || y < MENU_TOP || y > H) return;
    const localY = y - MENU_TOP + specialMenuScrollY;
    const idx = Math.floor(localY / (MENU_ITEM_HEIGHT+MENU_GAP));
    if (idx < 0 || idx >= list.length) return;
    if (localY % (MENU_ITEM_HEIGHT+MENU_GAP) <= MENU_ITEM_HEIGHT) selectSpecial(list[idx]);
    return;
  }

  if (weaponMenu) {
    if (fusionMode) {
      if (fusionSelected.length >= 2) {
        const btnY = H - 45;
        const btnW = 220;
        const btnX = (W - btnW) / 2;
        if (p_inRange(x, y, btnX, btnY - 22, btnW, 44)) { startFusionGame(); return; }
      }
      if (x < MENU_MARGIN || x > MENU_MARGIN+MENU_WIDTH || y < MENU_TOP || y > H - 60) return;
      const localY = y - MENU_TOP + menuScrollY;
      const idx = Math.floor(localY / (MENU_ITEM_HEIGHT+MENU_GAP));
      const avail = getAvailableWeapons();
      if (idx < 0 || idx >= avail.length) return;
      if (localY % (MENU_ITEM_HEIGHT+MENU_GAP) > MENU_ITEM_HEIGHT) return;
      const key = avail[idx];
      sfx.tap();
      const i = fusionSelected.indexOf(key);
      if (i >= 0) fusionSelected.splice(i, 1);
      else fusionSelected.push(key);
      return;
    }
    if (x < MENU_MARGIN || x > MENU_MARGIN+MENU_WIDTH || y < MENU_TOP || y > H) return;
    const localY = y - MENU_TOP + menuScrollY;
    const idx = Math.floor(localY / (MENU_ITEM_HEIGHT+MENU_GAP));
    const avail = getAvailableWeapons();
    if (idx < 0 || idx >= avail.length) return;
    if (localY % (MENU_ITEM_HEIGHT+MENU_GAP) <= MENU_ITEM_HEIGHT) selectWeapon(avail[idx]);
  }
}

function tryDash() {
  if (player.dashCooldown > 0 || player.dashTimer > 0) return;
  let dx = 0, dy = 0;
  if (keys.arrowleft || keys.a) dx -= 1;
  if (keys.arrowright || keys.d) dx += 1;
  if (keys.arrowup || keys.w) dy -= 1;
  if (keys.arrowdown || keys.s) dy += 1;
  if (dx === 0 && dy === 0) dy = -1;
  const len = Math.hypot(dx, dy);
  player.dashVx = dx/len * 14;
  player.dashVy = dy/len * 14;
  player.dashTimer = 12;
  player.dashCooldown = Math.floor(45 * getDashCdMult());
  player.invincible = Math.max(player.invincible, 14);
  sfx.dash();
  burst(player.x, player.y, 20, getPlayerColor());
  burst(player.x, player.y, 10, "#ffffff");
  shake(12);
  flash(getPlayerColor(), 4);
}

function startPointer(e) {
  e.preventDefault();
  initAudio();
  const p = getPointerPosition(e);
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

  if (titleScreen && showDailyBonusPopup) {
    const btnW = 220, btnH = 50;
    const btnX = (W - btnW) / 2;
    const btnY = H/2 + 70;
    if (p_inRange(p.x, p.y, btnX, btnY, btnW, btnH)) {
      sfx.tap();
      claimDailyBonus();
    }
    return;
  }

  if (!titleScreen && !weaponMenu && !specialMenu && !shopScreen && !gameOver && !missionScreen && !challengeScreen && !studySelectScreen && !pauseScreen && !settingsScreen) {
    if (p_inMuteBtn(p.x, p.y)) {
      setSEEnabled(!seEnabled);
      saveData.seEnabled = seEnabled;
      writeSave();
      if (seEnabled) sfx.tap();
      return;
    }
  }

  if (settingsScreen) { touchX = p.x; touchY = p.y; menuStartY = p.y; menuDragged = false; return; }
  if (pauseScreen) { touchX = p.x; touchY = p.y; menuStartY = p.y; menuDragged = false; return; }

  if (studyQuizActive && studyQuiz) {
    const btnW = (W - 80) / 2;
    const btnH = 70;
    const gap = 12;
    const baseX = 40;
    const baseY = H - 260;
    for (let i = 0; i < 4; i++) {
      const col = i % 2;
      const row = Math.floor(i / 2);
      const bx = baseX + col * (btnW + gap);
      const by = baseY + row * (btnH + gap);
      if (p_inRange(p.x, p.y, bx, by, btnW, btnH)) { answerStudyQuiz(i); return; }
    }
    return;
  }

  if (shopScreen || missionScreen || challengeScreen || studySelectScreen) {
    touchX = p.x; touchY = p.y; menuStartY = p.y; menuDragged = false;
    return;
  }

  if (titleScreen) {
    {
      const dx = p.x - TITLE_SETTINGS_BTN_X;
      const dy = p.y - TITLE_SETTINGS_BTN_Y;
      if (dx*dx + dy*dy <= TITLE_SETTINGS_BTN_R*TITLE_SETTINGS_BTN_R) {
        sfx.tap();
        settingsScreen = true;
        titleScreen = false;
        return;
      }
    }
    const modes = ["chaos", "normal", "safe"];
    for (let i = 0; i < 3; i++) {
      if (p_inRange(p.x, p.y, TITLE_MODE_XS[i], TITLE_MODES_Y, TITLE_MODE_W, TITLE_MODE_H)) {
        sfx.tap();
        fxMode = modes[i];
        applyFxMode();
        return;
      }
    }
    {
      const btnX = (W - TITLE_PLAY_W) / 2;
      if (p_inRange(p.x, p.y, btnX, TITLE_PLAY_Y, TITLE_PLAY_W, TITLE_PLAY_H)) {
        sfx.tap();
        studyMode = false;
        titleScreen = false;
        weaponMenu = true;
        specialMenu = false;
        fusionMode = false;
        quickMode = false;
        applyChallenge(null);
        menuScrollY = 0;
        return;
      }
    }
    {
      const btnX = (W - TITLE_FUSION_W) / 2;
      if (p_inRange(p.x, p.y, btnX, TITLE_FUSION_Y, TITLE_FUSION_W, TITLE_FUSION_H)) {
        sfx.tap();
        studyMode = false;
        fusionMode = true;
        quickMode = false;
        fusionSelected = [];
        applyChallenge(null);
        titleScreen = false;
        weaponMenu = true;
        specialMenu = false;
        menuScrollY = 0;
        return;
      }
    }
    {

function movePointer(e) {

  if (shopScreen || missionScreen || challengeScreen || studySelectScreen) {
    const delta = p.y - touchY;
    if (Math.abs(p.y - menuStartY) > 6) menuDragged = true;
    if (shopScreen) shopScrollY = Math.max(0, Math.min(shopMaxScroll(), shopScrollY - delta));
    touchX = p.x; touchY = p.y; return;
  }
  if (specialMenu) {
    const delta = p.y - touchY;
    if (Math.abs(p.y - menuStartY) > 6) menuDragged = true;
    specialMenuScrollY = Math.max(0, Math.min(specialMenuMaxScroll(), specialMenuScrollY - delta));
    touchX = p.x; touchY = p.y; return;
  }
  if (weaponMenu) {
    const delta = p.y - touchY;
    if (Math.abs(p.y - menuStartY) > 6) menuDragged = true;
    menuScrollY = Math.max(0, Math.min(menuMaxScroll(), menuScrollY - delta));
    touchX = p.x; touchY = p.y; return;
  }
  if (gameOver) return;
  if ((selectedWeapon === "knife" || selectedWeapon === "sword") && knifeTouchMode === "aim") {

    knifeAngle = a; swordAngle = a;

    if (theWorldTimer === 1) showDamage(player.x, player.y - 60, "TIME RESUMES", "#ffffff");
  }
  if (stickyFingersTimer > 0) {
    stickyFingersTimer--;
    if (stickyFingersTarget && enemies.includes(stickyFingersTarget)) {
      const e = stickyFingersTarget;
      if (stickyFingersTimer % 5 === 0) {
        const dmg = 12 + level * 1.5;
        e.hp -= dmg;
        showDamage(e.x, e.y, dmg, "#44aaff");
        burst(e.x, e.y, 15, "#44aaff");
        for (let k = 0; k < 5; k++) {
          const a = Math.random() * TAU;
          particles.push({ x: e.x, y: e.y, vx: Math.cos(a) * 6, vy: Math.sin(a) * 6, life: 20, color: "#44aaff", size: 4 });
        }
        shake(5);
        if (e.hp <= 0) { killEnemy(enemies.indexOf(e)); stickyFingersTarget = null; }
      }
    } else {
      stickyFingersTarget = enemies.slice().sort((a, b) => Math.hypot(a.x-player.x, a.y-player.y) - Math.hypot(b.x-player.x, b.y-player.y))[0] || null;
    }
  }
}

function updateSpecial() {
  if (specialActive > 0) {
    specialActive--;
    for (let i = specialFireworks.length-1; i >= 0; i--) {
      const fw = specialFireworks[i];
      fw.timer--;
      if (fw.timer <= 0 && !fw.exploded) {
        fw.exploded = true;
        const n = 30 + Math.floor(Math.random()*20);
        for (let k = 0; k < n; k++) {
          const a = Math.random() * TAU;
          const sp = 2 + Math.random() * 5;
          fw.particles.push({
            x: fw.x, y: fw.y,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 40 + Math.random() * 30, maxLife: 70,
            hue: fw.hue, size: 2 + Math.random() * 3
          });
        }
      }
      for (let k = fw.particles.length-1; k >= 0; k--) {
        const p = fw.particles[k];
        p.x += p.vx; p.y += p.vy;
        p.vx *= 0.96; p.vy *= 0.96;
        p.vy += 0.08;
        p.life--;
        if (p.life <= 0) fw.particles.splice(k,1);
      }
    }
    if (specialActive % 3 === 0) {
      for (let k = 0; k < 8; k++) {
        specialParticles.push({
          x: Math.random() * W, y: Math.random() * H,
          vx: (Math.random()-.5) * 4, vy: -2 - Math.random() * 3,
          life: 30 + Math.random() * 30,
          hue: (Date.now() * 0.1 + k * 45) % 360,
          size: 3 + Math.random() * 4
        });
      }
    }
    for (let i = specialParticles.length-1; i >= 0; i--) {
      const p = specialParticles[i];
      p.x += p.vx; p.y += p.vy;
      p.life--;
      if (p.life <= 0) specialParticles.splice(i,1);
    }
  }
}

function enemyHpScale() {
  const lv = level;
  let scale = 1 + (lv - 1) * 0.22;
  if (lv > 20) scale += (lv - 20) * 0.10;
  if (lv > 40) scale += (lv - 40) * 0.15;
  if (lv > 60) scale += (lv - 60) * 0.22;
  return scale;
}
function enemySpeedScale() {
  const lv = level;
  let scale = 1 + (lv - 1) * 0.025;
  if (lv > 15) scale += (lv - 15) * 0.012;
  if (lv > 35) scale += (lv - 35) * 0.018;
  if (challengeFastEnemy) scale *= 1.5;
  return scale;
}
function enemyShootScale() {
  const lv = level;
  let scale = 1 + (lv - 1) * 0.020;
  if (lv > 20) scale += (lv - 20) * 0.010;
  if (challengeDoubleBullet) scale *= 1.8;
  return scale;
}
function enemyBulletSpeedScale() {
  const lv = level;
  let scale = 1 + (lv - 1) * 0.008;
  if (lv > 25) scale += (lv - 25) * 0.006;
  return scale;
}

function spawnEnemy(forceType) {
  const roll = forceType ? 0 : Math.random();
  const hpScale = enemyHpScale();
  const spdScale = enemySpeedScale();
  const shootScale = enemyShootScale();
  let e;
  if (forceType === "boss") {
    let bossHp = (80 + wave*30) * hpScale;
    if (challengeBossRush) bossHp *= 2;
    e = {
      x: W/2, y: -80, r: 42,
      hp: bossHp, maxHp: bossHp,
      speed: (.7 + difficulty*.15) * spdScale,
      type: "boss", score: 50,
      shootRate: (.030 + difficulty*.008 + level*.0018) * shootScale,
      wave: 0, wavePower: 2, bossPhase: 0
    };
  } else if (roll < .10) {
    const hp = (8 + Math.floor(difficulty*2)) * hpScale;
    e = { x: 30 + Math.random()*(W-60), y: -30, r: 19,
      hp: hp, maxHp: hp,
      speed: (1.1 + difficulty*.3) * spdScale,
      type: "heavy", score: 5, shootRate: (.010 + difficulty*.003 + level*.0008) * shootScale };
  } else if (roll < .20) {
    const hp = (4 + Math.floor(difficulty)) * hpScale;
    e = { x: 25 + Math.random()*(W-50), y: -25, r: 15,
      hp: hp, maxHp: hp,
      speed: (1.6 + difficulty*.4) * spdScale,
      type: "splitter", score: 3, shootRate: (.008 + difficulty*.002) * shootScale,
      wave: Math.random()*TAU, wavePower: 1 + Math.random()*1.5 };
  } else if (roll < .30) {
    const hp = (20 + Math.floor(difficulty*3)) * hpScale;
    e = { x: 40 + Math.random()*(W-80), y: -40, r: 26,
      hp: hp, maxHp: hp,
      speed: (.55 + difficulty*.12) * spdScale,
      type: "tank", score: 12, shootRate: (.008 + difficulty*.0015) * shootScale };
  } else if (roll < .48) {
    const hp = 4 * hpScale;
    e = { x: 30 + Math.random()*(W-60), y: -30, r: 13,
      hp: hp, maxHp: hp,
      speed: (3.5 + difficulty*.8) * spdScale,
      type: "dasher", score: 4, shootRate: 0,
      dashTimer: 40 + Math.random()*40, dashing: false, dashVx: 0, dashVy: 0 };
  } else if (roll < .60) {
    const hp = (6 + Math.floor(difficulty*1.5)) * hpScale;
    e = { x: 40 + Math.random()*(W-80), y: -40, r: 16,
      hp: hp, maxHp: hp,
      speed: (.9 + difficulty*.2) * spdScale,
      type: "shooter", score: 6, shootRate: (.030 + difficulty*.008 + level*.0022) * shootScale, burstCooldown: 0 };
  } else {
    const hp = (3 + Math.floor(difficulty)) * hpScale;
    e = { x: 20 + Math.random()*(W-40), y: -20, r: 12,
      hp: hp, maxHp: hp,
      speed: (1.9 + difficulty*.5) * spdScale,
      type: "normal", score: 1, shootRate: (.006 + difficulty*.002 + level*.0007) * shootScale,
      wave: Math.random()*TAU, wavePower: 1 };
  }
  enemies.push(e);
}

function gainExperience(amount) {
  exp += amount;
  while (exp >= nextExp) {
    exp -= nextExp;
    level++;
    nextExp += 8;
    sfx.levelUp();
    player.hp = Math.min(player.maxHp, player.hp + 8);
    burst(player.x, player.y, 30, "#00ffcc");
    burst(player.x, player.y, 15, "#ffffff");
    shockwaves.push({ x:player.x, y:player.y, radius:10, maxRadius:120, life:25, color:"0,255,204" });
    shake(15); flash("#00ffcc", 5);
    if (selectedWeapon && isPowerThreshold(level)) triggerPowerUp();
    if (level > missionSession.maxLevel) missionSession.maxLevel = level;
  }
}

function triggerPowerUp() {
  const key = selectedWeapon;
  if (!key) return;
  const cur = weaponPower[key] || 0;
  weaponPower[key] = cur + 1;
  const lv = weaponPower[key];
  powerUpFlash = { timer: 150, weapon: key, lv };
  sfx.powerup();
  shake(60); flash(weapons[key].color, 15); chroma(20); hitStopAdd(12); zoomPulse = 1.4;
  burst(player.x, player.y, 150, weapons[key].color);

  burst(player.x, player.y, 40, "#ff00ff");
  shockwaves.push({ x: player.x, y: player.y, radius: 10, maxRadius: 600, life: 50, color: "255,255,255" });
  shockwaves.push({ x: player.x, y: player.y, radius: 10, maxRadius: 450, life: 40, color: "255,255,255" });

function killEnemy(idx) {
  const e = enemies[idx];
  if (!e) return;
  const big = e.type === "heavy" || e.type === "boss" || e.type === "tank";
  if (big) sfx.enemyDie();
  burst(e.x, e.y, big ? 120 : 40,
        e.type === "heavy" ? "#ffaa00" :
        e.type === "boss" ? "#ff0044" :
        e.type === "tank" ? "#8866ff" : "#ff0088");
  burst(e.x, e.y, big ? 60 : 20, "#ffffff");
  burst(e.x, e.y, big ? 40 : 15, "#ffff00");
  if (Math.random() < 0.5) burst(e.x, e.y, big ? 50 : 15, "#ff00ff");
  shake(big ? 40 : (e.type === "child" ? 4 : 10));
  if (big) hitStopAdd(10);
  else if (Math.random() < 0.5) hitStopAdd(2);
  if (big || Math.random() < 0.15) flash(e.type === "boss" ? "#ff0044" : "#ff00ff", big ? 8 : 3);
  if (e.type === "boss") {
    sfx.bossDie();
    shake(120); flash("#ffffff", 25); chroma(30); hitStopAdd(20); zoomPulse = 2;
    for (let k = 0; k < 8; k++) {
      setTimeout(() => {
        const bx = e.x + (Math.random()-.5)*300;
        const by = e.y + (Math.random()-.5)*300;
        burst(bx, by, 60, "#ff0044");
        burst(bx, by, 30, "#ffffff");
        shake(35); flash("#ff0044", 5);
      }, k * 90);
    }
    bossKillCount++;
    missionSession.bossKills = bossKillCount;
    const target = studyMode ? 1 : (quickMode ? 1 : BOSS_KILL_TARGET);
    if (bossKillCount >= target && !gameClear) {
      gameClear = true;
      gameOver = true;
      missionSession.cleared = true;
      recordGameResult(true);
      sfx.clear();
      shake(180); flash("#ffcc00", 50); chroma(50); hitStopAdd(50); zoomPulse = 2.5;
      for (let k = 0; k < 25; k++) {
        setTimeout(() => {
          const bx = Math.random() * W;
          const by = Math.random() * H;
          burst(bx, by, 70, "#ffcc00");
          burst(bx, by, 35, "#ffffff");
          burst(bx, by, 20, "#ff00ff");
          flash("#ffffff", 6); shake(35);
        }, k * 110);
      }
    }
  }
  addCombo();
  score += Math.round(e.score * comboMultiplier());
  if (score > missionSession.maxScore) missionSession.maxScore = score;
  gainExperience(1);
  missionSession.kills++;
  specialGauge = Math.min(SPECIAL_MAX, specialGauge + (big ? 2 : 0.5) * getGaugeMult());
  maybeDropPowerup(e.x, e.y, e.type);
  if (e.type === "boss") {
    bossActive = false;
    shockwaves.push({ x:e.x, y:e.y, radius:10, maxRadius:800, life:60, color:"255,0,68" });
    for (let i = 0; i < 3; i++) {
      powerups.push({
        x: e.x + (i-1)*40, y: e.y, vy: 1.2, r: 14,
        kind: i === 0 ? "heal" : i === 1 ? "bomb" : "exp",
        life: 600, bob: Math.random()*TAU
      });
    }
  }
  enemies.splice(idx, 1);
  if (e.type === "splitter") {
    for (let i = 0; i < 2; i++) {
      const hpScale = enemyHpScale();
      const hp = 2 * hpScale;
      enemies.push({
        x: e.x + (i ? 15 : -15), y: e.y,
        r: 8, hp: hp, maxHp: hp, speed: e.speed*1.4,
        type: "child", score: 2, shootRate: 0,
        wave: Math.random()*TAU, wavePower: 2
      });
    }
  }
}

  else if (e.type === "shooter" || e.type === "splitter") chance = 0.15;
  else if (e.type === "dasher") chance = 0.10;
  if (Math.random() < chance) {

      r: 14,

      life: 600,
      bob: Math.random()*TAU
    });
  }
  enemies.splice(idx, 1);
}

function updateOrbit() {
  const p = pw("orbit");
  orbitAngle += .055;
  const count = Math.max(1, level) + p*2;
  const radius = 52 + Math.min(25, level*1.5) + p*8;
  const damage = 1 + level*.25 + p*.5;
  for (let i = enemies.length-1; i >= 0; i--) {
    const e = enemies[i];
    if (!e) continue;
    e.orbitCooldown = Math.max(0, (e.orbitCooldown || 0) - 1);
    for (let s = 0; s < count; s++) {
      const a = orbitAngle + s*TAU/count;
      const x = player.x + Math.cos(a)*radius;
      const y = player.y + Math.sin(a)*radius;
      if (Math.hypot(e.x-x, e.y-y) < e.r + 9) {
        if (e.orbitCooldown <= 0) {
          e.hp -= damage; e.orbitCooldown = 18;
          burst(x, y, 10, "#c8a2ff");
          burst(x, y, 5, "#ffffff");
        }
        break;
      }
    }
    if (e.hp <= 0) killEnemy(i);
  }
}
function updateLightning() {
  const p = pw("lightning");
  if (time % Math.max(15, 60 - level*3 - p*5) !== 0) return;
  const avail = enemies.slice();
  const hit = [];
  const points = [{ x: player.x, y: player.y }];
  let from = player;
  for (let c = 0; c < 2 + Math.floor(level/2) + p; c++) {
    let nearest = null, dist = Infinity;
    for (const e of avail) {
      const d = Math.hypot(e.x-from.x, e.y-from.y);
      const rng = c === 0 ? 250 : 150;
      if (d < rng && d < dist) { nearest = e; dist = d; }
    }
    if (!nearest) break;
    hit.push(nearest);
    points.push({ x: nearest.x, y: nearest.y });
    avail.splice(avail.indexOf(nearest), 1);
    from = nearest;
  }
  if (!hit.length) return;
  const damage = 2 + level*.4 + p*.8;
  for (let i = enemies.length-1; i >= 0; i--) {
    if (hit.includes(enemies[i])) {
      enemies[i].hp -= damage;
      showDamage(enemies[i].x, enemies[i].y, damage, "#66e0ff");
      if (enemies[i].hp <= 0) killEnemy(i);
    }
  }
  lightningBolts.push({ points, life: 14 });
  shake(5); chroma(3);
}

  for (let i = turrets.length-1; i >= 0; i--) {
    const t = turrets[i];
    t.life--; t.cool--;
    if (t.isDrone) {
      const p = pw("drone");
      const a = (time*0.03) + i * (TAU / turrets.length);
      const r = 60 + p*10;
      t.x = player.x + Math.cos(a) * r;
      t.y = player.y + Math.sin(a) * r;
      t.angle = a + Math.PI/2;
    }
    if (t.life <= 0) { turrets.splice(i,1); continue; }
    if (t.cool > 0) continue;
    let target = null, dist = Infinity;
    for (const e of enemies) {
      const d = Math.hypot(e.x-t.x, e.y-t.y);
      if (d < 220 && d < dist) { target = e; dist = d; }
    }
    if (target) {
      const a = Math.atan2(target.y-t.y, target.x-t.x);
      bullets.push({ x: t.x, y: t.y, vx: Math.cos(a)*10, vy: Math.sin(a)*10, size:5, damage: t.damage, hue: t.isDrone ? 190 : 25, type:"turret", life:300 });
      t.cool = t.isDrone ? 18 : 25;
    }
  }
}
function updateBlackHole(b) {
  if (b.travel > 0) { b.travel--; return; }
  b.field--; b.pulse++;
  for (const e of enemies) {
    if (e.type === "boss") continue;
    const dx = b.x - e.x;
    const dy = b.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < b.pullRadius) {
      const force = (1 - d / b.pullRadius) * 8 + 2;
      e.x += dx / d * force;
      const pullY = dy / d * force;
      e.y += (pullY < 0 ? pullY * 0.15 : pullY);
    }
    if (Math.hypot(e.x - b.x, e.y - b.y) < b.coreRadius + e.r) {
      e.hp -= b.damage;
      if (Math.random() < 0.1) showDamage(e.x, e.y, b.damage, "#9b59ff");
    }
  }
}
function updateMines() {
  for (let i = mines.length-1; i >= 0; i--) {
    const m = mines[i];
    m.life--; m.armTimer--; m.pulse += 0.15;
    if (m.life <= 0) { mines.splice(i,1); continue; }
    if (m.type === "cactus") {
      m.shootCD = (m.shootCD || 0) - 1;
      if (m.shootCD <= 0) {
        for (let k = 0; k < 6; k++) {
          const a = k / 6 * TAU + Math.random();
          bullets.push({ x: m.x, y: m.y, vx: Math.cos(a)*7, vy: Math.sin(a)*7, size: 4, damage: m.damage*0.3, hue: 120, type: "turret", life: 150 });
        }
        m.shootCD = 45;
      }
      continue;
    }
    if (m.armTimer > 0) continue;
    let exploded = false;
    for (const e of enemies) {
      if (Math.hypot(e.x-m.x, e.y-m.y) < m.r + e.r + 8) { exploded = true; break; }
    }
    if (exploded) {
      const radius = m.blastRadius;
      shockwaves.push({ x:m.x, y:m.y, radius:8, maxRadius:radius, life:20, color:"255,80,80" });
      shockwaves.push({ x:m.x, y:m.y, radius:8, maxRadius:radius*0.7, life:15, color:"255,255,0" });
      burst(m.x, m.y, 100, "#ff5555");

      burst(m.x, m.y, 30, "#ffffff");

          showDamage(en.x, en.y, m.damage, "#ff5555");

        }
      }
      mines.splice(i,1);
      break;
    }
  }
}

function shoot() {
  if (!selectedWeapon && activeWeapons.length === 0) return;
  for (const wkey of activeWeapons) {
    if (!weaponCools[wkey]) weaponCools[wkey] = 0;
    fireWeapon(wkey);
  }
  if (activeWeapons.includes("orbit") || selectedWeapon === "orbit") updateOrbit();
  if (activeWeapons.includes("lightning") || selectedWeapon === "lightning") updateLightning();
  if (activeWeapons.includes("chainsaw") || selectedWeapon === "chainsaw") {
    if (time % 8 === 0) fireChainsaw();
  }
}

function damagePlayer(amount, inv) {
  if (gameOver || player.invincible > 0) return;
  if (challengeOneHit) {
    sfx.playerHit();
    player.hp = 0; gameOver = true;
    recordGameResult(false);
    sfx.gameOver();
    shake(120); flash("#ffffff", 25);
    return;
  }
  const finalAmount = amount * getDefenseMult();
  player.hp -= finalAmount;
  player.invincible = inv + getInvincibleBonus();
  combo = 0; comboTimer = 0;
  sfx.playerHit();
  shake(50); flash("#ff0044", 12); chroma(15); hitStopAdd(8);
  burst(player.x, player.y, 70, "#ff0044");
  burst(player.x, player.y, 35, "#ffffff");
  if (player.hp <= 0) {
    player.hp = 0;
    gameOver = true;
    recordGameResult(false);
    sfx.gameOver();
    shake(120); flash("#ffffff", 25);
  }
}
function knockback(enemy, x, y, strength) {
  const dx = enemy.x - x, dy = enemy.y - y;
  const d = Math.hypot(dx, dy) || 1;
  enemy.vx = dx/d * strength;
  enemy.vy = dy/d * strength;
  enemy.flying = true;
}

function calcCoins(score, cleared, bossKills) {
  let coins = Math.floor(score / 10);
  coins += bossKills * 30;
  if (cleared) coins += 200;
  coins = Math.floor(coins / 2);
  if (studyMode) coins *= 2;
  coins = Math.floor(coins * getCoinRateMult());
  return coins;
}

function recordGameResult(cleared) {
  const key = studyMode ? "study" : (fusionMode && activeWeapons.length > 1
    ? activeWeapons.join("+")
    : selectedWeapon);
  if (!key) return;
  const earned = calcCoins(score, cleared, bossKillCount);
  saveData.coins = (saveData.coins || 0) + earned;
  saveData.totalCoinsEarned = (saveData.totalCoinsEarned || 0) + earned;
  lastEarnedCoins = earned;
  if (score > saveData.highScore) {
    saveData.highScore = score;
    highScore = score;
  }
  if (studyMode) {
    if (score > (saveData.studyHighScore || 0)) saveData.studyHighScore = score;
    if (cleared) saveData.studyClears = (saveData.studyClears || 0) + 1;
    writeSave();
    updateMissionProgressFromSession();
    return;
  }
  const rec = getWeaponRecord(key);
  if (cleared) {
    rec.cleared = true;
    rec.clearCount = (rec.clearCount || 0) + 1;
    saveData.totalClears = (saveData.totalClears || 0) + 1;
  }
  if (score > (rec.highScore || 0)) rec.highScore = score;
  if (level > (rec.maxLevel || 0)) rec.maxLevel = level;
  if (maxCombo > (rec.maxCombo || 0)) rec.maxCombo = maxCombo;
  if (wave > (rec.maxWave || 0)) rec.maxWave = wave;
  if (selectedChallenge) {
    const cr = saveData.challengeRecords[selectedChallenge] || { cleared: false, bestScore: 0, bestWave: 0 };
    if (cleared) cr.cleared = true;
    if (score > cr.bestScore) cr.bestScore = score;
    if (wave > cr.bestWave) cr.bestWave = wave;
    saveData.challengeRecords[selectedChallenge] = cr;
    if (cleared) {
      const reward = CHALLENGES[selectedChallenge].reward;
      saveData.coins = (saveData.coins || 0) + reward;
      saveData.totalCoinsEarned = (saveData.totalCoinsEarned || 0) + reward;
      lastEarnedCoins += reward;
    }
  }
  updateMissionProgressFromSession();
  writeSave();
}
let lastEarnedCoins = 0;

function updatePlayer() {
  if (player.dashTimer > 0) {
    player.x += player.dashVx;
    player.y += player.dashVy;
    player.dashTimer--;
    if (time % 2 === 0) burst(player.x, player.y, 6, "#00ffcc");
    afterImages.push({ x: player.x, y: player.y, r: player.drawR, life: 15, maxLife: 15 });
  } else {
    const sp = 5 * getSpeedMult();
    if (keys.arrowleft || keys.a) player.x -= sp;
    if (keys.arrowright || keys.d) player.x += sp;
    if (keys.arrowup || keys.w) player.y -= sp;
    if (keys.arrowdown || keys.s) player.y += sp;
  }
  if (player.dashCooldown > 0) player.dashCooldown--;
  player.x = Math.max(player.hitR, Math.min(W-player.hitR, player.x));
  player.y = Math.max(player.hitR, Math.min(H-player.hitR, player.y));
  for (let i = afterImages.length-1; i >= 0; i--) {
    afterImages[i].life--;
    if (afterImages[i].life <= 0) afterImages.splice(i,1);
  }
}

function updateBullets() {
  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    if (!b) { bullets.splice(i,1); continue; }
    if (b.type === "snake") {
      b.snakeTimer++;
      b.snakeBaseY -= 4;
      const wave = Math.sin(b.snakeTimer * 0.25) * 40;
      const waveX = Math.cos(b.snakeTimer * 0.15) * 8;
      b.x = b.snakeBaseX + wave + waveX;
      b.y = b.snakeBaseY;
      for (let j = enemies.length-1; j >= 0; j--) {
        const e = enemies[j];
        if (!e) continue;
        if (Math.hypot(e.x-b.x, e.y-b.y) < e.r + b.size) {
          e.hp -= b.damage;
          e.poisonTime = b.poisonTime; e.poisonDPS = b.poisonDPS;
          showDamage(e.x, e.y, b.damage, "#44ff44");
          burst(e.x, e.y, 10, "#44ff44");
          if (e.hp <= 0) killEnemy(j);
          bullets.splice(i,1);
          break;
        }
      }

    if (b.type === "greenfire") {

      }
      if (b.target) {
        const ta = Math.atan2(b.target.y-b.y, b.target.x-b.x);
        const ca = Math.atan2(b.vy, b.vx);
        let da = ta - ca;
        while (da > Math.PI) da -= TAU;
        while (da < -Math.PI) da += TAU;
        const na = ca + da * 0.15;
        const sp = Math.hypot(b.vx, b.vy) || 10;
        b.vx = Math.cos(na) * sp;
        b.vy = Math.sin(na) * sp;
      }
    }
    if (b.type === "piano" || b.type === "missile" || b.type === "swarm") {
      if (!b.target || b.target.hp <= 0 || !enemies.includes(b.target)) {
        let nearest = null, nd = Infinity;
        for (const e of enemies) {

      if (b.target) {

        const ca = Math.atan2(b.vy, b.vx);
        let da = ta - ca;
        while (da > Math.PI) da -= TAU;
        while (da < -Math.PI) da += TAU;
        const na = ca + da * 0.18;
        const sp = Math.hypot(b.vx, b.vy) || 8;
        b.vx = Math.cos(na) * sp;
        b.vy = Math.sin(na) * sp;
      }
    }
    if (b.type === "grenade") b.vy += b.gravity;
    b.x += b.vx; b.y += b.vy; b.life--;
    b.pulse = (b.pulse || 0) + 0.15;
    if (b.type === "oraora") b.spin = (b.spin || 0) + 0.35;
    if (b.trail && Math.random() < 0.35) {

    }
    if (b.type === "greenfire") {

        burst(b.x, b.y, 80, "#44ff44");
        burst(b.x, b.y, 40, "#ffffff");
        shake(30); flash("#44ff44", 8); chroma(10); hitStopAdd(5);
        for (let j = enemies.length-1; j >= 0; j--) {
          const e = enemies[j];
          if (Math.hypot(e.x-b.x, e.y-b.y) < r + e.r) {
